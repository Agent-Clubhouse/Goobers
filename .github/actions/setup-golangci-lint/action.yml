name: Set up golangci-lint
description: Install the repository-pinned golangci-lint version with bounded retries.

inputs:
  version:
    description: Exact golangci-lint release tag.
    required: true

runs:
  using: composite
  steps:
    - name: Install golangci-lint ${{ inputs.version }}
      shell: bash
      env:
        GOLANGCI_LINT_VERSION: ${{ inputs.version }}
      run: |
        for attempt in 1 2 3; do
          if curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
               "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
               | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"; then
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          echo "::warning::golangci-lint install attempt $attempt/3 failed; retrying"
          sleep $((attempt * 5))
        done
        echo "::error::golangci-lint install failed after 3 attempts"
        exit 1
