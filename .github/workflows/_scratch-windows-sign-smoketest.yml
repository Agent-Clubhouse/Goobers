name: Scratch — Windows Azure Trusted Signing smoketest

# Temporary validation rig for the Azure Trusted Signing credentials the
# sign-windows job in release.yml depends on. Manually triggered only. Builds
# a real cmd/goobers.exe and signs it via the exact azure/login +
# azure/trusted-signing-action path release.yml will use, against the
# existing clubhouse-win-codesign certificate profile (shared with the
# sibling Clubhouse product — same publisher identity, no new Azure
# resources). azure/trusted-signing-action requires a Windows runner (it
# invokes the Windows SDK signing client locally; only the private key stays
# in Azure). Delete this file once the credentials are confirmed working —
# it's a one-time diagnostic, not something that ships.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoketest:
    name: Sign a real goobers.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Explicit bash: the Windows runner defaults to PowerShell.
      - name: Build a real goobers.exe (windows/amd64)
        shell: bash
        run: |
          set -euo pipefail
          mkdir winsign
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o winsign/goobers.exe ./cmd/goobers
          ls -la winsign

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign goobers.exe
        uses: azure/trusted-signing-action@v1
        with:
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: Clubhouse-Win-Signing
          certificate-profile-name: clubhouse-win-codesign
          files-folder: winsign
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Confirm signature was applied
        run: |
          $sig = Get-AuthenticodeSignature -FilePath winsign\goobers.exe
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "Authenticode signature status is not Valid: $($sig.Status) ($($sig.StatusMessage))"
            exit 1
          }
