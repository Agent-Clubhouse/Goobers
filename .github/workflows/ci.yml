name: CI

# Goobers control-plane and portal CI — the enforced merge gate.
#
# The merge tier documented as `make ci` (Go fmt/vet/build/test/lint + portal
# build/test + shipped-workflow contracts) is defined once, in test/ci, and
# fanned across independent runners here so the sequential gate runs in
# parallel. Each parallel job runs one slice via `go run ./test/ci group <name>`:
#
#   checks   fmt · tidy · no-phone-home · vet · command builds · config validation · portal
#   lint     golangci-lint (staticcheck / govet / revive / errcheck / ...)
#   unit     the -race unit suite, split into shards (Linux) — the long pole
#   shipped  shipped-workflow contract suite
#
# plus deadcode, and the dedicated conformance, windows-smoke, windows-coverage,
# integration, vulnerability-scan, sandbox, and linux-validation jobs. Coverage
# of the merge tier is unchanged: the four groups are a disjoint, exhaustive
# partition of the checks the monolith used to run serially (asserted by
# test/ci's group tests).
#
# Race posture: a data race is a source-level property, not OS behaviour, so the
# full -race suite runs on Linux (sharded for wall-clock). macOS runs the same
# behavioural suite without -race (GOOBERS_CI_RACE=0), preserving macOS-specific
# behaviour while dropping the ~3-5x race instrumentation cost — there is no
# darwin-tagged concurrent code for a second -race platform to cover.
#
# Windows is gated as a REQUIRED, GREEN build+vet+runtime smoke (#633). The
# platform slices, the Windows gate, the vulnerability scan, and the journal
# conformance job must all be green for the required `make ci` check (the
# required-ci aggregator, whose NAME is pinned by the branch ruleset) to pass.
#
# windows-coverage (#2031) is the deliberate, reviewed boundary for WHICH
# packages windows-smoke's go-test steps actually exercise: every package is
# either named there or explicitly recorded, with a reason, in
# test/windowscoverage/skip-inventory.txt — never a silent, undocumented gap.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

# Least privilege: CI only needs to read the checkout.
permissions:
  actions: read
  contents: read

# One in-flight run per ref; newer pushes cancel stale runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin lint to the version the Makefile/ADO pipeline targeted (schema v2 config).
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  # Platform-independent unreachable-production-code report. Ran once (it was a
  # per-OS step of the old monolith; nothing about it is OS-specific).
  deadcode:
    name: dead-code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Dead-code analysis
        run: make deadcode

  # Windows test-surface coverage inventory (#2031): every package must be
  # exercised by a windows-smoke go-test step, or explicitly recorded (with a
  # reason) in test/windowscoverage/skip-inventory.txt. Static analysis only
  # (go list, never go test), so this runs on Linux like deadcode above —
  # it audits which packages are accounted for, not whether their Windows
  # tests actually pass (that's windows-smoke's job).
  windows-coverage:
    name: windows test-surface coverage inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Windows coverage inventory
        run: make windows-coverage

  # Fast fan-in: formatting, module hygiene, the no-phone-home guard, vet,
  # command builds, config validation, and the portal build/test/contract
  # chain. The only slice that needs Node. Runs on Linux only — its work is
  # either OS-agnostic (fmt, tidy, security guard, portal) or covered for other
  # platforms by cross-compilation (darwin-build, windows-smoke). Keeping static
  # analysis off the scarce macOS runners lets the macOS *runtime* jobs run
  # without queueing behind each other.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: fmt · tidy · no-phone-home · vet · build · portal
        run: go run ./test/ci group checks

  # golangci-lint (staticcheck/govet/revive/...) per target GOOS, both on cheap
  # Linux runners. golangci-lint honours GOOS, so it sees each platform's
  # build-tagged sources (the darwin-only files internal/{sandbox,executor}) are
  # linted under GOOS=darwin from Linux — no macOS runner required.
  lint:
    name: lint (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        # Explicit bash for pipefail: without it the pipeline reports only sh's
        # status, so a failed curl would feed an empty script to a shell that
        # exits 0 and the step would "succeed" with no linter installed.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
                 "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
                 | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"; then
              echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "::warning::golangci-lint install attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::golangci-lint install failed after 3 attempts"
          exit 1

      - name: golangci-lint (GOOS=${{ matrix.goos }})
        # GOOBERS_LINT_GOOS sets GOOS for the golangci-lint subprocess only.
        # Setting ambient GOOS here would cross-build the `go run ./test/ci`
        # launcher for the target and fail to exec it on the Linux host.
        env:
          GOOBERS_LINT_GOOS: ${{ matrix.goos }}
        run: go run ./test/ci group lint

  # darwin build+vet gate, cross-compiled on Linux (mirrors windows-smoke).
  # Compiles and vets the whole tree — including the //go:build darwin files
  # (internal/{sandbox,executor}) — for macOS, so a darwin-specific build or vet
  # regression is caught without spending a macOS runner. The behavioural macOS
  # runtime is exercised by the unit/shipped/sandbox macOS jobs.
  darwin-build:
    name: darwin gate (build · vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: go build (darwin/arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build ./...

      - name: go vet (darwin/arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go vet ./...

  # The long pole: the -race unit suite. Split into shards across Linux runners
  # (test/ci group unit + GOOBERS_CI_SHARD; the hermetic runner partitions
  # `go list ./...` deterministically, proven disjoint + exhaustive by
  # TestSelectShardPartitionsExactly). Full git history is required — the DSL
  # SemVer-compatibility tests read the latest reachable tag.
  unit:
    name: unit race shard ${{ matrix.shard }} (linux)
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Unit suite (-race, shard ${{ matrix.shard }})
        env:
          GOOBERS_CI_SHARD: ${{ matrix.shard }}
        run: go run ./test/ci group unit

  # macOS runs the whole behavioural unit suite (no -race) in one process, so it
  # owns the per-test timing budget artifact and the informational coverage
  # profile. Race coverage is provided by the Linux shards above.
  unit-macos:
    name: unit behavioral suite (macos)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Find previous main timing run
        id: previous-timing
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              status: "success",
              per_page: 20,
            });
            const previous = data.workflow_runs.find(
              run => run.id !== context.runId,
            );
            return previous ? String(previous.id) : "";
          result-encoding: string

      - name: Download previous timing artifact
        if: ${{ steps.previous-timing.outputs.result != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-timings-${{ runner.os }}
          path: previous-test-timings
          run-id: ${{ steps.previous-timing.outputs.result }}
          github-token: ${{ github.token }}

      - name: Unit suite (behavioral, no -race)
        env:
          GOOBERS_CI_RACE: "0"
          GOOBERS_TEST_TIMING_FILE: test-timings/unit-${{ runner.os }}.json
        run: go run ./test/ci group unit

      - name: Report test timing budget
        if: ${{ !cancelled() && hashFiles(format('test-timings/unit-{0}.json', runner.os)) != '' }}
        run: >-
          go run ./test/testtiming report
          -budget .github/test-timing-budgets.json
          -current test-timings/unit-${{ runner.os }}.json
          -previous previous-test-timings/unit-${{ runner.os }}.json

      # Diagnostic artifacts, not gates. The reads of this same timing data
      # already tolerate failure (see "Find previous main timing run" and
      # "Download previous timing artifact"), so a failed WRITE must not fail
      # the merge gate either. A transient artifact-service DNS error took main
      # red on a669fc3a while the unit suite itself had passed.
      - name: Upload test timing
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ runner.os }}
          path: test-timings/unit-${{ runner.os }}.json
          if-no-files-found: warn

      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ runner.os }}
          path: coverage.out
          if-no-files-found: ignore

  # Shipped-workflow contract suite. Linux runs it with -race; macOS runs the
  # same behavioural suite without -race. Replaces both the old in-gate
  # shipped-workflows step and the separate non-race shipped-workflows job.
  shipped:
    name: shipped workflow contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "1"
          - os: macos-latest
            race: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Shipped-workflow contracts
        env:
          GOOBERS_CI_RACE: ${{ matrix.race }}
        run: go run ./test/ci group shipped

  integration:
    name: declared-dependency integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      # Keep this list aligned with the inventory printed by
      # `make test-integration`. Strict mode makes an absent executable red.
      - name: Provision declared dependencies (bash, bwrap, dirname, head, mkdir, sh, sleep, yes)
        run: |
          sudo apt-get update
          sudo apt-get install --yes bash bubblewrap coreutils dash
          # Ubuntu 24.04 restricts the user namespace needed by bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run strict integration tier
        run: make test-integration-strict

  conformance:
    name: journal conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Enforce the journal conformance contract
        run: make test-conformance

  # Windows joins CI as a REQUIRED, GREEN runtime gate (#633/#752) — deliberately not
  # the old advisory `continue-on-error` `windows-smoke` job (#928) that #960 had
  # to remove: that one published a red check the Goobers merge flow (which has no
  # notion of an advisory check, see #961) read as a hard block. This one is
  # different in kind — it actually passes. It cross-checks that the whole tree
  # builds and vets for Windows, then runs focused native-runtime regressions,
  # green as of #623's proc Job-Object impl + the build-tags on the unix-only
  # commands/tests. That makes it safe to gate on: it only reds on a real,
  # fixable Windows regression — never as an expected-red. The focused tests
  # exercise platform seams, then the node validation drives the real foreground
  # daemon and canonical fake-harness implementation workflow end to end.
  windows-smoke:
    name: windows gate (build · vet · runtime smoke)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Platform-scoped Go cache (setup-go keys by runner OS/arch), so the
      # windows leg neither shares nor evicts the ubuntu/macos caches.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      # Compiles every package for windows/amd64, including the //go:build windows
      # files (internal/platform/proc, lock, winsvc, safeopen) that no other gate
      # exercises. `go build ./...` skips _test.go files; `go vet ./...` compiles
      # them too, so a windows-incompatible test also gets caught.
      - name: go build (windows/amd64)
        run: go build ./...

      - name: go vet (windows/amd64)
        run: go vet ./...

      # #1603: on Windows, GNU Make invokes $(shell ...) through cmd.exe, not
      # a POSIX shell — the Makefile's DATE variable used a Linux-only
      # `date -u +%Y-%m-%dT%H:%M:%SZ`, which cmd.exe's own `date` builtin
      # doesn't understand at all, corrupting the linker's -X ldflags
      # argument. Nothing in this job exercised the Makefile itself (only raw
      # `go build`), so this regressed silently. Installing `make` via
      # Chocolatey (pre-installed on GitHub-hosted Windows runners)
      # reproduces the real failure mode exactly, rather than assuming some
      # possibly-different make is already on PATH. scheduler is a
      # portal-free command (unlike goobers, whose build-goobers target also
      # runs a full npm portal rebuild), so this stays a cheap, direct guard
      # on the Makefile's own cross-platform shell portability rather than a
      # portal build smoke test — that's covered elsewhere.
      - name: Install make (windows)
        run: choco install make --no-progress -y

      - name: make build (windows)
        run: make build-scheduler

      # #2031: internal/platform/shutdown has a real _windows_test.go
      # counterpart (raise_windows_test.go, mirroring raise_unix_test.go) that
      # was never wired into this job — an accident of the allowlist's
      # history, not a deliberate exclusion, per the coverage inventory below.
      - name: Windows platform runtime
        run: go test ./internal/platform/durability ./internal/platform/proc ./internal/platform/secfile ./internal/platform/shutdown

      # #2031: internal/instance already carries a Windows-specific test file
      # (gitsource_windows_test.go, mirroring gitsource_unix_test.go) that was
      # never run here — same accidental-gap shape as platform/shutdown above.
      - name: Windows instance config
        run: go test ./internal/instance

      - name: Windows inline script runtime
        run: go test ./internal/executor -run '^TestShellExecutor_RunScript$'

      - name: Windows credential files
        run: go test ./internal/credentials -run 'TestResolverResolvesFromOwnerOnlyFile'

      - name: Windows containment and journals
        run: go test ./api/v1alpha1 ./internal/configboundary ./internal/journal

      # The read model and its sibling stores open SQLite files BY PATH, which
      # is the single operation whose behaviour differs most between Windows and
      # POSIX — and none of these packages were covered here until #1997.
      #
      # That bug was `file:` + url.URL{Path: "C:/dir/intake.db"}.String(), which
      # yields `file:./C:/...` because url.URL prefixes `./` to any first
      # segment containing a colon. SQLite answered SQLITE_CANTOPEN, the daemon
      # logged a warning, and the intake store was silently unavailable on every
      # Windows install. `go build` and `go vet` cannot see it: the expression is
      # valid Go, and the fault only appears when something CONSTRUCTS a URI from
      # a Windows path at runtime.
      #
      # POSIX paths begin with `/`, so the first segment is empty and the bug is
      # unreachable on Linux and macOS — which is exactly why a full green suite
      # on those platforms proved nothing about this.
      - name: Windows read model and stores
        run: go test ./internal/readmodel/... ./internal/readservice

      - name: Windows worktree and event stream
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.safecrlf
          GIT_CONFIG_VALUE_1: "false"
        run: go test ./internal/worktree ./internal/httpapi -run 'TestManager_Create_ExcludesHarnessScratch|TestDefinitionInvalidationFollowsExplicitReadModelCommit'

      - name: Windows CLI runtime
        run: go test ./cmd/goobers -run 'TestListenDashboardReportsConflictAndCanIncrement|TestReadDirectoryDistinguishesMissingFromFile'

      # #2031: test/windowsvalidate had zero test coverage of its own —
      # everything it does was "verified" only by whether the end-to-end walk
      # below happened to pass. Its pure projection/path logic (stageGateSequence,
      # repositoryRootFrom, firstLine, environmentValue) now has direct unit tests.
      - name: Windows validation harness unit tests
        run: go test ./test/windowsvalidate

      - name: Build Windows validation binary
        run: go build -o bin/goobers.exe ./cmd/goobers

      - name: Validate Windows daemon and implementation workflow
        run: go run ./test/windowsvalidate -bin bin/goobers.exe -out bin/windows-validation-evidence

      - name: Upload Windows validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-evidence
          path: bin/windows-validation-evidence/
          if-no-files-found: warn

  vulnerability-scan:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan reachable Go code
        run: make vulncheck

  required-ci:
    name: make ci (fmt-check · vet · build · test · lint)
    if: ${{ always() }}
    needs: [checks, lint, darwin-build, unit, unit-macos, shipped, deadcode, windows-smoke, windows-coverage, vulnerability-scan, conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required gates
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DARWIN_BUILD_RESULT: ${{ needs.darwin-build.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          UNIT_MACOS_RESULT: ${{ needs.unit-macos.result }}
          SHIPPED_RESULT: ${{ needs.shipped.result }}
          DEADCODE_RESULT: ${{ needs.deadcode.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          WINDOWS_COVERAGE_RESULT: ${{ needs.windows-coverage.result }}
          VULNCHECK_RESULT: ${{ needs.vulnerability-scan.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
        run: |
          fail=0
          check() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 did not pass (result: $2)"
              fail=1
            fi
          }
          check "checks (fmt/tidy/vet/build/portal)" "$CHECKS_RESULT"
          check "lint (golangci-lint, linux+darwin)" "$LINT_RESULT"
          check "darwin build/vet gate"              "$DARWIN_BUILD_RESULT"
          check "unit -race suite (linux shards)"    "$UNIT_RESULT"
          check "unit behavioral suite (macos)"      "$UNIT_MACOS_RESULT"
          check "shipped-workflow contracts"         "$SHIPPED_RESULT"
          check "dead-code analysis"                 "$DEADCODE_RESULT"
          check "windows build/vet/runtime gate"     "$WINDOWS_RESULT"
          check "windows test-surface coverage inventory" "$WINDOWS_COVERAGE_RESULT"
          check "Go vulnerability scan"              "$VULNCHECK_RESULT"
          check "journal conformance"                "$CONFORMANCE_RESULT"
          exit "$fail"

  sandbox:
    name: sandbox confinement (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 (ubuntu-latest) restricts unprivileged user
          # namespaces via AppArmor, which bubblewrap needs to set up its
          # uid map. Relax it so the confinement probe can create the
          # sandbox namespace on the hosted runner. Tolerate the knob being
          # absent (future runner images / kernels): the confinement test
          # itself, run with GOOBERS_REQUIRE_SANDBOX_TEST=1, remains the
          # authoritative gate.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Exercise native sandbox
        run: make sandbox-check

  # Linux node validation (#636): prove the shipped binary end to end on Linux —
  # an offline demo run to completion plus the full daemon start/status/stop
  # lifecycle under a real SIGTERM — and cross-compile the Windows supervision
  # handler (#639). Deterministic and offline, so it is a reliable required gate.
  linux-validation:
    name: linux node validation (#636/#639)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Reproduce this full-tier platform gate locally with the same target.
      - name: Validate Linux node and Windows platform seams
        run: make linux-node-validation

      - name: Upload Linux validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-validation-evidence
          path: bin/linux-validation-evidence/
          if-no-files-found: warn
