name: CI

# Goobers control-plane and portal CI — the enforced merge gate.
#
# The merge tier documented as `make ci` (Go fmt/vet/build/test/lint + portal
# build/test + shipped-workflow contracts) is defined once, in test/ci, and
# fanned across independent runners here so the sequential gate runs in
# parallel. Each parallel job runs one slice via `go run ./test/ci group <name>`:
#
#   checks   fmt · tidy · no-phone-home · vet · command builds · config validation · portal
#   lint     golangci-lint (staticcheck / govet / revive / errcheck / ...)
#   unit     the -race unit suite, split into shards (Linux) — the long pole
#   shipped  shipped-workflow contract suite on Linux, macOS, and Windows
#
# plus deadcode, and the dedicated deploy-reference, conformance, windows-smoke,
# integration, vulnerability-scan, sandbox, and linux-validation jobs. Coverage
# of the merge tier is unchanged: the four groups are a disjoint, exhaustive
# partition of the checks the monolith used to run serially (asserted by
# test/ci's group tests).
#
# Race posture: a data race is a source-level property, not OS behaviour, so the
# full -race suite runs on Linux (sharded for wall-clock). macOS runs the same
# behavioural suite without -race (GOOBERS_CI_RACE=0), preserving macOS-specific
# behaviour while dropping the ~3-5x race instrumentation cost — there is no
# darwin-tagged concurrent code for a second -race platform to cover.
#
# Windows is gated as a REQUIRED, GREEN build+vet+runtime smoke (#633) plus the
# shipped-workflow contract suite. The broad Windows behavioural tier is NOT
# here: enabling it surfaced 670 failures across 19 packages, tracked separately.
# The platform slices, the Windows gates, the vulnerability scan, and the journal
# conformance job must all be green for the required `make ci` check (the
# required-ci aggregator, whose NAME is pinned by the branch ruleset) to pass.
#
# Pull requests and merge groups run that complete matrix. A push to main also
# validates the exact landed SHA with checks, lint, the Linux race shards, the
# macOS behavioral suite, shipped-workflow contracts, and the Windows gate.
# Failures on the landed tree are automatically escalated as critical issues.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

# Least privilege: CI only needs to read the checkout.
permissions:
  actions: read
  contents: read

# One in-flight run per ref; newer pushes cancel stale runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin lint to the version the Makefile/ADO pipeline targeted (schema v2 config).
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  unit-gate:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install Portal dependencies and pinned Chromium
        # Retried because these are the repo's dominant CI flake (#3139): npm
        # and the Chromium download stall on registry/CDN hiccups and eat the
        # whole timeout, unlike go mod download and golangci-lint which
        # already retry. Six timeouts in one night on the v0.2.0 wave.
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            # Per-attempt timeout: tonight's evolved failure mode is npm/CDN
            # HANGING rather than failing (#3139) — without this, one stalled
            # attempt eats the whole step window and the retry never cycles.
            if timeout 240 npm --prefix portal ci --no-audit --no-fund \
              && timeout 240 npm --prefix portal exec -- playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::portal/Chromium install attempt ${attempt} failed or hung; retrying"
            sleep $((attempt * 10))
          done
          echo "portal/Chromium install failed after 3 attempts" >&2
          exit 1

      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -o pipefail
          curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
            "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run unit gate
        run: make ci

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run end-to-end gate
        run: make test-e2e

  envtest:
    name: envtest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Provision envtest and run the integration gate
        run: make test-envtest

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Enforce the repository coverage threshold
        run: make cover-check

      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  # Platform-independent unreachable-production-code report. Ran once (it was a
  # per-OS step of the old monolith; nothing about it is OS-specific).
  deadcode:
    name: dead-code analysis
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Dead-code analysis
        run: make deadcode

  # Fast fan-in: formatting, module hygiene, the no-phone-home guard, vet,
  # command builds, config validation, and the portal build/test/contract
  # chain. The only slice that needs Node. Runs on Linux only — its work is
  # either OS-agnostic (fmt, tidy, security guard, portal) or covered for other
  # platforms by cross-compilation (darwin-build, windows-smoke). Keeping static
  # analysis off the scarce macOS runners lets the macOS *runtime* jobs run
  # without queueing behind each other.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Install Portal dependencies and pinned Chromium
        # Retried because these are the repo's dominant CI flake (#3139): npm
        # and the Chromium download stall on registry/CDN hiccups and eat the
        # whole timeout, unlike go mod download and golangci-lint which
        # already retry. Six timeouts in one night on the v0.2.0 wave.
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            # Per-attempt timeout: tonight's evolved failure mode is npm/CDN
            # HANGING rather than failing (#3139) — without this, one stalled
            # attempt eats the whole step window and the retry never cycles.
            if timeout 240 npm --prefix portal ci --no-audit --no-fund \
              && timeout 240 npm --prefix portal exec -- playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::portal/Chromium install attempt ${attempt} failed or hung; retrying"
            sleep $((attempt * 10))
          done
          echo "portal/Chromium install failed after 3 attempts" >&2
          exit 1

      - name: fmt · tidy · no-phone-home · vet · build · portal
        run: go run ./test/ci group checks

  deploy-reference:
    name: deploy reference manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Render and schema-check reference manifests
        run: make deploy-validate

  # golangci-lint (staticcheck/govet/revive/...) per target GOOS, all on cheap
  # Linux runners. golangci-lint honours GOOS, so it sees each platform's
  # build-tagged sources (the darwin-only files internal/{sandbox,executor},
  # the windows-only files internal/{winsvc,platform/proc,platform/lock,
  # platform/durability}, safeopen_windows.go, test/windowsvalidate, etc.) are
  # linted under GOOS=darwin/windows from Linux — no macOS or Windows runner
  # required. #2016: before this leg existed, every windows-only file was
  # staticcheck/revive-exempt (build+vet only), which is exactly the class of
  # gap the repo has already been bitten by once (SA4032 via build-tag-dead
  # branches).
  lint:
    name: lint (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        timeout-minutes: 8
        # Explicit bash for pipefail: without it the pipeline reports only sh's
        # status, so a failed curl would feed an empty script to a shell that
        # exits 0 and the step would "succeed" with no linter installed.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
                 "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
                 | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"; then
              echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "::warning::golangci-lint install attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::golangci-lint install failed after 3 attempts"
          exit 1

      - name: golangci-lint (GOOS=${{ matrix.goos }})
        # GOOBERS_LINT_GOOS sets GOOS for the golangci-lint subprocess only.
        # Setting ambient GOOS here would cross-build the `go run ./test/ci`
        # launcher for the target and fail to exec it on the Linux host.
        env:
          GOOBERS_LINT_GOOS: ${{ matrix.goos }}
        run: go run ./test/ci group lint

  # darwin build+vet gate, cross-compiled on Linux (mirrors windows-smoke).
  # Compiles and vets the whole tree — including the //go:build darwin files
  # (internal/{sandbox,executor}) — for macOS, so a darwin-specific build or vet
  # regression is caught without spending a macOS runner. The behavioural macOS
  # runtime is exercised by the unit/shipped/sandbox macOS jobs.
  darwin-build:
    name: darwin gate (build · vet)
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: go build (darwin/arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build ./...

      - name: go vet (darwin/arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go vet ./...

  # The long pole: the -race unit suite. Split into shards across Linux runners
  # (test/ci group unit + GOOBERS_CI_SHARD; the hermetic runner partitions
  # `go list ./...` deterministically, proven disjoint + exhaustive by
  # TestSelectShardPartitionsExactly). Full git history is required — the DSL
  # SemVer-compatibility tests read the latest reachable tag.
  unit:
    name: unit race shard ${{ matrix.shard }} (linux)
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Unit suite (-race, shard ${{ matrix.shard }})
        env:
          GOOBERS_CI_SHARD: ${{ matrix.shard }}
        run: go run ./test/ci group unit

  # macOS runs the whole behavioural unit suite (no -race) in one process, so it
  # owns the per-test timing budget artifact and the informational coverage
  # profile. Race coverage is provided by the Linux shards above.
  unit-macos:
    name: unit behavioral suite (macos)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Find previous main timing run
        id: previous-timing
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              status: "success",
              per_page: 20,
            });
            const previous = data.workflow_runs.find(
              run => run.id !== context.runId,
            );
            return previous ? String(previous.id) : "";
          result-encoding: string

      - name: Download previous timing artifact
        if: ${{ steps.previous-timing.outputs.result != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-timings-${{ runner.os }}
          path: previous-test-timings
          run-id: ${{ steps.previous-timing.outputs.result }}
          github-token: ${{ github.token }}

      - name: Unit suite (behavioral, no -race)
        env:
          GOOBERS_CI_RACE: "0"
          GOOBERS_TEST_TIMING_FILE: test-timings/unit-${{ runner.os }}.json
        run: go run ./test/ci group unit

      - name: Report test timing budget
        if: ${{ !cancelled() && hashFiles(format('test-timings/unit-{0}.json', runner.os)) != '' }}
        run: >-
          go run ./test/testtiming report
          -budget .github/test-timing-budgets.json
          -current test-timings/unit-${{ runner.os }}.json
          -previous previous-test-timings/unit-${{ runner.os }}.json

      # Diagnostic artifacts, not gates. The reads of this same timing data
      # already tolerate failure (see "Find previous main timing run" and
      # "Download previous timing artifact"), so a failed WRITE must not fail
      # the merge gate either. A transient artifact-service DNS error took main
      # red on a669fc3a while the unit suite itself had passed.
      - name: Upload test timing
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ runner.os }}
          path: test-timings/unit-${{ runner.os }}.json
          if-no-files-found: warn

      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ runner.os }}
          path: coverage.out
          if-no-files-found: ignore

  # Shipped-workflow contract suite. Linux runs it with -race; macOS and Windows
  # run the same behavioural suite without -race.
  shipped:
    name: shipped workflow contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "1"
            timeout: "20m"
          - os: macos-latest
            race: "0"
            timeout: "20m"
          - os: windows-latest
            race: "0"
            timeout: "40m"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Shipped-workflow contracts
        env:
          GOOBERS_CI_RACE: ${{ matrix.race }}
          GOOBERS_CI_TEST_TIMEOUT: ${{ matrix.timeout }}
        run: go run ./test/ci group shipped

  integration:
    name: declared-dependency integration
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      # Keep this list aligned with the inventory printed by
      # `make test-integration`. Strict mode makes an absent executable red.
      - name: Provision declared dependencies (bash, bwrap, dirname, head, java, mkdir, mvn, sh, sleep, yes)
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install --yes bash bubblewrap coreutils dash maven
          # Ubuntu 24.04 restricts the user namespace needed by bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run strict integration tier
        env:
          GOOBERS_JAVA_E2E: "1"
        run: make test-integration-strict

  conformance:
    name: journal conformance
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Enforce the journal conformance contract
        run: make test-conformance

  # Windows joins CI as a REQUIRED, GREEN runtime gate (#633/#752) — deliberately not
  # the old advisory `continue-on-error` `windows-smoke` job (#928) that #960 had
  # to remove: that one published a red check the Goobers merge flow (which has no
  # notion of an advisory check, see #961) read as a hard block. This one is
  # different in kind — it actually passes. It cross-checks that the whole tree
  # builds and vets for Windows, then runs focused native-runtime regressions,
  # green as of #623's proc Job-Object impl + the build-tags on the unix-only
  # commands/tests. That makes it safe to gate on: it only reds on a real,
  # fixable Windows regression — never as an expected-red. The focused tests
  # exercise platform seams, then the node validation drives the real foreground
  # daemon and canonical fake-harness implementation workflow end to end.
  #
  # #2048: that "never an expected-red" contract briefly went false — two
  # focused tests (proc's attach/resume test, dashboard's port-increment
  # test) carried fixed timeouts/ephemeral-port assumptions too tight for a
  # loaded Windows runner's real process-spawn latency and Hyper-V/WinNAT's
  # dynamic-port-range exclusions, each evicting a merge_group entry. Both
  # were root-caused and fixed at the source (a generous, still-deterministic
  # wait deadline; a fixed low test port outside the dynamic range) rather
  # than quarantined — #664's quarantine machinery doesn't exist in this repo
  # yet, and per its own scope note explicitly excludes required-gate jobs
  # like this one regardless. The contract stands restored, not weakened.
  #
  # COVERAGE BOUNDARY (#2031) — this job runs a curated selection, NOT
  # `go test ./...`, and that is a deliberate, measured choice rather than an
  # accident of history. #2031 offered two ways to close the "what isn't
  # tested on Windows?" gap: widen to the full default-tag suite accepting the
  # runtime cost, or enumerate the excluded set as a reviewed artifact. The
  # widening was built and measured first (PR #2364) and rejected on cost:
  # the full suite could not finish inside 30min-per-package, with
  # ./cmd/goobers and ./internal/runner both dying on `panic: test timed out
  # after 30m0s` and the job still red at 43min — against a historic median of
  # ~10min for this gate. Cost is concentrated in four packages (cmd/goobers
  # >30min, internal/runner >30min, test/shippedworkflows ~22min, test/scale
  # ~22min); nearly everything else is seconds. Sharding does not rescue it,
  # because the critical path is a single package that alone exceeds the
  # budget. So: packages that are cheap on Windows run WHOLE, and the four
  # expensive ones are entered by named test only, each name justified inline
  # below by the platform seam it covers. The widening run was not wasted —
  # every Windows fault it surfaced is fixed, and the tests covering those
  # fixes are what the selection below was extended to include. The remaining
  # obligation from #2031 — a build-tag-policed inventory of what Windows
  # still does not run, so the gap stays a reviewed artifact instead of an
  # accident — is tracked separately in #2791.
  windows-smoke:
    name: windows gate (build · vet · runtime smoke)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Platform-scoped Go cache (setup-go keys by runner OS/arch), so the
      # windows leg neither shares nor evicts the ubuntu/macos caches.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      # Compiles every package for windows/amd64, including the //go:build windows
      # files (internal/platform/proc, lock, winsvc, safeopen) that no other gate
      # exercises. `go build ./...` skips _test.go files; `go vet ./...` compiles
      # them too, so a windows-incompatible test also gets caught.
      - name: go build (windows/amd64)
        run: go build ./...

      - name: go vet (windows/amd64)
        run: go vet ./...

      # #1603: on Windows, GNU Make invokes $(shell ...) through cmd.exe, not
      # a POSIX shell — the Makefile's DATE variable used a Linux-only
      # `date -u +%Y-%m-%dT%H:%M:%SZ`, which cmd.exe's own `date` builtin
      # doesn't understand at all, corrupting the linker's -X ldflags
      # argument. Nothing in this job exercised the Makefile itself (only raw
      # `go build`), so this regressed silently. Installing `make` via
      # Chocolatey (pre-installed on GitHub-hosted Windows runners)
      # reproduces the real failure mode exactly, rather than assuming some
      # possibly-different make is already on PATH. scheduler is a
      # portal-free command (unlike goobers, whose build-goobers target also
      # runs a full npm portal rebuild), so this stays a cheap, direct guard
      # on the Makefile's own cross-platform shell portability rather than a
      # portal build smoke test — that's covered elsewhere.
      - name: Install make (windows)
        timeout-minutes: 8
        run: choco install make --no-progress -y

      - name: make build (windows)
        run: make build-scheduler

      - name: Windows platform runtime
        run: go test ./internal/platform/durability ./internal/platform/proc ./internal/platform/secfile

      - name: Windows service transitions
        run: go test ./internal/winsvc

      # Both packages run whole rather than by named test: each costs well
      # under a second on Windows, so a name allowlist here buys no runtime
      # and only creates a way for a new test to silently miss the platform.
      # #2031 widened these from single -run selections after the executor's
      # cmd.exe batch-file routing (script_windows.go) turned out to be
      # exercised by no gated test at all.
      - name: Windows inline script runtime
        run: go test ./internal/executor

      - name: Windows credential files
        run: go test ./internal/credentials

      - name: Windows self-update
        run: go test ./internal/selfupdate

      # Both are real Windows faults fixed under #2031 whose only coverage
      # lives in an existing test that no gated selection ran:
      # harness/claude.go let an ambient USERPROFILE override an explicitly
      # set HOME; agentkit/bundle.go trusted the OS's reported executable bit,
      # which neither embed.FS nor NTFS can express, so the embedded and
      # from-disk toolkit builders diverged. Both are cheap, so they run whole.
      - name: Windows harness and toolkit
        run: go test ./internal/harness ./internal/agentkit

      - name: Windows containment and journals
        run: go test ./api/v1alpha1 ./internal/configboundary ./internal/journal

      # The whole package, not one named test. #3064 added this step scoped to
      # TestCreateLegacyRuntimeAliasCreatesJunction only, which passed while the
      # four migration tests that actually exercise alias *resolution* stayed
      # unrun on Windows — the same "green because it never executes" gap #3064
      # set out to close (#2862, and the junction-resolution fix in this change).
      - name: Windows instance runtime
        run: go test ./internal/instance

      # Named, not the whole package: internal/telemetry/rollup's suite runs
      # ~15s on Linux and isn't otherwise Windows-sensitive, so only the two
      # tests that actually exercise canonicalRunsRoot's dependency on
      # instance.ResolveRuntimeAlias run here. Without this step they only ran
      # under unit-gate (ubuntu-latest), where ResolveRuntimeAlias takes the
      # plain-symlink branch and the Windows reparse-point junction parser in
      # runtime_alias_windows.go — the one this PR's alias-dedup fix depends
      # on — stayed unexercised on the only platform where it runs (#3280).
      - name: Windows rollup migration alias dedup
        run: go test ./internal/telemetry/rollup -run 'TestBackfillCICheckFailuresDedupesSymlinkedRunsRoot|TestCanonicalRunsRootDedupesSymlinkAlias'

      # The read model and its sibling stores open SQLite files BY PATH, which
      # is the single operation whose behaviour differs most between Windows and
      # POSIX — and none of these packages were covered here until #1997.
      #
      # That bug was `file:` + url.URL{Path: "C:/dir/intake.db"}.String(), which
      # yields `file:./C:/...` because url.URL prefixes `./` to any first
      # segment containing a colon. SQLite answered SQLITE_CANTOPEN, the daemon
      # logged a warning, and the intake store was silently unavailable on every
      # Windows install. `go build` and `go vet` cannot see it: the expression is
      # valid Go, and the fault only appears when something CONSTRUCTS a URI from
      # a Windows path at runtime.
      #
      # POSIX paths begin with `/`, so the first segment is empty and the bug is
      # unreachable on Linux and macOS — which is exactly why a full green suite
      # on those platforms proved nothing about this.
      - name: Windows read model and stores
        run: go test ./internal/readmodel/... ./internal/readservice

      - name: Windows worktree and event stream
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.safecrlf
          GIT_CONFIG_VALUE_1: "false"
        # The pinned path-length tests are named rather than running
        # ./internal/worktree whole: the full package is ~4.5min on Windows,
        # nearly half this job's historic budget, and these four are the ones
        # that cover the platform seam. `git clone` does not inherit the
        # source repo's config, so a fresh pin started without core.longpaths
        # and the very next ref-rewriting operation could fail with
        # ERROR_FILENAME_EXCED_RANGE (#2031). The preflight tests alongside
        # them guard the budget arithmetic that is supposed to catch it first.
        run: go test ./internal/worktree ./internal/httpapi -run 'TestManager_Create_ExcludesHarnessScratch|TestDefinitionInvalidationFollowsExplicitReadModelCommit|TestAcquirePinnedAppliesPathLengthPreflightBeforeCheckout|TestManagerCreatePathLengthPreflightRefusesBeforeCheckout|TestManagerCreatePathLengthPreflightSyncBaseIncludesBaseRef|TestPinnedWorkspaceIsOutsideRetentionInventory'

      # Named, not the whole package: ./release is ~2.75min on Windows. These
      # cover agent_toolkit.go's half of the SourceMode parity fix above (the
      # from-disk builder, whose manifest has to match the embedded one byte
      # for byte) and the install-script writer's file-mode fixture.
      - name: Windows release packaging
        run: go test ./release -run 'TestAgentToolkit|TestWriteInstallScript'

      # ./cmd/goobers whole exceeds 30min on Windows, so this stays named.
      # TestBuildSchedulerSetupRejectsConfigChangedDuringStartup is the only
      # test that drives buildSchedulerSetup's failure path, where the read
      # model and intake store handles used to leak: harmless on POSIX, but
      # on Windows the open handles keep the temp dir's *.db files locked and
      # the test's own cleanup then fails (#2031).
      # TestBuildSchedulerSetupWiresConfiguredTimezone loads America/New_York
      # with GOROOT and ZONEINFO isolated from setup-go's timezone archive, so
      # Windows must use the CLI's embedded time/tzdata import (#2863).
      # TestValidatePlanDetectsLiveParentConflict guards the API read cache's
      # bounded CreateFile fallback, which is only observable on Windows.
      # TestRunDashboardContextAcceptsNonLoopbackListenWithAuth exercises the
      # non-loopback contract through the loopback-only test listener, guarding
      # against firewall prompts for the temporary test executable (#3114).
      - name: Windows CLI runtime
        run: go test ./cmd/goobers -run 'TestListenDashboardReportsConflictAndCanIncrement|TestReadDirectoryDistinguishesMissingFromFile|TestBuildSchedulerSetupRejectsConfigChangedDuringStartup|TestBuildSchedulerSetupWiresConfiguredTimezone|TestValidatePlanDetectsLiveParentConflict|TestRunDashboardContextAcceptsNonLoopbackListenWithAuth'

      - name: Build Windows validation binary
        run: go build -o bin/goobers.exe ./cmd/goobers

      - name: Validate Windows daemon and implementation workflow
        run: go run ./test/windowsvalidate -bin bin/goobers.exe -out bin/windows-validation-evidence

      - name: Upload Windows validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-evidence
          path: bin/windows-validation-evidence/
          if-no-files-found: warn

  vulnerability-scan:
    name: Go vulnerability scan
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan reachable Go code
        run: make vulncheck

  required-ci:
    name: make ci (fmt-check · vet · build · test · lint)
    if: ${{ always() && github.event_name != 'push' }}
    # unit-gate, e2e, envtest, and coverage joined in #3206. #3152 added those
    # four jobs intending to make them required, but never added them here — and
    # this aggregate is the only context the branch ruleset requires, so all four
    # could go red while `make ci` reported success and the merge proceeded. That
    # is the same "runs on every PR, enforces nothing" gap #2019 closed below.
    #
    # integration, sandbox, and linux-validation joined this list in #2019:
    # all three ran on every PR already (full runner cost) but a red result
    # never blocked merge (zero enforcement) until now — the worst of both
    # worlds the issue documented, and ten recent runs (40 job instances)
    # showed no flakiness in any of the three that would argue against
    # requiring them.
    needs: [checks, deploy-reference, lint, darwin-build, unit, unit-macos, shipped, deadcode, windows-smoke, vulnerability-scan, conformance, integration, sandbox, linux-validation, unit-gate, e2e, envtest, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required gates
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          DEPLOY_REFERENCE_RESULT: ${{ needs.deploy-reference.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DARWIN_BUILD_RESULT: ${{ needs.darwin-build.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          UNIT_MACOS_RESULT: ${{ needs.unit-macos.result }}
          SHIPPED_RESULT: ${{ needs.shipped.result }}
          DEADCODE_RESULT: ${{ needs.deadcode.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          VULNCHECK_RESULT: ${{ needs.vulnerability-scan.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SANDBOX_RESULT: ${{ needs.sandbox.result }}
          LINUX_VALIDATION_RESULT: ${{ needs.linux-validation.result }}
          UNIT_GATE_RESULT: ${{ needs.unit-gate.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          ENVTEST_RESULT: ${{ needs.envtest.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          fail=0
          check() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 did not pass (result: $2)"
              fail=1
            fi
          }
          check "checks (fmt/tidy/vet/build/portal)" "$CHECKS_RESULT"
          check "deploy reference manifests"          "$DEPLOY_REFERENCE_RESULT"
          check "lint (golangci-lint, linux+darwin+windows)" "$LINT_RESULT"
          check "darwin build/vet gate"              "$DARWIN_BUILD_RESULT"
          check "unit -race suite (linux shards)"    "$UNIT_RESULT"
          check "unit behavioral suite (macos)"      "$UNIT_MACOS_RESULT"
          check "shipped-workflow contracts"         "$SHIPPED_RESULT"
          check "dead-code analysis"                 "$DEADCODE_RESULT"
          check "windows build/vet/runtime gate"     "$WINDOWS_RESULT"
          check "Go vulnerability scan"              "$VULNCHECK_RESULT"
          check "journal conformance"                "$CONFORMANCE_RESULT"
          check "declared-dependency integration"    "$INTEGRATION_RESULT"
          check "sandbox confinement"                "$SANDBOX_RESULT"
          check "linux node validation (#636/#639)"  "$LINUX_VALIDATION_RESULT"
          check "unit gate (make ci)"                "$UNIT_GATE_RESULT"
          check "end-to-end gate"                    "$E2E_RESULT"
          check "envtest integration gate"           "$ENVTEST_RESULT"
          check "coverage threshold"                 "$COVERAGE_RESULT"
          exit "$fail"

  sandbox:
    name: sandbox confinement (${{ matrix.os }})
    if: ${{ github.event_name != 'push' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 (ubuntu-latest) restricts unprivileged user
          # namespaces via AppArmor, which bubblewrap needs to set up its
          # uid map. Relax it so the confinement probe can create the
          # sandbox namespace on the hosted runner. Tolerate the knob being
          # absent (future runner images / kernels): the confinement test
          # itself, run with GOOBERS_REQUIRE_SANDBOX_TEST=1, remains the
          # authoritative gate.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Exercise native sandbox
        run: make sandbox-check

  # Linux node validation (#636): prove the shipped binary end to end on Linux —
  # an offline demo run to completion plus the full daemon start/status/stop
  # lifecycle under a real SIGTERM — and cross-compile the Windows supervision
  # handler (#639). Deterministic and offline; required-ci's needs (#2019)
  # actually makes it a required gate — this comment previously claimed that
  # while the job was still excluded from required-ci's needs list.
  linux-validation:
    name: linux node validation (#636/#639)
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Reproduce this full-tier platform gate locally with the same target.
      - name: Validate Linux node and Windows platform seams
        run: make linux-node-validation

      - name: Upload Linux validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-validation-evidence
          path: bin/linux-validation-evidence/
          if-no-files-found: warn

  escalate-main-failure:
    name: escalate failed main validation
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        (
          needs.checks.result == 'failure' ||
          needs.lint.result == 'failure' ||
          needs.unit.result == 'failure' ||
          needs.unit-macos.result == 'failure' ||
          needs.shipped.result == 'failure' ||
          needs.windows-smoke.result == 'failure'
        )
      }}
    needs: [checks, lint, unit, unit-macos, shipped, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update critical main failure
        uses: actions/github-script@v9
        with:
          script: |
            const title = "CI: main branch validation failed";
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Validation of the tree landed on \`${context.sha}\` failed.`,
              "",
              `Run: ${runURL}`,
              "",
              "This issue was filed automatically by the main-push CI escalation.",
            ].join("\n");
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "goobers:critical",
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["goobers:critical", "type:bug", "area:workflows"],
            });
