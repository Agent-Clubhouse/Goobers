name: CI

# Goobers control-plane and portal CI — the enforced merge gate.
#
# The merge tier documented as `make ci` (Go fmt/vet/build/test/lint + portal
# build/test + shipped-workflow contracts) is defined once, in test/ci, and
# fanned across independent runners here so the sequential gate runs in
# parallel. Each parallel job runs one slice via `go run ./test/ci group <name>`:
#
#   checks   fmt · tidy · no-phone-home · vet · command builds · config validation · portal
#   lint     golangci-lint (staticcheck / govet / revive / errcheck / ...)
#   unit     the -race unit suite, split into shards (Linux) — the long pole
#   shipped  shipped-workflow contract suite on Linux, macOS, and Windows
#
# plus deadcode, and the dedicated deploy-reference, conformance, windows-smoke,
# integration, vulnerability-scan, sandbox, and linux-validation jobs. Coverage
# of the merge tier is unchanged: the four groups are a disjoint, exhaustive
# partition of the checks the monolith used to run serially (asserted by
# test/ci's group tests).
#
# Race posture: a data race is a source-level property, not OS behaviour, so the
# full -race suite runs on Linux (sharded for wall-clock). macOS runs the same
# behavioural suite without -race (GOOBERS_CI_RACE=0), preserving macOS-specific
# behaviour while dropping the ~3-5x race instrumentation cost — there is no
# darwin-tagged concurrent code for a second -race platform to cover.
#
# Windows is gated as a REQUIRED, GREEN build+vet+runtime smoke (#633) plus the
# shipped-workflow contract suite. The broad Windows behavioural tier is NOT
# here: enabling it surfaced 670 failures across 19 packages, tracked separately.
# The platform slices, the Windows gates, the vulnerability scan, and the journal
# conformance job must all be green for the required `make ci` check (the
# required-ci aggregator, whose NAME is pinned by the branch ruleset) to pass.
#
# Pull requests and merge groups run that complete matrix. A push to main also
# validates the exact landed SHA with checks, lint, the Linux race shards, the
# macOS behavioral suite, shipped-workflow contracts, and the Windows gate.
# Failures on the landed tree are automatically escalated as critical issues.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

# Least privilege: CI only needs to read the checkout.
permissions:
  actions: read
  contents: read

# One in-flight run per ref; newer pushes cancel stale runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin lint to the version the Makefile/ADO pipeline targeted (schema v2 config).
  GOLANGCI_LINT_VERSION: v2.12.2

  # The declared dependency set the integration tier provisions (#3322). It is
  # declared and fixed, so its .deb payloads are cached and the mirrors are only
  # contacted when this string (or the runner image) changes. Defined once here
  # so the consumer job and the main-branch warm job cannot drift onto different
  # cache keys. Keep aligned with the inventory printed by `make test-integration`.
  DECLARED_APT_PACKAGES: bash bubblewrap coreutils dash maven
  DECLARED_APT_ARCHIVE_DIR: /tmp/goobers-declared-apt-archives

jobs:
  # DELETED in #3152's wake — e2e, envtest, and coverage were three separate
  # UNSHARDED whole-tree runs of the same suite the `unit` shards already run,
  # and together they were 47.9 of the 142.3 runner-min a PR cost and both ends
  # of its 21-minute critical path. Each is now covered strictly-better or
  # equally, in a job that already exists:
  #
  #   e2e        `go test ./test/e2e` -> already runs in unit shard 2 WITH -race
  #              and the hermetic PATH restriction, i.e. strictly stronger.
  #   envtest    `go test -tags=integration ./...` re-ran all 138 packages to
  #              reach ONE test. Build tags are additive, not a filter, so the
  #              tag bought 138 recompiles for 8 seconds of unique assertion.
  #              TestIntegrationEnvtestReconcile now runs in `integration`,
  #              which already selects internal/operator and already enforces
  #              the -run=^TestIntegration contract via a runtime AST scan.
  #   coverage   `make cover-check` -> `make test` emitted the literal same
  #              hermetic command as `test/ci group unit` minus --shard. The
  #              threshold gate now runs as a step on `unit-macos`, which
  #              already produced the whole-tree profile and uploaded it with
  #              no consumer.
  #
  # Their Makefile targets (test-e2e, test-envtest, cover-check) are retained
  # for local and full-tier use; only the redundant PR-leg jobs are gone.

  # Platform-independent unreachable-production-code report. Ran once (it was a
  # per-OS step of the old monolith; nothing about it is OS-specific).
  deadcode:
    name: dead-code analysis
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Dead-code analysis
        run: make deadcode

  # Fast fan-in: formatting, module hygiene, the no-phone-home guard, vet,
  # command builds, config validation, and the portal build/test/contract
  # chain. The only slice that needs Node. Runs on Linux only — its work is
  # either OS-agnostic (fmt, tidy, security guard, portal) or covered for other
  # platforms by cross-compilation (darwin-build, windows-smoke). Keeping static
  # analysis off the scarce macOS runners lets the macOS *runtime* jobs run
  # without queueing behind each other.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify GitHub Actions are pinned
        run: go run ./test/actionpins

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      # Chromium is ~130MB from the Playwright CDN and was re-downloaded on every
      # run — the download half of the repo's #1 flake class (#3139).
      #
      # PLAYWRIGHT_BROWSERS_PATH is exported here, as an ABSOLUTE path, so that
      # it and the cache below name the same directory. It has to be resolved in
      # a step rather than written as a job-level `env:` value because `~` and
      # `$HOME` do not expand in that context — pointing the variable at one
      # directory while caching another yields a cache that is always cold and
      # never errors, which is worse than no cache at all.
      #
      # Exporting it also engages test/ci's own portal-playwright-install skip
      # (#3372), which checks this directory for the pinned chromium revision
      # and no-ops when it is already there.
      - name: Resolve Playwright browsers path
        shell: bash
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"

      # Keyed on the lock file, because that pins the @playwright/test version
      # and hence the single chromium revision it can ever mean.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('portal/package-lock.json') }}

      - name: Install Portal dependencies and pinned Chromium
        # Retried because these are the repo's dominant CI flake (#3139): npm
        # and the Chromium download stall on registry/CDN hiccups and eat the
        # whole timeout, unlike go mod download and golangci-lint which
        # already retry. Six timeouts in one night on the v0.2.0 wave.
        #
        # --with-deps stays: the cache carries the BROWSER, not the apt-level
        # system libraries it links against. On a cache hit Playwright installs
        # those and skips the download.
        timeout-minutes: 20
        shell: bash
        run: |
          retry_network_command() {
            local label="$1"
            shift
            for attempt in 1 2 3; do
              if timeout --signal=TERM --kill-after=15s 180s "$@"; then
                return 0
              fi
              echo "::warning::${label} attempt ${attempt}/3 failed or hung; retrying"
              sleep $((attempt * 10))
            done
            echo "::error::${label} failed after 3 bounded attempts"
            return 1
          }

          retry_network_command "portal npm install" \
            npm --prefix portal ci --no-audit --no-fund
          retry_network_command "Playwright Chromium install" \
            npm --prefix portal exec -- playwright install --with-deps chromium

      - name: fmt · tidy · no-phone-home · vet · build · portal
        run: go run ./test/ci group checks

  deploy-reference:
    name: deploy reference manifests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Render and schema-check reference manifests
        run: make deploy-validate

  # golangci-lint (staticcheck/govet/revive/...) per target GOOS, all on cheap
  # Linux runners. golangci-lint honours GOOS, so it sees each platform's
  # build-tagged sources (the darwin-only files internal/{sandbox,executor},
  # the windows-only files internal/{winsvc,platform/proc,platform/lock,
  # platform/durability}, safeopen_windows.go, test/windowsvalidate, etc.) are
  # linted under GOOS=darwin/windows from Linux — no macOS or Windows runner
  # required. #2016: before this leg existed, every windows-only file was
  # staticcheck/revive-exempt (build+vet only), which is exactly the class of
  # gap the repo has already been bitten by once (SA4032 via build-tag-dead
  # branches).
  lint:
    name: lint (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        timeout-minutes: 8
        # Explicit bash for pipefail: without it the pipeline reports only sh's
        # status, so a failed curl would feed an empty script to a shell that
        # exits 0 and the step would "succeed" with no linter installed.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
                 "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
                 | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"; then
              echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "::warning::golangci-lint install attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::golangci-lint install failed after 3 attempts"
          exit 1

      - name: golangci-lint (GOOS=${{ matrix.goos }})
        # GOOBERS_LINT_GOOS sets GOOS for the golangci-lint subprocess only.
        # Setting ambient GOOS here would cross-build the `go run ./test/ci`
        # launcher for the target and fail to exec it on the Linux host.
        env:
          GOOBERS_LINT_GOOS: ${{ matrix.goos }}
        run: go run ./test/ci group lint

  # darwin build+vet gate, cross-compiled on Linux (mirrors windows-smoke).
  # Compiles and vets the whole tree — including the //go:build darwin files
  # (internal/{sandbox,executor}) — for macOS, so a darwin-specific build or vet
  # regression is caught without spending a macOS runner. The behavioural macOS
  # runtime is exercised by the unit/shipped/sandbox macOS jobs.
  darwin-build:
    name: darwin gate (build · vet)
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: go build (darwin/arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build ./...

      - name: go vet (darwin/arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go vet ./...

  # The long pole: the -race unit suite. Split into shards across Linux runners
  # (test/ci group unit + GOOBERS_CI_SHARD; the hermetic runner partitions
  # `go list ./...` deterministically, proven disjoint + exhaustive by
  # TestSelectShardPartitionsExactly). Full git history is required — the DSL
  # SemVer-compatibility tests read the latest reachable tag.
  unit:
    name: unit race shard ${{ matrix.shard }} (linux)
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      # TestFeatureRegistryAgainstLatestRelease (internal/workflow/v_2_0 and
      # v_3_0) checks out the latest release tag into a temp worktree and runs
      # `go run` there to snapshot its feature registry, against that tag's own
      # go.mod/go.sum — not the current checkout's. The hermetic runner this job
      # invokes below sets GOPROXY=off, so any module the release tag needs that
      # the current go.mod does not pull (e.g. an older major version of a
      # since-bumped dependency) is unreachable once the sandbox activates.
      # Priming it here, over the network, before that happens, lands it in the
      # same GOMODCACHE the release-tag worktree will read from offline. #3973
      # surfaced this: it bumped a module whose current version no longer
      # overlaps what the latest release tag pinned.
      #
      # The prerelease filter keeps this selection identical to the test's
      # (latestReleaseTag -> parseReleaseVersion, which requires a canonical
      # vMAJOR.MINOR.PATCH and so skips a tag like v0.4.0-beta.1). Git's
      # version sort ranks that beta ABOVE the release the test will pick, so
      # without the filter this step primes one tag's modules while the test
      # reads another's — #4045: every branch went red within minutes of the
      # first beta tag being pushed.
      - name: Prime module cache for latest release tag
        timeout-minutes: 12
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest_tag" ]; then
            echo "::warning::no version-shaped release tag found; skipping release-tag module priming"
            exit 0
          fi
          echo "priming module cache for release tag: $latest_tag"
          release_tree="$(mktemp -d)/release"
          git worktree add --detach -q "$release_tree" "$latest_tag"
          status=1
          for attempt in 1 2 3; do
            if (cd "$release_tree" && go mod download); then
              status=0
              break
            fi
            echo "::warning::go mod download (release tag $latest_tag) attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          git worktree remove --force "$release_tree"
          if [ "$status" -ne 0 ]; then
            echo "::error::go mod download for release tag $latest_tag failed after 3 attempts"
            exit 1
          fi

      - name: Unit suite (-race, shard ${{ matrix.shard }})
        env:
          GOOBERS_CI_SHARD: ${{ matrix.shard }}
        run: go run ./test/ci group unit

  # Linux runs the whole behavioural unit suite (no -race) separately from the
  # race shards so its coverage profile includes Linux-only files.
  unit-linux-coverage:
    name: unit coverage gate (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      # See the identically-named step in the `unit` job above for why this is
      # needed: TestFeatureRegistryAgainstLatestRelease builds the latest
      # release tag's own go.mod/go.sum inside a temp worktree, and this job's
      # hermetic runner sets GOPROXY=off before that test runs.
      - name: Prime module cache for latest release tag
        timeout-minutes: 12
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest_tag" ]; then
            echo "::warning::no version-shaped release tag found; skipping release-tag module priming"
            exit 0
          fi
          echo "priming module cache for release tag: $latest_tag"
          release_tree="$(mktemp -d)/release"
          git worktree add --detach -q "$release_tree" "$latest_tag"
          status=1
          for attempt in 1 2 3; do
            if (cd "$release_tree" && go mod download); then
              status=0
              break
            fi
            echo "::warning::go mod download (release tag $latest_tag) attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          git worktree remove --force "$release_tree"
          if [ "$status" -ne 0 ]; then
            echo "::error::go mod download for release tag $latest_tag failed after 3 attempts"
            exit 1
          fi

      - name: Unit suite and Linux coverage profile
        env:
          GOOBERS_CI_RACE: "0"
        run: go run ./test/ci group unit

      - name: Enforce the repository coverage threshold
        run: make cover-gate

  # macOS runs the whole behavioural unit suite (no -race) in one process, so it
  # owns the per-test timing budget artifact and a second OS-specific coverage
  # profile. Race coverage is provided by the Linux shards above.
  unit-macos:
    name: unit behavioral suite (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      # See the identically-named step in the `unit` job for why this is
      # needed: TestFeatureRegistryAgainstLatestRelease builds the latest
      # release tag's own go.mod/go.sum inside a temp worktree, and this job's
      # hermetic runner sets GOPROXY=off before that test runs.
      - name: Prime module cache for latest release tag
        timeout-minutes: 12
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest_tag" ]; then
            echo "::warning::no version-shaped release tag found; skipping release-tag module priming"
            exit 0
          fi
          echo "priming module cache for release tag: $latest_tag"
          release_tree="$(mktemp -d)/release"
          git worktree add --detach -q "$release_tree" "$latest_tag"
          status=1
          for attempt in 1 2 3; do
            if (cd "$release_tree" && go mod download); then
              status=0
              break
            fi
            echo "::warning::go mod download (release tag $latest_tag) attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          git worktree remove --force "$release_tree"
          if [ "$status" -ne 0 ]; then
            echo "::error::go mod download for release tag $latest_tag failed after 3 attempts"
            exit 1
          fi

      - name: Find previous main timing run
        id: previous-timing
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              status: "success",
              per_page: 20,
            });
            const previous = data.workflow_runs.find(
              run => run.id !== context.runId,
            );
            return previous ? String(previous.id) : "";
          result-encoding: string

      - name: Download previous timing artifact
        if: ${{ steps.previous-timing.outputs.result != '' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-timings-${{ runner.os }}
          path: previous-test-timings
          run-id: ${{ steps.previous-timing.outputs.result }}
          github-token: ${{ github.token }}

      - name: Unit suite (behavioral, no -race)
        env:
          GOOBERS_CI_RACE: "0"
          GOOBERS_TEST_TIMING_FILE: test-timings/unit-${{ runner.os }}.json
        run: go run ./test/ci group unit

      # The coverage threshold gate. This job runs the unit suite UNSHARDED, so
      # `test/ci`'s shard rewrite never strips the coverage flags and the step
      # above has already written a complete whole-tree coverage.out — which
      # this job was already uploading as an artifact nobody read. Enforcing the
      # threshold here costs ~20s instead of the ~21 minutes the deleted
      # `coverage` job spent re-running the identical suite to regenerate the
      # identical profile.
      #
      # Measured delta to the reported figure when this moved: 79.0695% ->
      # 79.1586%, +0.089pp, against a threshold of 70. Deliberately NOT
      # continue-on-error and deliberately not `if: always()`: a failed gate must
      # red unit-macos, which required-ci already depends on.
      - name: Enforce the repository coverage threshold
        run: make cover-gate

      - name: Report test timing budget
        if: ${{ !cancelled() && hashFiles(format('test-timings/unit-{0}.json', runner.os)) != '' }}
        run: >-
          go run ./test/testtiming report
          -budget .github/test-timing-budgets.json
          -current test-timings/unit-${{ runner.os }}.json
          -previous previous-test-timings/unit-${{ runner.os }}.json

      # Diagnostic artifacts, not gates. The reads of this same timing data
      # already tolerate failure (see "Find previous main timing run" and
      # "Download previous timing artifact"), so a failed WRITE must not fail
      # the merge gate either. A transient artifact-service DNS error took main
      # red on a669fc3a while the unit suite itself had passed.
      - name: Upload test timing
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-timings-${{ runner.os }}
          path: test-timings/unit-${{ runner.os }}.json
          if-no-files-found: warn

      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ runner.os }}
          path: coverage.out
          if-no-files-found: ignore

  # Shipped-workflow contract suite. Linux runs it with -race; macOS and Windows
  # run the same behavioural suite without -race.
  shipped:
    name: shipped workflow contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "1"
            timeout: "20m"
          - os: macos-latest
            race: "0"
            timeout: "20m"
          - os: windows-latest
            race: "0"
            timeout: "40m"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Shipped-workflow contracts
        env:
          GOOBERS_CI_RACE: ${{ matrix.race }}
          GOOBERS_CI_TEST_TIMEOUT: ${{ matrix.timeout }}
        run: go run ./test/ci group shipped

  integration:
    name: declared-dependency integration
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Resolve declared-dependency cache key
        id: declared-apt-key
        shell: bash
        run: |
          set -euo pipefail
          # The key is the declared set plus the runner image it was resolved
          # against: a .deb built for one Ubuntu release is not interchangeable
          # with another, and an image bump can move the versions apt would
          # pick. Changing either is the only thing that reopens the network.
          digest=$(printf '%s\n%s\n%s\n' \
            "$DECLARED_APT_PACKAGES" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" \
            | sha256sum | cut -c1-16)
          echo "key=declared-apt-v1-${RUNNER_OS}-${RUNNER_ARCH}-${digest}" >> "$GITHUB_OUTPUT"

      - name: Restore declared-dependency apt archives
        id: declared-apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.DECLARED_APT_ARCHIVE_DIR }}
          # No restore-keys on purpose: a prefix match would hand this job the
          # .deb set for a *different* declared list and install it silently.
          # Exact key or nothing, then fall back to the mirrors.
          key: ${{ steps.declared-apt-key.outputs.key }}

      # Keep this list aligned with the inventory printed by
      # `make test-integration`. Strict mode makes an absent executable red.
      - name: Provision declared dependencies (bash, bwrap, dirname, head, java, mkdir, mvn, sh, sleep, yes)
        timeout-minutes: 12
        shell: bash
        run: |
          # #3322: this step provisioned a fixed, declared set from the apt
          # mirrors on every run, and timed out at 12 minutes at least three
          # times in one day — each one costing a full rerun cycle on unrelated
          # PRs during the v0.2.0 release push. On a cache hit the payloads are
          # already on disk, so dpkg installs them with no network at all. The
          # mirror path below stays as the cache-miss fallback and reruns
          # automatically if the cached payloads no longer satisfy their
          # dependencies (a refreshed runner image, a partial archive).
          shopt -s nullglob
          cached=("${DECLARED_APT_ARCHIVE_DIR}"/*.deb)
          shopt -u nullglob
          if [ "${#cached[@]}" -gt 0 ] && sudo env DEBIAN_FRONTEND=noninteractive \
               dpkg --install --force-confold "${cached[@]}"; then
            echo "declared dependencies installed from ${#cached[@]} cached .deb archives (no network)"
          else
            if [ "${#cached[@]}" -gt 0 ]; then
              echo "::warning::cached declared-dependency archives did not install cleanly; falling back to the apt mirrors"
            fi
            # Hosted runners occasionally leave the Azure mirror connected but
            # unable to serve package indexes. Use the canonical mirror and bound
            # every attempt so this setup cannot hold the workflow indefinitely.
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list.d/ubuntu.sources || true
            sudo rm -rf "$DECLARED_APT_ARCHIVE_DIR"
            sudo mkdir -p "${DECLARED_APT_ARCHIVE_DIR}/partial"
            for attempt in 1 2 3; do
              if sudo timeout --signal=TERM --kill-after=10s 90s \
                   apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
                   -o Acquire::https::Timeout=20 update \
                && sudo timeout --signal=TERM --kill-after=10s 90s \
                   env DEBIAN_FRONTEND=noninteractive apt-get --yes \
                   -o Dir::Cache::archives="$DECLARED_APT_ARCHIVE_DIR" \
                   -o APT::Sandbox::User=root \
                   install $DECLARED_APT_PACKAGES; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::declared dependency provisioning failed after 3 bounded attempts"
                exit 1
              fi
              echo "::warning::declared dependency provisioning attempt ${attempt}/3 failed or hung; retrying"
              sudo dpkg --configure -a || true
              sleep $((attempt * 10))
            done
            # Leave only the .deb payloads behind: apt's lock/partial entries are
            # root-owned and would make the cache upload unreadable.
            sudo rm -rf "${DECLARED_APT_ARCHIVE_DIR}/partial" "${DECLARED_APT_ARCHIVE_DIR}/lock"
            sudo chmod -R a+rX "$DECLARED_APT_ARCHIVE_DIR"
          fi
          # Ubuntu 24.04 restricts the user namespace needed by bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Only after a green provision, so a half-downloaded archive set from a
      # failed attempt can never be published under the key every later run reads.
      - name: Save declared-dependency apt archives
        if: ${{ success() && steps.declared-apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.DECLARED_APT_ARCHIVE_DIR }}
          key: ${{ steps.declared-apt-key.outputs.key }}

      # Absorbed from the deleted `envtest` job. internal/operator is ALREADY in
      # this job's package set and TestIntegrationEnvtestReconcile already runs
      # here — it just reported `--- SKIP` because testdep.RequireEnv found
      # KUBEBUILDER_ASSETS unset. Exporting the path is the whole fold; the
      # deleted job's other 137 packages were pure duplication.
      #
      # `set -euo pipefail` + the non-empty assertion close a false-green that
      # existed in the OLD job: it resolved the path by command substitution
      # inside a make recipe, so when `setup-envtest use` failed the variable
      # came back EMPTY, make carried on, RequireEnv skipped, and the job whose
      # entire justification is that one test exited 0 having never run it.
      - name: Provision envtest control-plane assets
        shell: bash
        run: |
          set -euo pipefail
          assets="$(make --silent envtest-assets)"
          if [ -z "$assets" ] || [ ! -d "$assets" ]; then
            echo "::error::setup-envtest did not yield a usable KUBEBUILDER_ASSETS path (got: '${assets}')"
            exit 1
          fi
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"

      - name: Run strict integration tier
        env:
          GOOBERS_JAVA_E2E: "1"
        shell: bash
        run: |
          set -euo pipefail
          make test-integration-strict 2>&1 | tee integration-tier.log
          # Assert the envtest reconcile actually EXECUTED. It is the only test
          # in CI that stands up a real API server, and the only thing that
          # caught #3168 (both shipped CRDs rejected: uniqueItems forbidden and
          # a CEL rule over its cost budget). `deploy-reference`'s kubeconform
          # pass was GREEN on those same runs — it does not do apiextensions
          # structural-schema or CEL-cost validation — so nothing else covers
          # this class. A SKIP here must be a hard red, not a quiet pass.
          if ! grep -q -- '--- PASS: TestIntegrationEnvtestReconcile' integration-tier.log; then
            echo "::error::TestIntegrationEnvtestReconcile did not PASS (skipped or absent) — the envtest control plane is not being exercised"
            exit 1
          fi

  # Publishes the declared-dependency .deb payloads on main (#3322).
  #
  # GitHub scopes a cache entry to the ref that wrote it: an entry written by a
  # pull-request run is readable only by that pull request, and only entries
  # written on the default branch are visible to every branch. The `integration`
  # job that consumes this cache is deliberately PR-only, so with no writer on
  # main the first run of every PR would still provision from the apt mirrors —
  # exactly the timeout class the cache exists to remove. This job is that
  # writer, and it is the reason "network only when the declared set changes"
  # holds across pull requests rather than only across reruns of one.
  #
  # It gates nothing: continue-on-error keeps a mirror outage from reddening
  # main, it is absent from required-ci and from the main-failure escalation,
  # and every consumer falls back to the mirrors on a miss.
  dependency-cache-warm:
    name: warm declared-dependency apt cache
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve declared-dependency cache key
        id: declared-apt-key
        shell: bash
        run: |
          set -euo pipefail
          # Must stay byte-identical to the consumer's key derivation in the
          # `integration` job, or this job warms an entry nothing ever reads.
          digest=$(printf '%s\n%s\n%s\n' \
            "$DECLARED_APT_PACKAGES" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" \
            | sha256sum | cut -c1-16)
          echo "key=declared-apt-v1-${RUNNER_OS}-${RUNNER_ARCH}-${digest}" >> "$GITHUB_OUTPUT"

      - name: Restore declared-dependency apt archives
        id: declared-apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.DECLARED_APT_ARCHIVE_DIR }}
          key: ${{ steps.declared-apt-key.outputs.key }}

      - name: Download declared-dependency .deb payloads
        if: ${{ steps.declared-apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 12
        shell: bash
        run: |
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources || true
          sudo rm -rf "$DECLARED_APT_ARCHIVE_DIR"
          sudo mkdir -p "${DECLARED_APT_ARCHIVE_DIR}/partial"
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM --kill-after=10s 90s \
                 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
                 -o Acquire::https::Timeout=20 update \
              && sudo timeout --signal=TERM --kill-after=10s 90s \
                 env DEBIAN_FRONTEND=noninteractive apt-get --yes \
                 -o Dir::Cache::archives="$DECLARED_APT_ARCHIVE_DIR" \
                 -o APT::Sandbox::User=root \
                 --download-only install $DECLARED_APT_PACKAGES; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::declared dependency download failed after 3 bounded attempts"
              exit 1
            fi
            echo "::warning::declared dependency download attempt ${attempt}/3 failed or hung; retrying"
            sleep $((attempt * 10))
          done
          sudo rm -rf "${DECLARED_APT_ARCHIVE_DIR}/partial" "${DECLARED_APT_ARCHIVE_DIR}/lock"
          sudo chmod -R a+rX "$DECLARED_APT_ARCHIVE_DIR"

      - name: Save declared-dependency apt archives
        if: ${{ success() && steps.declared-apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.DECLARED_APT_ARCHIVE_DIR }}
          key: ${{ steps.declared-apt-key.outputs.key }}

      # The other half of the provisioned set the integration tier pulls over the
      # network: the Maven repository `mvn -B -q verify` resolves for the Java
      # fixture gaggle. setup-java's maven cache is keyed on runner OS/arch plus
      # the pom hash, so warming it here — same action version, same distribution,
      # same java-version, same checked-out pom — publishes the entry every PR's
      # `integration` job already looks for.
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Warm the Maven repository for the Java fixture gaggle
        timeout-minutes: 12
        shell: bash
        run: |
          set -uo pipefail
          # mvn itself comes from the archives resolved above, so this step adds
          # no apt traffic of its own.
          if ! sudo env DEBIAN_FRONTEND=noninteractive \
               dpkg --install --force-confold "${DECLARED_APT_ARCHIVE_DIR}"/*.deb; then
            echo "::warning::declared-dependency archives did not install; skipping the Maven warm"
            exit 0
          fi
          # `verify` is exactly what the fixture gaggle's local-ci stage runs, so
          # it resolves exactly what the integration tier will need; go-offline
          # adds the plugin dependencies verify alone would not reach.
          mvn -B -q -f test/e2e/testdata/javaservice/pom.xml \
            dependency:go-offline verify

      - name: Drop failed-resolution markers before the Maven cache is saved
        if: ${{ always() }}
        shell: bash
        run: |
          # A *.lastUpdated marker records a download that failed. Cached, it
          # makes every later run refuse to reattempt that artifact until the
          # marker ages out — a partially warmed repository that poisons the
          # consumers instead of helping them.
          find ~/.m2/repository -name '*.lastUpdated' -delete 2>/dev/null || true

  # DELETED alongside e2e/envtest/coverage. `make test-conformance` was
  # `-run '^TestConformance' ./...`, and -run filters EXECUTION, not
  # COMPILATION: the job spent ~270s building 147 race-instrumented binaries so
  # that 142 of them could print "[no tests to run]" and 5 could run 32 tests
  # worth ~13s. Every one of those 32 functions already runs UNFILTERED in the
  # unit shards (internal/{engine,harness,journal,runner} and test/e2e), and the
  # shards share this job's fsync posture exactly.
  #
  # Deleting is deliberately SAFER than scoping it to those 5 packages: the
  # `./...` form picks up a new TestConformance* in a NEW package automatically,
  # whereas a checked-in 5-package list silently stops covering one the day
  # somebody adds a sixth. Its only genuine differentiator was -count=1, which
  # the shard invocation now carries (see test/ci/main.go).
  #
  # Never the sole failing job in the last 300 failed CI runs.

  # Windows joins CI as a REQUIRED, GREEN runtime gate (#633/#752) — deliberately not
  # the old advisory `continue-on-error` `windows-smoke` job (#928) that #960 had
  # to remove: that one published a red check the Goobers merge flow (which has no
  # notion of an advisory check, see #961) read as a hard block. This one is
  # different in kind — it actually passes. It cross-checks that the whole tree
  # builds and vets for Windows, then runs focused native-runtime regressions,
  # green as of #623's proc Job-Object impl + the build-tags on the unix-only
  # commands/tests. That makes it safe to gate on: it only reds on a real,
  # fixable Windows regression — never as an expected-red. The focused tests
  # exercise platform seams, then the node validation drives the real foreground
  # daemon and canonical fake-harness implementation workflow end to end.
  #
  # #2048: that "never an expected-red" contract briefly went false — two
  # focused tests (proc's attach/resume test, dashboard's port-increment
  # test) carried fixed timeouts/ephemeral-port assumptions too tight for a
  # loaded Windows runner's real process-spawn latency and Hyper-V/WinNAT's
  # dynamic-port-range exclusions, each evicting a merge_group entry. Both
  # were root-caused and fixed at the source (a generous, still-deterministic
  # wait deadline; a fixed low test port outside the dynamic range) rather
  # than quarantined — #664's quarantine machinery doesn't exist in this repo
  # yet, and per its own scope note explicitly excludes required-gate jobs
  # like this one regardless. The contract stands restored, not weakened.
  #
  # COVERAGE BOUNDARY (#2031) — this job runs a curated selection, NOT
  # `go test ./...`, and that is a deliberate, measured choice rather than an
  # accident of history. #2031 offered two ways to close the "what isn't
  # tested on Windows?" gap: widen to the full default-tag suite accepting the
  # runtime cost, or enumerate the excluded set as a reviewed artifact. The
  # widening was built and measured first (PR #2364) and rejected on cost:
  # the full suite could not finish inside 30min-per-package, with
  # ./cmd/goobers and ./internal/runner both dying on `panic: test timed out
  # after 30m0s` and the job still red at 43min — against a historic median of
  # ~10min for this gate. Cost is concentrated in four packages (cmd/goobers
  # >30min, internal/runner >30min, test/shippedworkflows ~22min, test/scale
  # ~22min); nearly everything else is seconds. Sharding does not rescue it,
  # because the critical path is a single package that alone exceeds the
  # budget. So: packages that are cheap on Windows run WHOLE, and the four
  # expensive ones are entered by named test only, each name justified inline
  # below by the platform seam it covers. The widening run was not wasted —
  # every Windows fault it surfaced is fixed, and the tests covering those
  # fixes are what the selection below was extended to include. The remaining
  # obligation from #2031 — a build-tag-policed inventory of what Windows
  # still does not run, so the gap stays a reviewed artifact instead of an
  # accident — is tracked separately in #2791.
  windows-smoke:
    name: windows gate (build · vet · runtime smoke)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Platform-scoped Go cache (setup-go keys by runner OS/arch), so the
      # windows leg neither shares nor evicts the ubuntu/macos caches.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        timeout-minutes: 12
        # Explicit bash: the Windows runner defaults to PowerShell, which
        # cannot parse this loop.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      # Compiles every package for windows/amd64, including the //go:build windows
      # files (internal/platform/proc, lock, winsvc, safeopen) that no other gate
      # exercises. `go build ./...` skips _test.go files; `go vet ./...` compiles
      # them too, so a windows-incompatible test also gets caught.
      - name: go build (windows/amd64)
        run: go build ./...

      - name: go vet (windows/amd64)
        run: go vet ./...

      # #1603: on Windows, GNU Make invokes $(shell ...) through cmd.exe, not
      # a POSIX shell — the Makefile's DATE variable used a Linux-only
      # `date -u +%Y-%m-%dT%H:%M:%SZ`, which cmd.exe's own `date` builtin
      # doesn't understand at all, corrupting the linker's -X ldflags
      # argument. Nothing in this job exercised the Makefile itself (only raw
      # `go build`), so this regressed silently. Installing `make` via
      # Chocolatey (pre-installed on GitHub-hosted Windows runners)
      # reproduces the real failure mode exactly, rather than assuming some
      # possibly-different make is already on PATH. operator is a
      # portal-free command (unlike goobers, whose build-goobers target also
      # runs a full npm portal rebuild), so this stays a cheap, direct guard
      # on the Makefile's own cross-platform shell portability rather than a
      # portal build smoke test — that's covered elsewhere.
      - name: Install make (windows)
        timeout-minutes: 8
        run: choco install make --no-progress -y

      - name: make build (windows)
        run: make build-operator

      - name: Windows platform runtime
        run: go test ./internal/platform/durability ./internal/platform/proc ./internal/platform/secfile

      - name: Windows service transitions
        run: go test ./internal/winsvc

      # Both packages run whole rather than by named test: each costs well
      # under a second on Windows, so a name allowlist here buys no runtime
      # and only creates a way for a new test to silently miss the platform.
      # #2031 widened these from single -run selections after the executor's
      # cmd.exe batch-file routing (script_windows.go) turned out to be
      # exercised by no gated test at all.
      - name: Windows inline script runtime
        run: go test ./internal/executor

      - name: Windows credential files
        run: go test ./internal/credentials

      - name: Windows self-update
        run: go test ./internal/selfupdate

      # Both are real Windows faults fixed under #2031 whose only coverage
      # lives in an existing test that no gated selection ran:
      # harness/claude.go let an ambient USERPROFILE override an explicitly
      # set HOME; agentkit/bundle.go trusted the OS's reported executable bit,
      # which neither embed.FS nor NTFS can express, so the embedded and
      # from-disk toolkit builders diverged. Both are cheap, so they run whole.
      - name: Windows harness and toolkit
        run: go test ./internal/harness ./internal/agentkit

      - name: Windows containment and journals
        run: go test ./api/v1alpha1 ./internal/configboundary ./internal/journal

      # The whole package, not one named test. #3064 added this step scoped to
      # TestCreateLegacyRuntimeAliasCreatesJunction only, which passed while the
      # four migration tests that actually exercise alias *resolution* stayed
      # unrun on Windows — the same "green because it never executes" gap #3064
      # set out to close (#2862, and the junction-resolution fix in this change).
      - name: Windows instance runtime
        run: go test ./internal/instance

      # Named, not the whole package: internal/telemetry/rollup's suite runs
      # ~15s on Linux and isn't otherwise Windows-sensitive, so only the two
      # tests that actually exercise canonicalRunsRoot's dependency on
      # instance.ResolveRuntimeAlias run here. Without this step they only ran
      # under the Linux unit shards, where ResolveRuntimeAlias takes the
      # plain-symlink branch and the Windows reparse-point junction parser in
      # runtime_alias_windows.go — the one this PR's alias-dedup fix depends
      # on — stayed unexercised on the only platform where it runs (#3280).
      - name: Windows rollup migration alias dedup
        run: go test ./internal/telemetry/rollup -run 'TestBackfillCICheckFailuresDedupesSymlinkedRunsRoot|TestCanonicalRunsRootDedupesSymlinkAlias'

      # The read model and its sibling stores open SQLite files BY PATH, which
      # is the single operation whose behaviour differs most between Windows and
      # POSIX — and none of these packages were covered here until #1997.
      #
      # That bug was `file:` + url.URL{Path: "C:/dir/intake.db"}.String(), which
      # yields `file:./C:/...` because url.URL prefixes `./` to any first
      # segment containing a colon. SQLite answered SQLITE_CANTOPEN, the daemon
      # logged a warning, and the intake store was silently unavailable on every
      # Windows install. `go build` and `go vet` cannot see it: the expression is
      # valid Go, and the fault only appears when something CONSTRUCTS a URI from
      # a Windows path at runtime.
      #
      # POSIX paths begin with `/`, so the first segment is empty and the bug is
      # unreachable on Linux and macOS — which is exactly why a full green suite
      # on those platforms proved nothing about this.
      - name: Windows read model and stores
        run: go test ./internal/readmodel/... ./internal/readservice

      - name: Windows worktree and event stream
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.safecrlf
          GIT_CONFIG_VALUE_1: "false"
        # The pinned path-length tests are named rather than running
        # ./internal/worktree whole: the full package is ~4.5min on Windows,
        # nearly half this job's historic budget, and these four are the ones
        # that cover the platform seam. `git clone` does not inherit the
        # source repo's config, so a fresh pin started without core.longpaths
        # and the very next ref-rewriting operation could fail with
        # ERROR_FILENAME_EXCED_RANGE (#2031). The preflight tests alongside
        # them guard the budget arithmetic that is supposed to catch it first.
        run: go test ./internal/worktree ./internal/httpapi -run 'TestManager_Create_ExcludesHarnessScratch|TestDefinitionInvalidationFollowsExplicitReadModelCommit|TestAcquirePinnedAppliesPathLengthPreflightBeforeCheckout|TestManagerCreatePathLengthPreflightRefusesBeforeCheckout|TestManagerCreatePathLengthPreflightSyncBaseIncludesBaseRef|TestPinnedWorkspaceIsOutsideRetentionInventory'

      # Named, not the whole package: ./release is ~2.75min on Windows. These
      # cover agent_toolkit.go's half of the SourceMode parity fix above (the
      # from-disk builder, whose manifest has to match the embedded one byte
      # for byte) and the install-script writer's file-mode fixture.
      - name: Windows release packaging
        run: go test ./release -run 'TestAgentToolkit|TestWriteInstallScript'

      # ./cmd/goobers whole exceeds 30min on Windows, so this stays named.
      # TestBuildSchedulerSetupRejectsConfigChangedDuringStartup is the only
      # test that drives buildSchedulerSetup's failure path, where the read
      # model and intake store handles used to leak: harmless on POSIX, but
      # on Windows the open handles keep the temp dir's *.db files locked and
      # the test's own cleanup then fails (#2031).
      # TestBuildSchedulerSetupWiresConfiguredTimezone loads America/New_York
      # with GOROOT and ZONEINFO isolated from setup-go's timezone archive, so
      # Windows must use the CLI's embedded time/tzdata import (#2863).
      # TestValidatePlanDetectsLiveParentConflict guards the API read cache's
      # bounded CreateFile fallback, which is only observable on Windows.
      # TestRunDashboardContextAcceptsNonLoopbackListenWithAuth exercises the
      # non-loopback contract through the loopback-only test listener, guarding
      # against firewall prompts for the temporary test executable (#3114).
      - name: Windows CLI runtime
        run: go test ./cmd/goobers -run 'TestListenDashboardReportsConflictAndCanIncrement|TestReadDirectoryDistinguishesMissingFromFile|TestBuildSchedulerSetupRejectsConfigChangedDuringStartup|TestBuildSchedulerSetupWiresConfiguredTimezone|TestValidatePlanDetectsLiveParentConflict|TestRunDashboardContextAcceptsNonLoopbackListenWithAuth'

      - name: Build Windows validation binary
        run: go build -o bin/goobers.exe ./cmd/goobers

      - name: Validate Windows daemon and implementation workflow
        run: go run ./test/windowsvalidate -bin bin/goobers.exe -out bin/windows-validation-evidence

      - name: Upload Windows validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-validation-evidence
          path: bin/windows-validation-evidence/
          if-no-files-found: warn

  vulnerability-scan:
    name: Go vulnerability scan
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan reachable Go code
        run: make vulncheck

  required-ci:
    name: make ci (fmt-check · vet · build · test · lint)
    if: ${{ always() && github.event_name != 'push' }}
    # unit-gate — the pre-parallelization `make ci` monolith — was retired once
    # every check it ran had a dedicated job; it duplicated the
    # checks/lint/unit/shipped/deadcode slices wholesale and doubled the
    # CI-setup network exposure (#3139/#3322) for zero coverage.
    #
    # e2e and envtest were wired in here by #3207 (having been added
    # as jobs the day before by #3152), and conformance long predates both. All
    # four are now GONE — not un-required, but deleted as jobs, because each was
    # an unsharded re-run of a suite another required job already runs. Their
    # distinct value moved rather than lapsed: the coverage thresholds onto
    # unit-linux-coverage and unit-macos, the envtest control plane onto integration, and the
    # conformance and e2e tests were already executing unfiltered in the unit
    # shards. Nothing that this aggregate used to enforce stopped being enforced.
    #
    # integration, sandbox, and linux-validation joined this list in #2019:
    # all three ran on every PR already (full runner cost) but a red result
    # never blocked merge (zero enforcement) until now — the worst of both
    # worlds the issue documented, and ten recent runs (40 job instances)
    # showed no flakiness in any of the three that would argue against
    # requiring them.
    needs: [checks, deploy-reference, lint, darwin-build, unit, unit-linux-coverage, unit-macos, shipped, deadcode, windows-smoke, vulnerability-scan, integration, sandbox, linux-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verify required gates
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          DEPLOY_REFERENCE_RESULT: ${{ needs.deploy-reference.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DARWIN_BUILD_RESULT: ${{ needs.darwin-build.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          UNIT_LINUX_COVERAGE_RESULT: ${{ needs.unit-linux-coverage.result }}
          UNIT_MACOS_RESULT: ${{ needs.unit-macos.result }}
          SHIPPED_RESULT: ${{ needs.shipped.result }}
          DEADCODE_RESULT: ${{ needs.deadcode.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          VULNCHECK_RESULT: ${{ needs.vulnerability-scan.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SANDBOX_RESULT: ${{ needs.sandbox.result }}
          LINUX_VALIDATION_RESULT: ${{ needs.linux-validation.result }}
        # This `check()` is fail-closed on EVERY non-success result, `skipped`
        # included. That property is load-bearing for the whole gate — a job
        # that silently stops running reds the merge instead of vanishing — so
        # do not relax the comparison to allow `skipped`.
        run: |
          fail=0
          check() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 did not pass (result: $2)"
              fail=1
            fi
          }
          check "checks (fmt/tidy/vet/build/portal)" "$CHECKS_RESULT"
          check "deploy reference manifests"          "$DEPLOY_REFERENCE_RESULT"
          check "lint (golangci-lint, linux+darwin+windows)" "$LINT_RESULT"
          check "darwin build/vet gate"              "$DARWIN_BUILD_RESULT"
          check "unit -race suite (linux shards)"    "$UNIT_RESULT"
          check "unit coverage gate (linux)"         "$UNIT_LINUX_COVERAGE_RESULT"
          # unit-macos also carries the coverage threshold gate (cover-gate).
          check "unit behavioral suite + coverage (macos)" "$UNIT_MACOS_RESULT"
          check "shipped-workflow contracts"         "$SHIPPED_RESULT"
          check "dead-code analysis"                 "$DEADCODE_RESULT"
          check "windows build/vet/runtime gate"     "$WINDOWS_RESULT"
          check "Go vulnerability scan"              "$VULNCHECK_RESULT"
          # integration also carries the envtest control-plane gate, absorbed
          # from the deleted `envtest` job.
          check "declared-dependency + envtest integration" "$INTEGRATION_RESULT"
          check "sandbox confinement"                "$SANDBOX_RESULT"
          check "linux node validation (#636/#639)"  "$LINUX_VALIDATION_RESULT"
          exit "$fail"

  sandbox:
    name: sandbox confinement (${{ matrix.os }})
    if: ${{ github.event_name != 'push' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources || true
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM --kill-after=10s 90s \
                 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
                 -o Acquire::https::Timeout=20 update \
              && sudo timeout --signal=TERM --kill-after=10s 90s \
                 env DEBIAN_FRONTEND=noninteractive apt-get --yes install bubblewrap; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::bubblewrap installation failed after 3 bounded attempts"
              exit 1
            fi
            echo "::warning::bubblewrap installation attempt ${attempt}/3 failed or hung; retrying"
            sudo dpkg --configure -a || true
            sleep $((attempt * 10))
          done
          # Ubuntu 24.04 (ubuntu-latest) restricts unprivileged user
          # namespaces via AppArmor, which bubblewrap needs to set up its
          # uid map. Relax it so the confinement probe can create the
          # sandbox namespace on the hosted runner. Tolerate the knob being
          # absent (future runner images / kernels): the confinement test
          # itself, run with GOOBERS_REQUIRE_SANDBOX_TEST=1, remains the
          # authoritative gate.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Exercise native sandbox
        run: make sandbox-check

  # Linux node validation (#636): prove the shipped binary end to end on Linux —
  # an offline demo run to completion plus the full daemon start/status/stop
  # lifecycle under a real SIGTERM — and cross-compile the Windows supervision
  # handler (#639). Deterministic and offline; required-ci's needs (#2019)
  # actually makes it a required gate — this comment previously claimed that
  # while the job was still excluded from required-ci's needs list.
  linux-validation:
    name: linux node validation (#636/#639)
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      # Reproduce this full-tier platform gate locally with the same target.
      - name: Validate Linux node and Windows platform seams
        run: make linux-node-validation

      - name: Upload Linux validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-validation-evidence
          path: bin/linux-validation-evidence/
          if-no-files-found: warn

  # Watches EVERY job that validates a landed main SHA. `deploy-reference` was
  # the one push-lane job reporting into a void: it could go red on main with no
  # issue filed. (e2e, envtest and coverage were the other three; deleting them
  # removed the gap rather than closing it.) The needs list and the condition
  # below must stay in step with the set of jobs that lack the
  # `github.event_name != 'push'` guard — test/ci/portability_test.go pins both.
  #
  # The predicate stays `== 'failure'` rather than `!= 'success'` on purpose.
  # `cancel-in-progress` cancels ~64% of push runs because main merges land
  # faster than a full validation completes, and those jobs report `cancelled`.
  # Escalating on anything-but-success would file an issue on almost every
  # merge, burying the real reds this job exists to surface.
  escalate-main-failure:
    name: escalate failed main validation
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        (
          needs.checks.result == 'failure' ||
          needs.deploy-reference.result == 'failure' ||
          needs.lint.result == 'failure' ||
          needs.unit.result == 'failure' ||
          needs.unit-linux-coverage.result == 'failure' ||
          needs.unit-macos.result == 'failure' ||
          needs.shipped.result == 'failure' ||
          needs.windows-smoke.result == 'failure'
        )
      }}
    needs: [checks, deploy-reference, lint, unit, unit-linux-coverage, unit-macos, shipped, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update critical main failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = "CI: main branch validation failed";
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Validation of the tree landed on \`${context.sha}\` failed.`,
              "",
              `Run: ${runURL}`,
              "",
              "This issue was filed automatically by the main-push CI escalation.",
            ].join("\n");
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "goobers:critical",
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["goobers:critical", "type:bug", "area:workflows"],
            });
