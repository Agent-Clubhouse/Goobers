name: EvalSuite gate

# Dormant, and its design direction is superseded. workflow_dispatch only — no
# schedule, no pull_request trigger.
#
# This gate was written against the #2662 EvalSuite direction. #2667 (runner
# integration) and #2668 (this gate's design) were both CLOSED on 2026-08-08 as
# REDIRECTED, not delivered: #2681 replaces the direction with a native
# Go/DSL capability on the existing runner, and #2668's closing note called
# bespoke baseline/alerting gating premature before #2682's comparison
# primitive exists to gate on. Nothing is coming to unblock this file as
# written.
#
# It is kept, not deleted, because #2681 is goobers:nominated and not yet
# goobers:approved; retiring evals/ and this workflow waits on that decision.
# See docs/design/evals-ci-gating.md and docs/design/evals-suite.md.

on:
  workflow_dispatch:
  # Do NOT uncomment these. They were written for a runner shape (#2667) that
  # was redirected rather than built; enabling them would gate merges on a
  # superseded design. Any future eval gate should be re-scoped under #2681.
  # pull_request:
  #   paths: ["evals/**"]
  # schedule:
  #   - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: evals-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: EvalSuite baseline gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify runner is provisioned
        run: |
          if [ ! -d evals/cmd ] || [ ! -d evals/testdata/baselines ]; then
            echo "::error title=EvalSuite gate is superseded, not pending::evals/cmd/ (runner) and evals/testdata/baselines/ (§4) do not exist and are not being built. #2667 and #2668 were closed on 2026-08-08 as redirected to #2681, so nothing will unblock this workflow as written; it is retained only until #2681 is ratified. This is a distinct workflow from evals-tests.yml, which does run the evals/ schema tests (#2670-#2672). See docs/design/evals-suite.md."
            exit 1
          fi

      # These steps were the #2662-direction implementation. They are kept for
      # the historical record only; #2681 replaces the approach:
      #
      # - name: Set up Go
      #   uses: actions/setup-go@v7
      #   with:
      #     go-version-file: go.mod
      #     cache: true
      #
      # - name: Run EvalSuite against committed baselines
      #   run: >-
      #     go run ./evals/cmd/evalsrun gate
      #     -suites evals/suites
      #     -baselines evals/testdata/baselines
      #     -out evals-run-report.json
      #
      # - name: Upload run report
      #   if: ${{ !cancelled() }}
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: evals-run-report-${{ github.run_id }}
      #     path: evals-run-report.json
      #     retention-days: 30

      # Guards partial activation: if a future edit uncomments the trigger
      # and this guard starts passing (evals/cmd + baselines exist) without
      # also uncommenting the run step above, this is the only thing left to
      # catch a green "gate" that never actually ran anything.
      - name: Verify the gate actually ran
        run: |
          if [ ! -f evals-run-report.json ]; then
            echo "::error title=EvalSuite gate activation incomplete::evals-run-report.json was not produced. This workflow's design is superseded by #2681 and should be re-scoped rather than activated; if it is nonetheless being activated, uncomment the 'Run EvalSuite against committed baselines' step above, not just the provisioning guard."
            exit 1
          fi
