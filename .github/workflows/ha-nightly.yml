name: HA nightly kind

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      inject_failure:
        description: Exercise scheduled-failure alarm handling after a successful smoke
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ha-nightly-kind
  cancel-in-progress: false

env:
  HA_NIGHTLY_OWNER_ROTATION: control-plane-ha-maintainers
  KIND_VERSION: v0.30.0
  KIND_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
  HELM_VERSION: v3.18.4
  HELM_SHA256: f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1
  CALICO_VERSION: v3.30.3
  CALICO_SHA256: 9382d2b27a76f40c170454b408653e6d71e2205ef0aef069e942bb690e7381d0
  CNPG_VERSION: v1.27.0
  CNPG_SHA256: 7be449085a4c5941ff05d2c4aca47d4f1c4c87698181fe2c19c47a9f6a43b268
  TEMPORAL_CHART_VERSION: 0.62.0
  TEMPORAL_CHART_SHA256: c2f01baeef60ed96335948640a8ac30fb49a10b906e20c259b92f81f2cba5c04
  TOXIPROXY_VERSION: v2.13.0
  TOXIPROXY_SHA256: bf529e8bb9a05cd293f45a3f1d0aa66ff9469680dcdca7e0ebeae21f1b83de89
  TOXIPROXY_API_URL: http://127.0.0.1:8474/version

jobs:
  smoke:
    name: kind reference smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Acquire pinned nightly tools and manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ha-nightly/bin" "$RUNNER_TEMP/ha-nightly/assets"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" \
            --output "$RUNNER_TEMP/ha-nightly/bin/kind"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            --output "$RUNNER_TEMP/ha-nightly/assets/helm.tgz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/calico.yaml" \
            --output "$RUNNER_TEMP/ha-nightly/assets/calico.yaml"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/${CNPG_VERSION}/releases/cnpg-${CNPG_VERSION#v}.yaml" \
            --output "$RUNNER_TEMP/ha-nightly/assets/cnpg.yaml"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/temporalio/helm-charts/releases/download/temporal-${TEMPORAL_CHART_VERSION}/temporal-${TEMPORAL_CHART_VERSION}.tgz" \
            --output "$RUNNER_TEMP/ha-nightly/assets/temporal.tgz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/Shopify/toxiproxy/releases/download/${TOXIPROXY_VERSION}/toxiproxy-server-linux-amd64" \
            --output "$RUNNER_TEMP/ha-nightly/bin/toxiproxy-server"
          printf '%s  %s\n' \
            "$KIND_SHA256" "$RUNNER_TEMP/ha-nightly/bin/kind" \
            "$HELM_SHA256" "$RUNNER_TEMP/ha-nightly/assets/helm.tgz" \
            "$CALICO_SHA256" "$RUNNER_TEMP/ha-nightly/assets/calico.yaml" \
            "$CNPG_SHA256" "$RUNNER_TEMP/ha-nightly/assets/cnpg.yaml" \
            "$TEMPORAL_CHART_SHA256" "$RUNNER_TEMP/ha-nightly/assets/temporal.tgz" \
            "$TOXIPROXY_SHA256" "$RUNNER_TEMP/ha-nightly/bin/toxiproxy-server" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/ha-nightly/assets/helm.tgz" -C "$RUNNER_TEMP/ha-nightly/assets"
          install -m 0755 "$RUNNER_TEMP/ha-nightly/assets/linux-amd64/helm" "$RUNNER_TEMP/ha-nightly/bin/helm"
          chmod 0755 "$RUNNER_TEMP/ha-nightly/bin/kind" "$RUNNER_TEMP/ha-nightly/bin/toxiproxy-server"
          echo "$RUNNER_TEMP/ha-nightly/bin" >> "$GITHUB_PATH"

      - name: Render Temporal HA values
        env:
          TEMPORAL_HA_CHART_VERSION: 1.3.0
          TEMPORAL_HA_CHART_SHA256: 83a98858961b3d085060c9c2a12b0777e06a619aca9f780ffd2b7d092a72ddfa
        run: |
          set -euo pipefail
          chart="$RUNNER_TEMP/ha-nightly/assets/temporal-ha.tgz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/temporalio/helm-charts/releases/download/temporal-${TEMPORAL_HA_CHART_VERSION}/temporal-${TEMPORAL_HA_CHART_VERSION}.tgz" \
            --output "$chart"
          printf '%s  %s\n' "$TEMPORAL_HA_CHART_SHA256" "$chart" | sha256sum --check --strict
          GOOBERS_TEMPORAL_CHART_1_3_0="$chart" go test ./cmd/goobers -run 'TestDeployReferenceTemporalHAValues' -count=1

      - name: Build reference image
        run: make image IMAGE=goobers:ha-nightly

      - name: Run kind environment smoke
        env:
          HA_ASSET_DIR: ${{ runner.temp }}/ha-nightly/assets
          HA_BIN_DIR: ${{ runner.temp }}/ha-nightly/bin
          HA_EVIDENCE_DIR: ${{ runner.temp }}/ha-nightly/evidence
        run: go run ./test/ha/kind/cmd/nightly run

      # HA-P3-20: apply the goobers-cloud reference to the same kind cluster.
      # Gated on (1) the built CLI having the combined `control` role (#7850)
      # and (2) its control-plane assembly being complete: `control` refuses to
      # boot while assembleControlPlanes is the empty stub, which would crash-loop
      # goobers-control. Replace (2) with a `control --check-assembly` exit code
      # if the role grows one.
      - name: Detect goobers-cloud control role
        id: cloud
        run: |
          if ! go run ./cmd/goobers-cloud help control >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=cloud reference skipped::goobers-cloud control role not present yet"
          elif grep -q 'return controlPlanes{}, nil' cmd/goobers-cloud/control.go; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=cloud reference skipped::control-plane assembly is still the empty stub (HA-P3-18)"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply goobers-cloud reference and check rollout
        if: ${{ steps.cloud.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          instance=nightly # must match instance-id in test/ha/kind/cloud-reference
          database="goobers_${instance}"
          secrets="$(mktemp -d)"
          trap 'rm -rf "$secrets"' EXIT
          chmod 700 "$secrets"
          # Provision the database and the three roles BEFORE migrate, as the
          # CNPG superuser (the pgroles contract: goobers_<instance> owned by
          # goobers_owner; goobers_api and goobers_controller are grant targets).
          # Replace with `goobers-cloud bootstrap` once it no longer refuses on
          # unshipped steps (#7869). Passwords go over stdin, never argv.
          for role in owner api controller; do
            openssl rand -hex 24 | tr -d '\n' > "$secrets/pw-$role"
          done
          {
            for role in owner api controller; do
              printf "CREATE ROLE goobers_%s LOGIN PASSWORD '%s';\n" "$role" "$(cat "$secrets/pw-$role")"
            done
            printf 'CREATE DATABASE %s OWNER goobers_owner;\n' "$database"
          } | kubectl -n goobers-temporal exec -i temporal-postgres-1 -c postgres -- psql -v ON_ERROR_STOP=1
          for role in owner api controller; do
            url="postgres://goobers_${role}:$(cat "$secrets/pw-$role")@temporal-postgres-rw.goobers-temporal.svc:5432/${database}?sslmode=require"
            printf '%s' "$url" > "$secrets/$role-url"
          done
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=goobers-control" \
            -addext "subjectAltName=DNS:goobers-control,DNS:goobers-control.goobers-cloud.svc" \
            -keyout "$secrets/tls.key" -out "$secrets/tls.crt"
          printf '{"current":{"id":"nightly","key":"%s"}}' "$(openssl rand -base64 48 | tr -d '\n')" > "$secrets/keyring.json"
          kubectl apply -k deploy/reference/goobers-cloud/prereqs
          kubectl -n goobers-cloud create secret generic goobers-cloud-db-owner \
            --from-file=direct-url="$secrets/owner-url"
          for role in api controller; do
            kubectl -n goobers-cloud create secret generic "goobers-cloud-db-$role" \
              --from-file=url="$secrets/$role-url" --from-file=direct-url="$secrets/$role-url"
          done
          kubectl -n goobers-cloud create secret tls goobers-cloud-control-tls \
            --cert="$secrets/tls.crt" --key="$secrets/tls.key"
          kubectl -n goobers-cloud create secret generic goobers-cloud-pod-key \
            --from-file=keyring.json="$secrets/keyring.json"
          # kind has no Entra: the overlay sets database-auth=password in the
          # shared ConfigMap. Outside Argo the PreSync hook is just a Job: apply
          # everything, then require it to complete before the rollout check.
          kubectl apply -k test/ha/kind/cloud-reference
          kubectl -n goobers-cloud wait --for=condition=complete job/goobers-cloud-migrate --timeout=10m
          kubectl -n goobers-cloud rollout status deployment/goobers-control --timeout=5m
          kubectl -n goobers-cloud wait --for=condition=Ready pod -l app.kubernetes.io/name=goobers-control --timeout=2m
          kubectl -n goobers-cloud get pdb goobers-control

      - name: Inject alarm-drill failure
        if: ${{ inputs.inject_failure }}
        run: |
          echo "::error title=HA nightly alarm drill::intentional failure after successful smoke"
          exit 1

      - name: Collect evidence
        if: ${{ always() }}
        env:
          HA_EVIDENCE_DIR: ${{ runner.temp }}/ha-nightly/evidence
        run: go run ./test/ha/kind/cmd/nightly collect

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-nightly-kind-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ha-nightly/evidence/
          if-no-files-found: error
          retention-days: 30
