name: EvalSuite Tests

# #2663: schema validation tests for the EvalSuite DSL (evals/). Scoped to
# the evals/ directory and this workflow file so unrelated PRs don't pay for
# a Python setup step.

on:
  push:
    branches: [main]
    paths:
      - "evals/**"
      - ".github/workflows/evals-tests.yml"
  pull_request:
    paths:
      - "evals/**"
      - ".github/workflows/evals-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (evals/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r evals/requirements.txt

      - name: Run tests
        run: pytest
        working-directory: evals
