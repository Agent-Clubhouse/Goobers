name: Portal package
on:
  pull_request:
    paths:
      - "portal/**"
      - ".github/workflows/portal-package.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: portal
      - run: npm run typecheck && npm test -- src/package.test.tsx src/App.test.tsx src/liveData.test.tsx
        working-directory: portal
      - run: npm run package:portal && npm run test:package
        working-directory: portal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: goobers-portal-${{ github.sha }}
          path: |
            portal/.portal-package/*.tgz
            portal/.portal-package/*.sha256
            portal/.portal-package/package/portal-artifact.json
          if-no-files-found: error
          include-hidden-files: true
