name: Release

on:
  push:
    # The trailing "*" matches past embedded dots/dashes, so this also
    # triggers on pre-release tags (e.g. "v1.2.3-beta.2") — see
    # docs/guides/releases.md "Pre-release tags".
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      source-commit: ${{ steps.release-source.outputs.commit }}
      version: ${{ steps.archive-build.outputs.version }}
      commit: ${{ steps.archive-build.outputs.commit }}
      date: ${{ steps.archive-build.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      # Manual reruns are supported on release tags, never branch refs. Peeling
      # both identities supports annotated tags without trusting short stamps.
      - name: Authorize release source
        id: release-source
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EVENT" != push && "$RELEASE_EVENT" != workflow_dispatch ]]; then
            echo '::error::Release requires a tag push or a manual run on a release tag.'
            exit 1
          fi
          core='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          release_ref="^refs/tags/v${core}\.${core}\.${core}(-${identifier}(\.${identifier})*)?$"
          if [[ ! "$RELEASE_REF" =~ $release_ref ]]; then
            echo '::error::Release requires a canonical vMAJOR.MINOR.PATCH tag with an optional SemVer prerelease suffix.'
            exit 1
          fi
          if [[ ! "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Release event source must be a full Git object identity.'
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "${RELEASE_REF}^{commit}")"
          event_commit="$(git rev-parse --verify "${EXPECTED_SOURCE}^{commit}")"
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$tag_commit" != "$event_commit" || "$checkout_commit" != "$event_commit" ]]; then
            echo '::error::Release tag, event source, and checked-out commit must agree.'
            exit 1
          fi
          echo "commit=$event_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Build Portal asset artifact
        env:
          GOOBERS_PORTAL_COMMIT: ${{ steps.release-source.outputs.commit }}
          GOOBERS_PORTAL_VERSION: ${{ github.ref_name }}
        run: |
          npm --prefix portal ci --no-audit --no-fund
          npm --prefix portal run build

      - name: Resolve feature baseline
        id: feature-baseline
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous_tag=""
          release_commit="$(git rev-list --parents -n 1 "$TAG")"
          if [[ "$release_commit" == *" "* ]]; then
            previous_tag="$(
              git tag --merged "$TAG^" --sort=-version:refname --list "v*" |
                grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
                head -n 1 || true
            )"
          fi

          if [[ -z "$previous_tag" ]]; then
            echo "first=true" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            mkdir -p .release-baseline
            gh release download "$previous_tag" \
              --pattern feature-registry.json \
              --pattern dsl-support-matrix.json \
              --dir .release-baseline
            test -s .release-baseline/feature-registry.json
            test -s .release-baseline/dsl-support-matrix.json
            echo "first=false" >> "$GITHUB_OUTPUT"
            echo "path=.release-baseline/feature-registry.json" >> "$GITHUB_OUTPUT"
            echo "support-path=.release-baseline/dsl-support-matrix.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release artifacts
        id: archive-build
        env:
          COMMIT_SHA: ${{ steps.release-source.outputs.commit }}
          FIRST_FEATURE_SNAPSHOT: ${{ steps.feature-baseline.outputs.first }}
          PREVIOUS_FEATURES: ${{ steps.feature-baseline.outputs.path }}
          PREVIOUS_SUPPORT_MATRIX: ${{ steps.feature-baseline.outputs.support-path }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$FIRST_FEATURE_SNAPSHOT" == "true" ]]; then
            baseline=(-first-feature-snapshot)
          else
            baseline=(
              -previous-features "$PREVIOUS_FEATURES"
              -previous-support-matrix "$PREVIOUS_SUPPORT_MATRIX"
            )
          fi
          commit="$(git rev-parse --short=12 "$COMMIT_SHA")"
          date="$(git show -s --format=%cI "$COMMIT_SHA")"
          go run ./release \
            -version "$TAG" \
            -commit "$commit" \
            -date "$date" \
            -output dist \
            -image-contexts original-image-inputs \
            -image-targets linux/amd64,linux/arm64,windows/amd64 \
            "${baseline[@]}"
          # Export the exact embedded stamps, not a later recomputation.
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-unsigned
          path: dist/
          retention-days: 1
          if-no-files-found: error

      # Preserve the original operator build and pinned image recipes. The
      # operator is not part of Authenticode signing; only goobers.exe is signed.
      - name: Upload original image inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-image-inputs
          path: original-image-inputs/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  sign-macos:
    name: Sign and notarize macOS binaries
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Download unsigned artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-unsigned
          path: dist

      # Bare-file executable bits (install.sh) aren't guaranteed to survive an
      # upload/download round-trip; the binaries inside the tar/zip archives
      # carry their own mode as archive metadata and are unaffected.
      - name: Restore executable bits
        run: chmod -R a+x dist

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/apple-cert.p12"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 1800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # codesign resolves signing identities through the keychain search
          # list, not just an explicit --keychain flag on the sign command —
          # without this, codesign reports "no identity found" even when
          # --keychain correctly points at the unlocked keychain containing
          # the imported identity. Existing keychains are preserved, not
          # replaced.
          existing_keychains="$(security list-keychains -d user | sed 's/[[:space:]]*"//;s/"$//')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing_keychains

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Discover signing identity
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" \
            | head -n 1 \
            | sed -E 's/.*"(.+)"/\1/')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Signs the raw binary inside each darwin archive, submits it for
      # notarization, and re-packages the archive under the same name.
      # Stapling doesn't apply here: `stapler staple` only works on
      # .app/.pkg/.dmg bundles, not a bare Mach-O executable, so this is
      # online-only notarization (see docs/guides/releases.md).
      - name: Sign and notarize darwin binaries
        env:
          TAG: ${{ github.ref_name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            ARCHIVE="dist/goobers_${TAG}_darwin_${ARCH}.tar.gz"
            WORKDIR="$RUNNER_TEMP/darwin-${ARCH}"
            mkdir -p "$WORKDIR"
            tar -xzf "$ARCHIVE" -C "$WORKDIR"
            chmod 755 "$WORKDIR/goobers"

            codesign --force --options runtime --timestamp \
              --keychain "$KEYCHAIN_PATH" --sign "$IDENTITY" \
              "$WORKDIR/goobers"
            codesign --verify --deep --strict "$WORKDIR/goobers"

            NOTARIZE_ZIP="$RUNNER_TEMP/goobers-notarize-${ARCH}.zip"
            ditto -c -k --keepParent "$WORKDIR/goobers" "$NOTARIZE_ZIP"
            xcrun notarytool submit "$NOTARIZE_ZIP" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 20m

            # Signing and notarization only prove the binary's bytes are
            # trusted, not that it runs (#4269) — the arm64 runner image
            # carries Rosetta 2 preinstalled, so amd64 executes natively
            # under translation the same as on a real Intel Mac.
            "$WORKDIR/goobers" --version | grep --fixed-strings "$TAG"

            rm -f "$ARCHIVE"
            tar -czf "$ARCHIVE" -C "$WORKDIR" $(ls -A "$WORKDIR")
            rm -rf "$WORKDIR" "$NOTARIZE_ZIP"
          done

      # sha256sum isn't guaranteed on the macOS runner image (GNU coreutils);
      # shasum always ships. Same "<hex>  <filename>" format as
      # release/pack.go's checksumsManifest, so the later `sha256sum --check`
      # on a Linux runner still verifies.
      - name: Recompute SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          files="$(awk '{print $2}' SHA256SUMS)"
          : > SHA256SUMS.new
          for f in $files; do
            shasum -a 256 "$f" >> SHA256SUMS.new
          done
          sort SHA256SUMS.new -o SHA256SUMS
          rm SHA256SUMS.new

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-signed
          path: dist/
          retention-days: 1
          if-no-files-found: error

  sign-windows:
    name: Sign Windows binary
    outputs:
      signed-artifact-id: ${{ steps.final-signed-artifacts.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
    needs: sign-macos
    runs-on: windows-latest
    timeout-minutes: 30
    # Entra federated identity credentials match the OIDC subject claim
    # exactly — there is no wildcard support, so a per-tag subject
    # (refs/tags/*) never matches a real tag push. Scoping to a GitHub
    # Environment gives a stable, exact subject regardless of which tag
    # triggered the run. Matches the sibling Clubhouse product's working
    # setup (repo:Agent-Clubhouse/Clubhouse:environment:release).
    environment: release
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-signed
          path: dist

      # Explicit bash: the Windows runner defaults to PowerShell.
      - name: Extract goobers.exe
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir winsign
          unzip -q "dist/goobers_${TAG}_windows_amd64.zip" -d winsign

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Reuses the sibling Clubhouse product's certificate profile — a
      # code-signing certificate identifies the publisher (Mason Allen), not
      # a specific product, matching how macOS signing above already reuses
      # one Apple Developer ID for both. No separate Windows identity or
      # Azure resource is needed.
      - name: Sign goobers.exe
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: Clubhouse-Win-Signing
          certificate-profile-name: clubhouse-win-codesign
          files-folder: winsign
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signature
        run: |
          $path = 'winsign\goobers.exe'
          $pe = [IO.File]::ReadAllBytes($path)
          $optionalHeader = [BitConverter]::ToInt32($pe, 0x3c) + 24
          $dataDirectoryOffset = switch ([BitConverter]::ToUInt16($pe, $optionalHeader)) {
            0x10b { 96 }
            0x20b { 112 }
            default { throw "Unsupported PE optional-header format in $path" }
          }
          $certificateTable = $optionalHeader + $dataDirectoryOffset + (4 * 8)
          $certificateOffset = [BitConverter]::ToUInt32($pe, $certificateTable)
          $certificateSize = [BitConverter]::ToUInt32($pe, $certificateTable + 4)
          if ($certificateOffset -eq 0 -or $certificateSize -eq 0) {
            throw "PE Certificate Table is empty: $path is unsigned"
          }
          if ([uint64]$certificateOffset + $certificateSize -gt $pe.Length) {
            throw "PE Certificate Table extends beyond the end of $path"
          }

          $signature = Get-AuthenticodeSignature -FilePath $path
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode signature is not valid: $($signature.Status) ($($signature.StatusMessage))"
          }

      # A valid Authenticode signature only proves the exe's bytes are
      # trusted, not that it runs (#4269).
      - name: Execute signed goobers.exe
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = & winsign\goobers.exe --version
          if ($version -notmatch [regex]::Escape($env:TAG)) {
            throw "goobers.exe --version output ($version) does not contain tag $env:TAG"
          }

      # bash on the windows-latest image has no `zip`; Compress-Archive is
      # built into Windows and needs no extra install.
      - name: Repackage signed archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $Archive = "dist\goobers_${env:TAG}_windows_amd64.zip"
          Remove-Item -ErrorAction SilentlyContinue $Archive
          Compress-Archive -Path (Join-Path winsign '*') -DestinationPath $Archive
          Remove-Item -Recurse -Force winsign

      # --text forces GNU coreutils' non-asterisk "<hex>  <filename>" marker;
      # its Windows build defaults to binary-mode "<hex> *<filename>", which
      # breaks the later `grep --fixed-strings "  <filename>"` checks in
      # "Verify release artifacts" (shasum never adds this marker at all).
      - name: Recompute SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            cksum() { sha256sum --text "$1"; }
          else
            cksum() { shasum -a 256 "$1"; }
          fi
          cd dist
          files="$(awk '{print $2}' SHA256SUMS)"
          : > SHA256SUMS.new
          for f in $files; do
            cksum "$f" >> SHA256SUMS.new
          done
          sort SHA256SUMS.new -o SHA256SUMS
          rm SHA256SUMS.new

      - name: Upload fully-signed artifacts
        id: final-signed-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-signed
          path: dist/
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  native-smoke:
    name: Smoke signed ${{ matrix.target }} artifact
    needs: sign-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: windows-latest
            target: windows_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate final signed artifact ID
        env:
          ARTIFACT_ID: ${{ needs.sign-windows.outputs.signed-artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Expected one positive decimal artifact ID; refusing download-all fallback.'
            exit 1
          fi
      - name: Download fully signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.signed-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Execute native release binary
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          extension=tar.gz
          binary=goobers
          if [[ "$TARGET" == windows_* ]]; then
            extension=zip
            binary=goobers.exe
          fi
          archive="goobers_${TAG}_${TARGET}.${extension}"
          cd dist
          awk -v name="$archive" '$2 == name { print; found=1 } END { if (!found) exit 1 }' SHA256SUMS > selected-checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check selected-checksum
          else
            shasum -a 256 --check selected-checksum
          fi
          mkdir native-smoke
          if [[ "$extension" == zip ]]; then
            unzip -q "$archive" -d native-smoke
          else
            tar -xzf "$archive" -C native-smoke
          fi
          chmod +x "native-smoke/$binary"
          "./native-smoke/$binary" --version | grep --fixed-strings "$TAG"
          "./native-smoke/$binary" init --allow-ephemeral --template=quickstart native-smoke/instance
          "./native-smoke/$binary" validate native-smoke/instance

  # Native verification imports the final signed archives and the original
  # same-build operator inputs. It never rebuilds product binaries or publishes
  # container images. Distributed/authenticated acceptance remains a separate gate.
  native-linux-images:
    name: Verify signed inputs in native ${{ matrix.target }} images
    needs: [build, sign-windows]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux/amd64
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux/arm64
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_DATE: ${{ needs.build.outputs.date }}
      IMAGE_TARGET: ${{ matrix.target }}
      IMAGE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout authorized image tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.source-commit }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate final signed artifact ID
        env:
          ARTIFACT_ID: ${{ needs.sign-windows.outputs.signed-artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Expected one positive decimal artifact ID; refusing download-all fallback.'
            exit 1
          fi
      - name: Download fully signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.signed-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Download original image inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: original-image-inputs
          path: original-image-inputs
      - name: Verify native images from final release artifacts
        id: image-verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-image-evidence
          prefix="goobers-release-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE_PLATFORM}"
          echo "IMAGE_VERIFY_PREFIX=$prefix" >> "$GITHUB_ENV"
          cp dist/SHA256SUMS native-image-evidence/final-archive-SHA256SUMS
          jq -n --arg source "$RELEASE_SOURCE_COMMIT" --arg version "$RELEASE_VERSION" \
            --arg commit "$RELEASE_COMMIT" --arg date "$RELEASE_DATE" --arg target "$IMAGE_TARGET" \
            '{sourceCommit:$source,version:$version,embeddedCommit:$commit,date:$date,target:$target,operatorOrigin:"original same-build context"}' \
            > native-image-evidence/release-source.json
          docker version 2>&1 | tee native-image-evidence/docker-version.txt
          go run ./release \
            -version "$RELEASE_VERSION" -commit "$RELEASE_COMMIT" -date "$RELEASE_DATE" \
            -targets "$IMAGE_TARGET" -image-artifacts dist -image-inputs original-image-inputs \
            -image-contexts verified-image-contexts -build-images -image-prefix "$prefix" \
            2>&1 | tee native-image-evidence/release-image-verification.txt
          jq -e --arg target "$IMAGE_TARGET" \
            '.schemaVersion == 1 and .native == true and .enginePlatform == $target and (.images | length) == 3' \
            verified-image-contexts/image-evidence.json
      - name: Retain native image provenance and failure evidence
        if: always()
        env:
          IMAGE_VERIFICATION_OUTCOME: ${{ steps.image-verification.outcome }}
        shell: bash
        run: |
          set -uo pipefail
          # Evidence loss after successful verification must block publication.
          # For an already-failed verification, keep whatever diagnostics exist.
          if [[ "$IMAGE_VERIFICATION_OUTCOME" == success ]]; then set -e; else set +e; fi
          mkdir -p native-image-evidence
          for directory in original-image-inputs verified-image-contexts; do
            if [[ -d "$directory" ]]; then
              find "$directory" -type f \( -name SHA256SUMS -o -name '*.json' -o -name source -o -name version -o -name Dockerfile \) -print0 |
                while IFS= read -r -d '' file; do
                  destination="native-image-evidence/$file"
                  mkdir -p "${destination%/*}"
                  cp "$file" "$destination"
                done
            fi
          done
          if [[ -n "${IMAGE_VERIFY_PREFIX:-}" ]]; then
            docker image ls --no-trunc --filter "reference=${IMAGE_VERIFY_PREFIX}/*" > native-image-evidence/image-list.txt 2>&1
            ids="$(docker image ls --quiet --no-trunc --filter "reference=${IMAGE_VERIFY_PREFIX}/*")"
            image_ids=()
            while IFS= read -r image_id; do
              if [[ -n "$image_id" ]]; then image_ids+=("$image_id"); fi
            done <<< "$ids"
            if [[ ${#image_ids[@]} -gt 0 ]]; then
              docker image inspect "${image_ids[@]}" > native-image-evidence/image-inspect.json
            fi
          fi
          if [[ "$IMAGE_VERIFICATION_OUTCOME" == success ]]; then
            required=(release-source.json final-archive-SHA256SUMS release-image-verification.txt image-inspect.json
              verified-image-contexts/image-evidence.json
              "original-image-inputs/$IMAGE_PLATFORM/SHA256SUMS" "original-image-inputs/$IMAGE_PLATFORM/release.json"
              "verified-image-contexts/$IMAGE_PLATFORM/SHA256SUMS" "verified-image-contexts/$IMAGE_PLATFORM/release.json"
              "verified-image-contexts/$IMAGE_PLATFORM/artifact-import.json")
            for harness in copilot claude; do
              required+=("verified-image-contexts/harness-$harness/SHA256SUMS"
                "verified-image-contexts/harness-$harness/source" "verified-image-contexts/harness-$harness/version")
            done
            for file in "${required[@]}"; do
              if [[ ! -s "native-image-evidence/$file" ]]; then
                echo "::error::Required native image evidence missing: $file" >&2
                exit 1
              fi
            done
          fi
          exit 0
      - name: Upload native image verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-images-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-image-evidence/
          retention-days: 14
          if-no-files-found: error

  native-windows-image:
    name: Verify signed inputs in native Windows Server 2022 image
    needs: [build, sign-windows]
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_DATE: ${{ needs.build.outputs.date }}
      # Windows containers use the native legacy builder.
      DOCKER_BUILDKIT: '0'
    steps:
      - name: Checkout authorized image tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.source-commit }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate final signed artifact ID
        env:
          ARTIFACT_ID: ${{ needs.sign-windows.outputs.signed-artifact-id }}
        shell: pwsh
        run: |
          if ($env:ARTIFACT_ID -cnotmatch '\A[1-9][0-9]*\z') {
            throw 'Expected one positive decimal artifact ID; refusing download-all fallback.'
          }
      - name: Download fully signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.signed-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Download original image inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: original-image-inputs
          path: original-image-inputs
      - name: Verify native image from final release artifacts
        id: image-verification
        run: |
          $evidenceDir = 'native-image-evidence'
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          $prefix = "goobers-release-verify-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-windows-amd64"
          "IMAGE_VERIFY_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Copy-Item -LiteralPath dist/SHA256SUMS -Destination "$evidenceDir/final-archive-SHA256SUMS"
          [ordered]@{ sourceCommit = $env:RELEASE_SOURCE_COMMIT; version = $env:RELEASE_VERSION; embeddedCommit = $env:RELEASE_COMMIT; date = $env:RELEASE_DATE; target = 'windows/amd64'; operatorOrigin = 'original same-build context; not Authenticode-signed by this workflow' } |
            ConvertTo-Json | Set-Content "$evidenceDir/release-source.json"
          docker version 2>&1 | Tee-Object -FilePath "$evidenceDir/docker-version.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Native Docker engine unavailable' }
          go run ./release `
            -version $env:RELEASE_VERSION -commit $env:RELEASE_COMMIT -date $env:RELEASE_DATE `
            -targets windows/amd64 -image-artifacts dist -image-inputs original-image-inputs `
            -image-contexts verified-image-contexts -build-images -image-prefix $prefix `
            2>&1 | Tee-Object -FilePath "$evidenceDir/release-image-verification.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows image build or verification failed' }
          $proof = Get-Content -Raw verified-image-contexts/image-evidence.json | ConvertFrom-Json
          $images = @($proof.images)
          if ($proof.schemaVersion -ne 1 -or $proof.native -isnot [bool] -or $proof.native -ne $true -or $proof.enginePlatform -ne 'windows/amd64' -or $images.Count -ne 1 -or $images[0].family -ne 'goobers-base-windows') { throw 'Expected one verified native Windows base image' }
      - name: Retain native image provenance and failure evidence
        if: always()
        env:
          IMAGE_VERIFICATION_OUTCOME: ${{ steps.image-verification.outcome }}
        run: |
          $requiredEvidence = $env:IMAGE_VERIFICATION_OUTCOME -eq 'success'
          $ErrorActionPreference = if ($requiredEvidence) { 'Stop' } else { 'Continue' }
          $evidenceDir = 'native-image-evidence'
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          foreach ($directory in @('original-image-inputs', 'verified-image-contexts')) {
            if (Test-Path -LiteralPath $directory) {
              $source = (Resolve-Path -LiteralPath $directory).Path
              Get-ChildItem -LiteralPath $directory -Recurse -File | Where-Object { $_.Extension -eq '.json' -or $_.Name -in @('SHA256SUMS', 'source', 'version', 'Dockerfile') } | ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($source, $_.FullName)
                $destination = Join-Path $evidenceDir (Join-Path $directory $relative)
                New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
                Copy-Item -LiteralPath $_.FullName -Destination $destination
              }
            }
          }
          if ($env:IMAGE_VERIFY_PREFIX) {
            docker image ls --no-trunc --filter "reference=$($env:IMAGE_VERIFY_PREFIX)/*" 2>&1 | Set-Content "$evidenceDir/image-list.txt"
            if ($requiredEvidence -and $LASTEXITCODE -ne 0) { throw 'Cannot retain verified image list' }
            $images = @(docker image ls --quiet --no-trunc --filter "reference=$($env:IMAGE_VERIFY_PREFIX)/*")
            if ($requiredEvidence -and $LASTEXITCODE -ne 0) { throw 'Cannot enumerate verified images' }
            if ($LASTEXITCODE -eq 0 -and $images.Count -gt 0) {
              docker image inspect @images | Set-Content "$evidenceDir/image-inspect.json"
              if ($requiredEvidence -and $LASTEXITCODE -ne 0) { throw 'Cannot retain verified image inspection' }
            }
          }
          if ($requiredEvidence) {
            $requiredFiles = @('release-source.json', 'final-archive-SHA256SUMS', 'release-image-verification.txt', 'image-inspect.json',
              'verified-image-contexts/image-evidence.json', 'original-image-inputs/windows-amd64/SHA256SUMS',
              'original-image-inputs/windows-amd64/release.json', 'verified-image-contexts/windows-amd64/SHA256SUMS',
              'verified-image-contexts/windows-amd64/release.json', 'verified-image-contexts/windows-amd64/artifact-import.json',
              'verified-image-contexts/windows-amd64/dependencies.json')
            foreach ($file in $requiredFiles) {
              $path = Join-Path $evidenceDir $file
              if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) { throw "Required native image evidence missing: $file" }
            }
          }
          exit 0
      - name: Upload native image verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-images-windows-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-image-evidence/
          retention-days: 14
          if-no-files-found: error

  validate-release:
    name: Validate signed release ${{ github.ref_name }}
    outputs:
      notes-artifact-id: ${{ steps.release-notes-upload.outputs.artifact-id }}
    permissions:
      contents: read
    needs: [sign-windows, native-smoke, native-linux-images, native-windows-image]
    runs-on: ubuntu-latest
    steps:
      # "Generate release notes" below shells out to real git commands for
      # changelog history, so this job needs its own checkout (the previous
      # single-job design got this for free; a download-artifact-only
      # workspace has no .git at all).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      # Manual reruns are supported on release tags, never branch refs. Peeling
      # both identities supports annotated tags without trusting short stamps.
      - name: Authorize release source
        id: release-source
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EVENT" != push && "$RELEASE_EVENT" != workflow_dispatch ]]; then
            echo '::error::Release requires a tag push or a manual run on a release tag.'
            exit 1
          fi
          core='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          release_ref="^refs/tags/v${core}\.${core}\.${core}(-${identifier}(\.${identifier})*)?$"
          if [[ ! "$RELEASE_REF" =~ $release_ref ]]; then
            echo '::error::Release requires a canonical vMAJOR.MINOR.PATCH tag with an optional SemVer prerelease suffix.'
            exit 1
          fi
          if [[ ! "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Release event source must be a full Git object identity.'
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "${RELEASE_REF}^{commit}")"
          event_commit="$(git rev-parse --verify "${EXPECTED_SOURCE}^{commit}")"
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$tag_commit" != "$event_commit" || "$checkout_commit" != "$event_commit" ]]; then
            echo '::error::Release tag, event source, and checked-out commit must agree.'
            exit 1
          fi
          echo "commit=$event_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate final signed artifact ID
        env:
          ARTIFACT_ID: ${{ needs.sign-windows.outputs.signed-artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Expected one positive decimal artifact ID; refusing download-all fallback.'
            exit 1
          fi
      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.signed-artifact-id }}
          merge-multiple: true
          path: dist

      - name: Restore executable bits
        run: chmod -R a+x dist

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go run ./release/notes \
            -tag "$TAG" \
            -feature-notes dist/RELEASE_NOTES.md \
            -output dist/RELEASE_NOTES.md

      # Native signed artifacts must pass native-smoke before this job starts.
      # This leg exercises linux/amd64, the packaged demo, and portal payload.
      - name: Verify release artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          grep --fixed-strings "## Changelog" dist/RELEASE_NOTES.md
          grep --fixed-strings "## DSL feature-support delta" dist/RELEASE_NOTES.md
          grep --fixed-strings "## DSL support-matrix delta" dist/RELEASE_NOTES.md
          grep --fixed-strings "## Support policy for external consumers" dist/RELEASE_NOTES.md
          test -x dist/install.sh
          sh -n dist/install.sh
          grep --fixed-strings "  install.sh" dist/SHA256SUMS
          grep --fixed-strings "  goobers-onboarding_${TAG}.zip" dist/SHA256SUMS
          mkdir smoke
          tar -xzf "dist/goobers_${TAG}_linux_amd64.tar.gz" -C smoke
          export PATH="$PWD/smoke:$PATH"
          goobers --version | grep --fixed-strings "$TAG"
          # #4829: a per-candidate readiness scratchpad (citing one author's
          # own /tmp evidence trail, asserting a promotion status that goes
          # stale the moment a later candidate ships) must never reach a
          # release archive — its home is git history, not the archive.
          if compgen -G "smoke/docs/releases/*-readiness.md" > /dev/null; then
            echo "release archive shipped a readiness record: $(ls smoke/docs/releases/*-readiness.md)" >&2
            exit 1
          fi
          grep --fixed-strings "# Goobers ${TAG} documentation" smoke/docs/RELEASE.md
          grep --fixed-strings "bundled with release \`${TAG}\`" smoke/docs/guides/quickstart.md
          grep --fixed-strings "goobers-${TAG} init --guided" smoke/docs/guides/quickstart.md
          grep --fixed-strings "goobers-${TAG} run implementation ./my-instance" smoke/docs/guides/quickstart.md
          ! grep --fixed-strings "go build -o bin/goobers" smoke/docs/guides/quickstart.md
          ! grep --fixed-strings "bin/goobers init" smoke/docs/guides/quickstart.md
          test -f smoke/onboarding/manifest.json
          test -f smoke/onboarding/templates/canonical/gaggles/acme-web/workflows/implementation.yaml
          test -f smoke/onboarding/templates/quickstart@v1/gaggles/example/workflows/quickstart.yaml
          test -f smoke/onboarding/samples/getting-started-task-api@1.0.0/sample.json
          test -f smoke/onboarding/samples/getting-started-task-api@1.0.0/seed-issues.json
          grep --fixed-strings "\"version\": \"${TAG}\"" smoke/onboarding/manifest.json
          mkdir onboarding-asset
          unzip -q "dist/goobers-onboarding_${TAG}.zip" -d onboarding-asset
          diff --recursive smoke/onboarding onboarding-asset
          goobers init --allow-ephemeral --template=quickstart smoke/quickstart-instance
          goobers validate smoke/quickstart-instance
          # The shipped, credential-free mock demo is trusted test content.
          # Exercise the documented opt-in on CI hosts without user namespaces.
          goobers init --allow-ephemeral --demo --insecure smoke/demo-instance
          GOOBERS_ALLOW_UNISOLATED_NETWORK_NONE=1 goobers run demo smoke/demo-instance | tee smoke/demo-result.txt
          grep --fixed-strings "phase=completed" smoke/demo-result.txt
          grep --fixed-strings "  goobers_portal_${TAG}.tar.gz" dist/SHA256SUMS
          mkdir smoke/portal
          tar -xzf "dist/goobers_portal_${TAG}.tar.gz" -C smoke/portal
          test -s smoke/portal/index.html
          test -f smoke/quickstart-instance/config/gaggles/example/workflows/quickstart.yaml
          mkdir generated-docs
          goobers __generate-docs generated-docs
          diff --recursive smoke/docs/cli generated-docs/cli
          diff --recursive smoke/docs/man generated-docs/man
          diff --recursive smoke/docs/completion generated-docs/completion

      - name: Exercise installer against staged release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            if sh dist/install.sh "$TAG" > smoke/installer.txt 2>&1; then
              echo "Pre-release installer unexpectedly succeeded" >&2
              exit 1
            fi
            grep --fixed-strings "pre-release tags are intentionally not installable" smoke/installer.txt
            grep --fixed-strings "SHA256SUMS" smoke/installer.txt
          else
            # Intercept only the download transport; install.sh still verifies
            # checksums, executes the real binary, and installs the real payload.
            mkdir smoke/download-tools
            cat > smoke/download-tools/curl <<'CURL'
          #!/bin/sh
          set -eu
          [ "$#" -eq 4 ] && [ "$1" = -fsSL ] && [ "$3" = -o ]
          case "$2" in
            "https://github.com/Agent-Clubhouse/Goobers/releases/download/${TAG}/"*) ;;
            *) exit 1 ;;
          esac
          cp "$GOOBERS_SMOKE_ASSETS/${2##*/}" "$4"
          CURL
            chmod +x smoke/download-tools/curl
            PATH="$PWD/smoke/download-tools:$PATH" \
              GOOBERS_SMOKE_ASSETS="$PWD/dist" \
              GOOBERS_INSTALL_DIR="$PWD/smoke/installed/bin" \
              GOOBERS_DOCS_DIR="$PWD/smoke/installed/docs" \
              sh dist/install.sh "$TAG"
            "./smoke/installed/bin/goobers-$TAG" --version | grep --fixed-strings "$TAG"
            test -s "smoke/installed/docs/$TAG/onboarding/manifest.json"
          fi

      - name: Upload validated release notes
        id: release-notes-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/RELEASE_NOTES.md
          retention-days: 1
          if-no-files-found: error

  verify-and-publish:
    name: Verify and publish ${{ github.ref_name }}
    permissions:
      contents: write
    needs: [sign-windows, native-smoke, native-linux-images, native-windows-image, validate-release]
    runs-on: ubuntu-latest
    steps:
      # This job never executes downloaded binaries, installers, generated
      # docs tooling, or repository build tools. Checkout is only for the
      # canonical Git source guard; all release content remains inert data.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      # Manual reruns are supported on release tags, never branch refs. Peeling
      # both identities supports annotated tags without trusting short stamps.
      - name: Authorize release source
        id: release-source
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EVENT" != push && "$RELEASE_EVENT" != workflow_dispatch ]]; then
            echo '::error::Release requires a tag push or a manual run on a release tag.'
            exit 1
          fi
          core='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          release_ref="^refs/tags/v${core}\.${core}\.${core}(-${identifier}(\.${identifier})*)?$"
          if [[ ! "$RELEASE_REF" =~ $release_ref ]]; then
            echo '::error::Release requires a canonical vMAJOR.MINOR.PATCH tag with an optional SemVer prerelease suffix.'
            exit 1
          fi
          if [[ ! "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Release event source must be a full Git object identity.'
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "${RELEASE_REF}^{commit}")"
          event_commit="$(git rev-parse --verify "${EXPECTED_SOURCE}^{commit}")"
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$tag_commit" != "$event_commit" || "$checkout_commit" != "$event_commit" ]]; then
            echo '::error::Release tag, event source, and checked-out commit must agree.'
            exit 1
          fi
          echo "commit=$event_commit" >> "$GITHUB_OUTPUT"

      - name: Validate final signed artifact ID
        env:
          ARTIFACT_ID: ${{ needs.sign-windows.outputs.signed-artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Expected one positive decimal artifact ID; refusing download-all fallback.'
            exit 1
          fi
      - name: Download immutable final signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.signed-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Validate generated notes artifact ID
        env:
          ARTIFACT_ID: ${{ needs.validate-release.outputs.notes-artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Expected one positive decimal artifact ID; refusing download-all fallback.'
            exit 1
          fi
      - name: Download validated release notes as data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.validate-release.outputs.notes-artifact-id }}
          merge-multiple: true
          path: release-notes

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # System Python in isolated mode cannot import artifact/repository
          # modules or PYTHONPATH hooks. No downloaded code runs with this token.
          python3 -I - <<'PYVERIFY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import stat


          def refuse(message):
              raise SystemExit("Release asset verification failed: " + message)


          def regular_file(file, limit):
              info = file.lstat()
              if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= limit:
                  refuse("expected a bounded regular nonsymlink file")
              return info.st_size


          def bounded_read(file, limit):
              size = regular_file(file, limit)
              with file.open("rb") as stream:
                  data = stream.read(limit + 1)
              if len(data) != size:
                  refuse("file changed or exceeded its bound")
              return data


          tag = os.environ["TAG"]
          core = r"(?:0|[1-9][0-9]*)"
          identifier = r"(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          if not re.fullmatch(rf"v{core}\.{core}\.{core}(?:-{identifier}(?:\.{identifier})*)?", tag):
              refuse("noncanonical release tag")
          expected = {
              f"goobers_{tag}_{target}.{extension}"
              for target, extension in (
                  ("linux_amd64", "tar.gz"), ("linux_arm64", "tar.gz"),
                  ("darwin_amd64", "tar.gz"), ("darwin_arm64", "tar.gz"),
                  ("windows_amd64", "zip"),
              )
          }
          expected.update((f"goobers_portal_{tag}.tar.gz", f"goobers-agent-toolkit_{tag}.zip",
                           f"goobers-onboarding_{tag}.zip", "install.sh",
                           "feature-registry.json", "dsl-support-matrix.json"))
          directory, notes = Path("dist"), Path("release-notes")
          for root in (directory, notes):
              if not stat.S_ISDIR(root.lstat().st_mode):
                  refuse("artifact root must be a nonsymlink directory")
          if {file.name for file in directory.iterdir()} != expected | {"SHA256SUMS", "RELEASE_NOTES.md"}:
              refuse("signed artifact has missing or unexpected assets")
          if {file.name for file in notes.iterdir()} != {"RELEASE_NOTES.md"}:
              refuse("notes artifact must contain only RELEASE_NOTES.md")
          manifest = bounded_read(directory / "SHA256SUMS", 65536).decode("ascii")
          entries = {}
          for line in manifest.splitlines():
              match = re.fullmatch(r"([0-9a-fA-F]{64})  ([A-Za-z0-9_.-]+)", line)
              if not match or match[2] not in expected or match[2] in entries:
                  refuse("malformed, unexpected, or duplicate checksum entry")
              entries[match[2]] = match[1].lower()
          if set(entries) != expected:
              refuse("checksums do not cover the exact release asset set")
          for name in sorted(expected):
              file = directory / name
              size = regular_file(file, 1 << 30)
              digest, consumed = hashlib.sha256(), 0
              with file.open("rb") as stream:
                  while chunk := stream.read(1 << 20):
                      consumed += len(chunk)
                      if consumed > size:
                          refuse("asset grew while verifying")
                      digest.update(chunk)
              if consumed != size or digest.hexdigest() != entries[name]:
                  refuse("asset checksum mismatch")
          # Original notes are part of the signer artifact but aren't checksummed or
          # published. Only the separate validation job's generated notes are attached.
          bounded_read(directory / "RELEASE_NOTES.md", 1 << 20).decode("utf-8")
          bounded_read(notes / "RELEASE_NOTES.md", 1 << 20).decode("utf-8")
          assets = [str(directory / name) for name in sorted(expected)]
          assets.extend((str(directory / "SHA256SUMS"), str(notes / "RELEASE_NOTES.md")))
          Path("publish-assets.txt").write_text("\n".join(assets) + "\n", encoding="utf-8")
          PYVERIFY
          mapfile -t assets < publish-assets.txt
          # Stable tags never contain a literal "-"; a SemVer pre-release
          # suffix always does (v1.2.3-beta.2), so this is enough to tell
          # them apart without re-implementing the full grammar in bash.
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes/RELEASE_NOTES.md "${prerelease[@]}"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-notes/RELEASE_NOTES.md \
              "${prerelease[@]}"
          fi
