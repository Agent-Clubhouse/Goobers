name: Large Repository Scale

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: large-repo-scale
  cancel-in-progress: false

jobs:
  pinned-workspace:
    name: pinned >=10 GiB fixture
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run large-repository gates
        run: make bench-large-repo BENCH_LARGE_REPO_ARGS="-out large-repo-report.json"

      - name: Upload benchmark report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: large-repo-report-${{ github.run_id }}
          path: large-repo-report.json
          if-no-files-found: error
          retention-days: 30
