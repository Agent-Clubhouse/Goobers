name: Large Repository Scale

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: large-repo-scale
  cancel-in-progress: false

jobs:
  pinned-workspace:
    name: pinned >=10 GiB fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download recent benchmark artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p benchmark-history
          if ! run_ids="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=provisioning-benchmark&per_page=6" \
            --jq ".artifacts[] | select(.expired == false and .workflow_run.id != ${GITHUB_RUN_ID}) | .workflow_run.id" 2>/dev/null)"; then
            echo "::warning::Recent benchmark artifacts could not be listed; trend starts without history"
            exit 0
          fi
          count=0
          while IFS= read -r run_id; do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name provisioning-benchmark --dir "benchmark-history/$run_id"; then
              count=$((count + 1))
              if [ "$count" -eq 5 ]; then break; fi
            else
              echo "::warning::Benchmark artifact for run $run_id could not be downloaded"
            fi
          done <<< "$run_ids"

      - name: Run large-repository benchmark
        run: make bench-large-repo BENCH_LARGE_REPO_ARGS="-out benchmark-raw.json"

      - name: Build benchmark report and trend summary
        shell: bash
        run: |
          cpu_model="$(lscpu | awk -F: '/Model name/ {sub(/^[ \t]+/, "", $2); print $2; exit}')"
          logical_cpus="$(getconf _NPROCESSORS_ONLN)"
          memory_kib="$(awk '/MemTotal/ {print $2; exit}' /proc/meminfo)"
          memory_bytes="$((memory_kib * 1024))"
          go run ./test/benchworkcopyreport \
            -current benchmark-raw.json \
            -history benchmark-history \
            -out provisioning-benchmark.json \
            -summary provisioning-benchmark-summary.md \
            -run-id "$GITHUB_RUN_ID" \
            -revision "$GITHUB_SHA" \
            -runner-class "ubuntu-24.04" \
            -runner-name "${{ runner.name }}" \
            -runner-image "${ImageOS:-ubuntu24}" \
            -cpu-model "$cpu_model" \
            -logical-cpus "$logical_cpus" \
            -memory-bytes "$memory_bytes"
          cat provisioning-benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: provisioning-benchmark
          path: |
            provisioning-benchmark.json
            provisioning-benchmark-summary.md
          if-no-files-found: error
          retention-days: 90
