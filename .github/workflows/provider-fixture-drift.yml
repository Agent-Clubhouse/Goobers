name: Provider Fixture Drift

on:
  workflow_dispatch:
  # Enable the schedule only after #1478 provisions the designated repository,
  # issue, pull request, and credential and reconciles the first live candidates.
  # schedule:
  #   - cron: "43 7 * * 1"

permissions:
  contents: read

concurrency:
  group: provider-fixture-drift
  cancel-in-progress: true

jobs:
  provider-fixture-drift:
    name: provider contract and normalized drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify explicit provisioning
        env:
          PROVIDER_FIXTURE_REPOSITORY: ${{ vars.PROVIDER_FIXTURE_REPOSITORY }}
          PROVIDER_FIXTURE_ISSUE: ${{ vars.PROVIDER_FIXTURE_ISSUE }}
          PROVIDER_FIXTURE_PR: ${{ vars.PROVIDER_FIXTURE_PR }}
          PROVIDER_FIXTURE_TOKEN: ${{ secrets.GH_READONLY_VALIDATION_PAT }}
        run: |
          missing=""
          [ -n "$PROVIDER_FIXTURE_REPOSITORY" ] || missing="$missing PROVIDER_FIXTURE_REPOSITORY"
          [ -n "$PROVIDER_FIXTURE_ISSUE" ] || missing="$missing PROVIDER_FIXTURE_ISSUE"
          [ -n "$PROVIDER_FIXTURE_PR" ] || missing="$missing PROVIDER_FIXTURE_PR"
          [ -n "$PROVIDER_FIXTURE_TOKEN" ] || missing="$missing PROVIDER_FIXTURE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Provider fixture refresh is not provisioned::Missing:$missing. Complete #1478 and docs/guides/provider-fixture-drift.md before enabling live calls."
            exit 1
          fi

      - name: Refresh normalized issue candidate
        env:
          GOOBERS_PROVIDER_FIXTURE_TOKEN: ${{ secrets.GH_READONLY_VALIDATION_PAT }}
          PROVIDER_FIXTURE_REPOSITORY: ${{ vars.PROVIDER_FIXTURE_REPOSITORY }}
          PROVIDER_FIXTURE_ISSUE: ${{ vars.PROVIDER_FIXTURE_ISSUE }}
        run: >-
          go run ./test/providerfixtures refresh
          -repository "$PROVIDER_FIXTURE_REPOSITORY"
          -issue "$PROVIDER_FIXTURE_ISSUE"
          -output provider-issue-fixture-candidate.json

      - name: Issue provider contract assertions
        run: >-
          go run ./test/providerfixtures contract
          -fixture provider-issue-fixture-candidate.json

      - name: Normalized issue fixture drift
        run: >-
          go run ./test/providerfixtures drift
          -baseline test/providers/testdata/github_contract.json
          -candidate provider-issue-fixture-candidate.json

      - name: Refresh normalized pull request candidate
        env:
          GOOBERS_PROVIDER_FIXTURE_TOKEN: ${{ secrets.GH_READONLY_VALIDATION_PAT }}
          PROVIDER_FIXTURE_REPOSITORY: ${{ vars.PROVIDER_FIXTURE_REPOSITORY }}
          PROVIDER_FIXTURE_PR: ${{ vars.PROVIDER_FIXTURE_PR }}
        run: >-
          go run ./test/providerfixtures refresh
          -repository "$PROVIDER_FIXTURE_REPOSITORY"
          -pull-request "$PROVIDER_FIXTURE_PR"
          -output provider-pr-fixture-candidate.json

      - name: Pull request provider contract assertions
        run: >-
          go run ./test/providerfixtures contract
          -fixture provider-pr-fixture-candidate.json

      - name: Normalized pull request fixture drift
        run: >-
          go run ./test/providerfixtures drift
          -baseline test/providers/testdata/github_pr_contract.json
          -candidate provider-pr-fixture-candidate.json

      - name: Upload normalized candidates
        if: ${{ !cancelled() && (hashFiles('provider-issue-fixture-candidate.json') != '' || hashFiles('provider-pr-fixture-candidate.json') != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-provider-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            provider-issue-fixture-candidate.json
            provider-pr-fixture-candidate.json
          retention-days: 30
