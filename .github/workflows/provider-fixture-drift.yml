name: Provider Fixture Drift

on:
  workflow_dispatch:
  # Enable the schedule only after #1478 provisions the designated repository,
  # issue, and credential and reconciles the first live candidate.
  # schedule:
  #   - cron: "43 7 * * 1"

permissions:
  contents: read

concurrency:
  group: provider-fixture-drift
  cancel-in-progress: true

jobs:
  provider-fixture-drift:
    name: provider contract and normalized drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify explicit provisioning
        env:
          PROVIDER_FIXTURE_REPOSITORY: ${{ vars.PROVIDER_FIXTURE_REPOSITORY }}
          PROVIDER_FIXTURE_ISSUE: ${{ vars.PROVIDER_FIXTURE_ISSUE }}
          PROVIDER_FIXTURE_TOKEN: ${{ secrets.PROVIDER_FIXTURE_TOKEN }}
        run: |
          missing=""
          [ -n "$PROVIDER_FIXTURE_REPOSITORY" ] || missing="$missing PROVIDER_FIXTURE_REPOSITORY"
          [ -n "$PROVIDER_FIXTURE_ISSUE" ] || missing="$missing PROVIDER_FIXTURE_ISSUE"
          [ -n "$PROVIDER_FIXTURE_TOKEN" ] || missing="$missing PROVIDER_FIXTURE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Provider fixture refresh is not provisioned::Missing:$missing. Complete #1478 and docs/guides/provider-fixture-drift.md before enabling live calls."
            exit 1
          fi

      - name: Refresh normalized candidate
        env:
          GOOBERS_PROVIDER_FIXTURE_TOKEN: ${{ secrets.PROVIDER_FIXTURE_TOKEN }}
          PROVIDER_FIXTURE_REPOSITORY: ${{ vars.PROVIDER_FIXTURE_REPOSITORY }}
          PROVIDER_FIXTURE_ISSUE: ${{ vars.PROVIDER_FIXTURE_ISSUE }}
        run: >-
          go run ./test/providerfixtures refresh
          -repository "$PROVIDER_FIXTURE_REPOSITORY"
          -issue "$PROVIDER_FIXTURE_ISSUE"
          -output provider-fixture-candidate.json

      - name: Provider contract assertions
        run: >-
          go run ./test/providerfixtures contract
          -fixture provider-fixture-candidate.json

      - name: Normalized fixture drift
        run: >-
          go run ./test/providerfixtures drift
          -baseline test/providers/testdata/github_contract.json
          -candidate provider-fixture-candidate.json

      - name: Upload normalized candidate
        if: ${{ !cancelled() && hashFiles('provider-fixture-candidate.json') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: github-provider-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: provider-fixture-candidate.json
          retention-days: 30
