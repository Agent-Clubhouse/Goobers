name: Stress

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to stress
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stress-${{ inputs.pr || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  stress:
    name: race stress
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run enrolled stress packages
        run: make stress

      - name: Upload stress results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stress-results-${{ github.run_id }}
          path: stress-results/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  flake-ledger:
    name: publish flake ledger
    needs: stress
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # A fixed, ref-independent group (unlike the workflow-level group above,
    # which is scoped per-ref/run) — publish targets the same repo-wide
    # GitHub issue tracker regardless of which ref triggered the stress run,
    # so overlapping scheduled publishers racing on the same list-then-create
    # sequence would otherwise both miss a brand-new fingerprint and file
    # duplicate issues for it.
    concurrency:
      group: flake-ledger-publish
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Download stress results
        uses: actions/download-artifact@v8
        with:
          name: stress-results-${{ github.run_id }}
          path: stress-results

      - name: Publish flake issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./test/flakeledger -input stress-results/failures.json
