name: Stress

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to stress
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stress-${{ inputs.pr || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan stress shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Read the enrolled shards
        id: shards
        run: echo "shards=$(go run ./test/stress -list)" >> "$GITHUB_OUTPUT"

  stress:
    name: race stress (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    # Each job runs exactly one shard, so this only has to cover the 30m
    # per-shard `go test -timeout` plus checkout, toolchain, and module setup.
    timeout-minutes: 45
    strategy:
      # A shard that finds a race must not cancel the sibling shards still
      # looking for one; the ledger wants every shard's failures.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run enrolled stress packages
        run: make stress STRESS_SHARD="${{ matrix.shard }}"

      - name: Upload stress results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stress-results-${{ github.run_id }}-${{ matrix.shard }}
          path: stress-results/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  flake-ledger:
    name: publish flake ledger
    needs: stress
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # A fixed, ref-independent group (unlike the workflow-level group above,
    # which is scoped per-ref/run) — publish targets the same repo-wide
    # GitHub issue tracker regardless of which ref triggered the stress run,
    # so overlapping scheduled publishers racing on the same list-then-create
    # sequence would otherwise both miss a brand-new fingerprint and file
    # duplicate issues for it.
    concurrency:
      group: flake-ledger-publish
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Download stress results
        uses: actions/download-artifact@v8
        with:
          pattern: stress-results-${{ github.run_id }}-*
          path: stress-results

      - name: Publish flake issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for report in stress-results/*/failures.json; do
            if [ -f "$report" ]; then
              go run ./test/flakeledger -input "$report"
            fi
          done
