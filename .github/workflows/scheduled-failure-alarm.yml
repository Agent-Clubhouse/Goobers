name: Scheduled failure alarm

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-failure-alarm
  cancel-in-progress: false

jobs:
  alarm:
    name: raise consecutive-failure alarms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout trusted scanner
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: File alarms for red scheduled workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./test/scheduledalarm -threshold 3
