// Only installed on ephemeral Ubuntu CI runners for distro dependencies.
// Keep the runner's Ubuntu suites, components, and Signed-By verification.
// Unrelated preinstalled Chrome/Microsoft feeds must not block these jobs.
Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";
Dir::Etc::sourceparts "-";
// Hosted runners can still be finishing boot-time apt work; wait for the
// dpkg frontend lock instead of failing every bounded retry within seconds.
DPkg::Lock::Timeout "60";
