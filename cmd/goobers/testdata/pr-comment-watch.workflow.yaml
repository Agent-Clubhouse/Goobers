# Reference config artifact for the pr-comment-watch stage (architecture §7).
#
# This is the scheduled workflow that arms the watcher. Its home is a gaggle's
# own config repo (outside this tree); it is captured here as testdata
# because this checkout cannot reach that repo. Drop it into a gaggle's
# workflows/ directory and set spec.gaggle to that gaggle's metadata.name.
apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "2.0"
metadata:
  name: pr-comment-watch
spec:
  gaggle: acme-web            # must match the gaggle's metadata.name
  displayName: PR comment watcher
  # A new human comment on an open goober PR becomes goobers:needs-remediation,
  # which the pr-remediation workflow consumes to update that PR in place.
  triggers:
    - type: schedule
      schedule: "*/10 * * * *"
  readiness:
    maxConcurrentRuns: 1
    maxRunsPerHour: 6         # matches the 10-minute cadence
  start: watch-pr-comments
  tasks:
    - name: watch-pr-comments
      type: deterministic
      goal: Label open goober PRs carrying unaddressed human comments goobers:needs-remediation.
      run:
        command: ["goobers", "pr-comment-watch"]
      inputs:
        resultFile: "comment-watch-result.json"
        maxPullRequests: "20"
        timeout: "120s"
        # #6134: also scan landing (goobers:merge-ready) PRs and, on fresh
        # human feedback, cancel an armed Azure DevOps auto-complete before
        # routing the PR. Prescribes the disarm-landing policy action below.
        blockUnansweredFeedback: "true"
      capabilities:
        - github:issues:write   # the label-issue contract; rebinds to the Gitea cred seam
        - github:pr:write       # Azure DevOps: PR labels, thread reads and the auto-complete cancel
      policyActions:
        - comment-on-issue      # durable routing budget and visible escalation
        - label-issue           # prescribed by commandPolicyActions once the registry entries land
        - disarm-landing        # prescribed by blockUnansweredFeedback: "true"
      # no `next` — single-stage workflow, terminal on success
