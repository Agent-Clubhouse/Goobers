api: {}
apiVersion: goobers.dev/v1alpha1
credentials:
- capability: github:issues:write
  token:
    env: GOOBERS_GITHUB_ISSUES_TOKEN
- capability: github:code-scanning:read
  token:
    env: GOOBERS_GITHUB_TOKEN
- capability: github:dependabot-alerts:read
  token:
    env: GOOBERS_GITHUB_TOKEN
externalTelemetry: {}
kind: Instance
portal:
  brand: {}
  support: {}
  theme: {}
repos:
- name: example-repo
  owner: example-org
  provider: github
  token:
    env: GOOBERS_GITHUB_TOKEN
retention: {}
runConditions:
  maxParallelRuns: 1
runner: {}
telemetry: {}
webhook:
  secret: {}
