# INTENTIONAL LIVE DIVERGENCE:
# The checked-in reference keeps a weekly Monday cadence and
# maxConcurrentRuns=1/maxRunsPerHour=1. Operator-tuned live cadence and
# budget changes are deliberately not mirrored here.
#
# FO-10 (docs/design/static-fan-out-fan-in.md §2/§5.1) — the canonical,
# deliberately minimal driving use case for the static fan-out/fan-in
# primitive: one churn digest, a fixed set of read-only research lenses run
# in parallel, one collate step that deduplicates across them, and a
# terminal nomination that only ever proposes backlog items (never
# goobers:approved — SEC-047 is a human decision). See quality-lead's
# instructions.md "Intentional scope limits" for what this deliberately does
# NOT do (no severity taxonomy, no trend tracking, no typed finding schema,
# no cross-run dedup) — this is an example demonstrating the primitive, not
# a production quality-tracking framework.
apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "2.0"
metadata:
  name: quality-sprint
spec:
  gaggle: goobers
  displayName: Quality sprint
  triggers:
    - type: schedule
      schedule: "0 7 * * 1"
  readiness:
    maxConcurrentRuns: 1
    maxRunsPerHour: 1
  start: churn-analysis
  tasks:
    - name: churn-analysis
      type: deterministic
      goal: Summarize recent code churn so each research lens knows where to focus first.
      run:
        script: |
          set -eu
          top=$(git log --since="${GOOBERS_INPUT_SINCE}" --name-only --pretty=format: \
            | sed '/^$/d' | sort | uniq -c | sort -rn | head -5 \
            | awk '{printf "%s(%s) ", $2, $1}')
          count=$(git log --since="${GOOBERS_INPUT_SINCE}" --name-only --pretty=format: \
            | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
          printf '{"churnedFileCount":%s,"churnSummary":"%s"}\n' "$count" "$top" >"$GOOBERS_INPUT_RESULTFILE"
        workspace: repo
      inputs:
        since: "14 days ago"
        resultFile: "churn-report.json"
      capabilities: []
      requiredCapabilities:
        - os=linux
      expectedOutputs:
        - churnedFileCount
        - churnSummary
      next: focus-areas

    - name: review-security
      type: agentic
      goober: quality-researcher
      goal: Review the repository through a security lens.
      workspace: repo-readonly
      inputs:
        artifactFile: findings.md
      capabilities:
        - agent:model
      expectedOutputs:
        - findingsRef
      next: "@join"

    - name: review-performance
      type: agentic
      goober: quality-researcher
      goal: Review the repository through a performance lens.
      workspace: repo-readonly
      inputs:
        artifactFile: findings.md
      capabilities:
        - agent:model
      expectedOutputs:
        - findingsRef
      next: "@join"

    - name: review-maintainability
      type: agentic
      goober: quality-researcher
      goal: Review the repository through a maintainability lens.
      workspace: repo-readonly
      inputs:
        artifactFile: findings.md
      capabilities:
        - agent:model
      expectedOutputs:
        - findingsRef
      next: "@join"

    - name: review-test-coverage
      type: agentic
      goober: quality-researcher
      goal: Review the repository through a test-coverage lens.
      workspace: repo-readonly
      inputs:
        artifactFile: findings.md
      capabilities:
        - agent:model
      expectedOutputs:
        - findingsRef
      next: "@join"

    - name: review-dependencies
      type: agentic
      goober: quality-researcher
      goal: Review the repository through a dependencies lens.
      workspace: repo-readonly
      inputs:
        artifactFile: findings.md
      capabilities:
        - agent:model
      expectedOutputs:
        - findingsRef
      next: "@join"

    - name: review-latent-bugs
      type: agentic
      goober: quality-researcher
      goal: Review the repository through a latent-bugs lens.
      workspace: repo-readonly
      inputs:
        artifactFile: findings.md
      capabilities:
        - agent:model
      expectedOutputs:
        - findingsRef
      next: "@join"

    - name: collate
      type: agentic
      goober: quality-lead
      goal: Deduplicate and triage every branch report into one unified finding set.
      workspace: repo-readonly
      capabilities:
        - agent:model
      inputs:
        artifactFile: collated-findings.md
      inputsFrom:
        securityFindings: "focus-areas.security.review-security.findingsRef"
        performanceFindings: "focus-areas.performance.review-performance.findingsRef"
        maintainabilityFindings: "focus-areas.maintainability.review-maintainability.findingsRef"
        testCoverageFindings: "focus-areas.testCoverage.review-test-coverage.findingsRef"
        dependenciesFindings: "focus-areas.dependencies.review-dependencies.findingsRef"
        latentBugsFindings: "focus-areas.latentBugs.review-latent-bugs.findingsRef"
      expectedOutputs:
        - collatedFindingsRef
      next: nominate

    - name: nominate
      type: agentic
      goober: nominator
      goal: Propose backlog items from quality-sprint's collated findings and file them.
      capabilities:
        - github:issues:write
        - agent:model
      policyActions:
        - comment-on-issue
        - create-issue
        - label-issue
      inputsFrom:
        candidateFindings: "collatedFindingsRef"
      # Terminal: no `next`. Filed issues land unclaimed (no goobers:approved
      # label) — a maintainer approves before curation can touch them
      # (SEC-047: this is a public repo), exactly like work-nomination's own
      # terminal `nominate` stage.

  parallels:
    - name: focus-areas
      failurePolicy: continue_on_error # one dead lens must not discard the other five
      branchTimeoutSeconds: 2700
      maxConcurrentBranches: 4
      join: collate
      # No `onFailure` — required for fail_fast/all_or_nothing, forbidden
      # for continue_on_error, where collate itself owns the decision via
      # the branch completeness record it receives.
      branches:
        - { name: security, start: review-security }
        - { name: performance, start: review-performance }
        - { name: maintainability, start: review-maintainability }
        - { name: testCoverage, start: review-test-coverage }
        - { name: dependencies, start: review-dependencies }
        - { name: latentBugs, start: review-latent-bugs }
