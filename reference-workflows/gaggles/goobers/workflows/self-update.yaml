apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "2.0"
metadata:
  name: self-update
spec:
  gaggle: goobers
  triggers:
    - type: schedule
      schedule: "13 * * * *"
  readiness:
    maxConcurrentRuns: 1
    maxRunsPerHour: 1
  start: stage-update
  tasks:
    - name: stage-update
      type: deterministic
      goal: Stage and validate a Goobers binary, then request supervised activation.
      run:
        command: ["goobers", "self-update", "--include-prerelease"]
      inputs:
        policy: "on-release"
        owner: "Agent-Clubhouse"
        repository: "Goobers"
        branch: "main"
        resultFile: "self-update-result.json"
      capabilities:
        - contents:read
        - github:issues:write
      policyActions:
        - create-issue
      expectedOutputs:
        - updateRequested
        - policy
        - target
      next: report-cost

    - name: report-cost
      type: deterministic
      goal: Publish cumulative cost on this run's pull request and addressed issues.
      run:
        command: ["goobers", "report-cost"]
        workspace: scratch
      inputs:
        resultFile: "cost-report-result.json"
      capabilities:
        - github:issues:write
