# INTENTIONAL LIVE DIVERGENCE:
# The checked-in reference keeps the daily 06:41 cadence,
# maxConcurrentRuns=1, and maxRunsPerHour=1. Operator-tuned live cadence and
# budget changes are deliberately not mirrored here.
apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "2.0"
metadata:
  name: work-nomination
spec:
  gaggle: goobers
  displayName: Work nomination
  # Producer workflow: on a schedule, gather telemetry/signals, then a
  # nominator files new backlog items (which curation picks up next cycle —
  # the two workflows compose). Once daily, off the hour to avoid clustering
  # with other instances' schedule ticks.
  triggers:
    - type: schedule
      schedule: "41 6 * * *"
  readiness:
    maxConcurrentRuns: 1
    maxRunsPerHour: 1
  start: gather-signals
  tasks:
    - name: gather-signals
      type: deterministic
      goal: Materialize threshold-crossing telemetry findings with journal evidence.
      run:
        command: ["goobers", "telemetry-query", "--window", "24h", "--workflow", "work-nomination", "--aggregate", "stage-failure-rate", "--aggregate", "error-signature", "--aggregate", "gate-noise", "--aggregate", "credit-assignment", "--aggregate", "learning-episode", "--learning-action", "code-issue", "--format", "candidate-findings"]
      inputs:
        resultFile: "candidate-findings.json"
      capabilities:
        - telemetry:read
      expectedOutputs:
        - candidate-findings
      next: nominate
    - name: nominate
      type: agentic
      goober: nominator
      goal: >-
        Propose backlog items from the candidate findings and file them. For
        credit findings, require a matching node in the machine-filtered
        promotionCandidates boundary; never nominate from promotionSignals or
        a correlational fallback. Then require the machine-readable upstream-
        cause check, dedupe by the exact nomination key, and apply the
        governing-target treatment. Treat gate-never-fails as calibration
        evidence: require a recorded expected/actual mismatch before
        describing a behavior defect or requiring a cited run to change.
      capabilities:
        - repo:read
        - telemetry:read
        - github:issues:write
        - agent:model
      policyActions:
        - comment-on-issue
        - create-issue
        - label-issue
      inputs:
        maxNominationsPerRun: "5"
        dedupeWindowDays: "14"
        creditAssignmentMinRuns: "5"
        creditAssignmentMinFailureShare: "0.3"
      # Terminal: no `next`. Filed issues land unclaimed (no goobers:approved
      # label) — a maintainer approves before curation can touch them
      # (SEC-047: this is a public repo).
