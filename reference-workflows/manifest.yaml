apiVersion: goobers.dev/v1alpha1
kind: Manifest
metadata:
  name: goobers-reference-workflows
spec:
  instance:
    name: goobers-reference-workflows
    environment: dev
  # Named, reusable connection. Credentials are always references — never
  # inline tokens (CFG-009, SEC-010). Connections and secretRef are accepted
  # but not yet used to source credentials at any tier (REF012): secretRef.name
  # is a label only. The actual token source is declared per-repo in this
  # instance's instance.yaml (repos[], credentials[], secretStores), never here.
  connections:
    - name: goobers-repo-token
      type: repo
      provider: github
      secretRef:
        name: goobers-repo-token
  # Gaggles included in this instance's desired state. Each must have a
  # Gaggle object under gaggles/<name>/.
  gaggles:
    - goobers
