# Helm values for self-hosted Temporal (DEP-011), chart: temporalio/temporal.
# Persistence is the Azure managed PostgreSQL flexible server provisioned by Bicep;
# the bundled Cassandra/Postgres/Elasticsearch are all disabled. Visibility uses the
# SQL store (basic visibility) — advanced (Elasticsearch) visibility is deferred.
#
# The PostgreSQL `connectAddr` is NOT set here — it is a per-instance infra output (the Bicep
# `postgresFqdn`), injected by the bootstrap pipeline as an Argo Helm parameter
# (`server.config.persistence.datastores.{default,visibility}.sql.connectAddr`) before the Temporal
# Application is synced. The DB password is never stored here either: it is supplied via
# the `temporal-postgres-credentials` secret the pipeline creates from Key Vault (SEC-010).

# Chart 1.x has no bundled datastore subcharts. Persistence points only at the
# externally provisioned PostgreSQL server below.
server:
  replicaCount: 1
  dynamicConfig:
    frontend.workerVersioningWorkflowAPIs:
      - value: true
    system.enableDeploymentVersions:
      - value: true
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            # connectAddr: injected by the bootstrap pipeline as HOST:5432.
            connectProtocol: tcp
            user: gooberadmin
            existingSecret: temporal-postgres-credentials
            tls:
              enabled: true
              enableHostVerification: true
            maxConns: 20
            maxIdleConns: 20
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            # connectAddr: injected by the bootstrap pipeline as HOST:5432.
            connectProtocol: tcp
            user: gooberadmin
            existingSecret: temporal-postgres-credentials
            tls:
              enabled: true
              enableHostVerification: true
            maxConns: 10
            maxIdleConns: 10

# Run temporal-sql-tool as a pre-install/pre-upgrade hook before server pods.
schema:
  useHelmHooks: true

shims:
  dockerize: false
  elasticsearchTool: false

# Web UI; access is fronted by the portal / Entra SSO at the ingress layer (SEC-020).
web:
  enabled: true
  replicaCount: 1
