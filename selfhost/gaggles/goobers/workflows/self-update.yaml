apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "1.4"
metadata:
  name: self-update
spec:
  gaggle: goobers
  displayName: Self-update (validated binary handoff with rollback)
  triggers:
    - type: schedule
      schedule: "13 * * * *"
  readiness:
    maxConcurrentRuns: 1
    maxRunsPerHour: 1
  start: stage-update
  tasks:
    - name: stage-update
      type: deterministic
      goal: >-
        Detect the configured Goobers binary target, stage and validate it, and
        request a supervised drain-and-restart without changing config.
      run:
        command: ["goobers", "self-update"]
      inputs:
        # Tagged releases are the conservative default. Changing this to
        # on-main is an explicit opt-in; manual additionally requires target.
        policy: "on-release"
        owner: "Agent-Clubhouse"
        repository: "Goobers"
        branch: "main"
        healthTicks: "3"
        healthTimeout: "5m"
        resultFile: "self-update-result.json"
      capabilities:
        - contents:read
        - github:issues:write
      policyActions:
        - create-issue
      expectedOutputs:
        - updateRequested
        - policy
        - target
