# INTENTIONAL LIVE DIVERGENCE:
# The checked-in reference keeps the weekly Sunday 05:30 cadence,
# maxConcurrentRuns=1, and maxRunsPerHour=1. Operator-tuned live cadence and
# budget changes are deliberately not mirrored here.
apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "1.4"
metadata:
  name: tutor
spec:
  gaggle: goobers
  displayName: Tutor (self-improvement loop)
  # Schedule producer, same shape as work-nomination.yaml: gather ->
  # (agentic diagnose) -> (agentic draft+commit) -> validate -> push ->
  # open-pr. Instead of filing issues, the Tutor mines this instance's OWN
  # run telemetry for recurring problems (flaky gates, coverage gaps, noisy
  # checks) and opens a PR against this instance's own config — closing the
  # self-improvement loop (epic #36, docs/design/v1/36-tutor-workflow.md).
  #
  # Topology (TUT-A4, design doc §4.3): this is the per-gaggle tier — it
  # owns cross-workflow process learnings (shared skills, workflow-level
  # tests, workflow structure, shared gate calibration) across the whole
  # `goobers` gaggle, not one target workflow's own subtree. The gaggle is
  # already the hard silo (spec.gaggle above; no cross-gaggle tutor exists or
  # is authorized); open-pr's configRoot below is scoped to this gaggle's own
  # config subtree, not the whole (potentially multi-gaggle) instance config.
  tutorScope:
    tier: per-gaggle
  #
  # DOGFOOD GUARDRAIL: weekly, not daily — a self-improvement pass needs a
  # wider telemetry window to find *recurring* (not one-off) problems, and a
  # human reviewing config-changing PRs weekly is a sustainable cadence for
  # this instance's current scale. maxRunsPerHour 1 is redundant at this
  # cadence but kept for consistency with the other shipped workflows'
  # explicit-budget convention.
  triggers:
    - type: schedule
      schedule: "30 5 * * 0"
  readiness:
    maxConcurrentRuns: 1
    maxRunsPerHour: 1
  start: gather-signals
  tasks:
    # Built-in provider-chain style stage: queries the telemetry rollup for
    # cross-run aggregates (T2, #102) and emits the versioned
    # candidate-findings artifact (#148's schema) for the analyst to
    # diagnose. The same typed connector and schema are shared with
    # work-nomination's gather-signals stage.
    - name: gather-signals
      type: deterministic
      goal: Query cross-run telemetry for recurring failure/noise/coverage problems.
      run:
        command: ["goobers", "telemetry-query", "--window", "168h"]
      inputs:
        resultFile: "telemetry-signals.json"
      capabilities:
        - telemetry:read
      next: analyze

    # Agentic diagnosis: resolves the flagged runs' journal evidence
    # read-only (cross-run journal:read, #103) and writes a single
    # prioritized finding + recommended config change as a declared-output
    # artifact for config-author to act on. Never touches the repo's
    # working tree — diagnosis only, same read/no-write shape as the
    # `reviewer` goober in implementation.yaml.
    - name: analyze
      type: agentic
      goober: analyst
      goal: >-
        Diagnose the highest-priority recurring problem from the gathered
        signals using its resolvable journal evidence, and write a single
        finding.md artifact naming the exact config change to propose and
        why (with evidence links).
      capabilities:
        - telemetry:read
        - journal:read
        - agent:model
      expectedOutputs:
        - finding
      next: draft-change

    # Agentic authoring: reads the analyst's finding (via ContextPointers,
    # not a fresh telemetry/journal read of its own — narrowest capability
    # footprint that can still cite the same evidence) and drafts the
    # config change in this run's worktree, committing to the run's branch
    # (push is the separate deterministic push-branch stage below, #237).
    # Never opens the PR itself (open-pr below does). The action-root write
    # boundary (T4/#104, widened by TUT-A5/#1217 to add the skills tree) is
    # enforced structurally by open-pr's confineToActionRoots check below
    # (#223) — this stage's own scope discipline (instructions.md) and
    # CODEOWNERS/branch-protection governance back it up, but the hard
    # backstop is open-pr refusing to open a PR at all if this stage's diff
    # ever escapes its single target root (config OR skills, never both in
    # the same run). A credential that structurally cannot push platform
    # changes in the first place (independent of this check) is #35.
    - name: draft-change
      type: agentic
      goober: config-author
      goal: >-
        Read the analyst's finding, make exactly the config or skill-body
        change it recommends (and nothing else, and never both in the same
        run), and commit to the run's branch.
      capabilities:
        - repo:push
        - agent:model
      policyActions:
        - modify-repository
      expectedOutputs:
        - changed-files
      next: validate-config

    # Validate the drafted selfhost tree, not the running instance's unchanged
    # config copy. Calling the CLI directly lets the executor substitute the
    # running daemon's exact binary rather than relying on PATH.
    - name: validate-config
      type: deterministic
      goal: Validate the drafted config before publishing the run branch.
      run:
        command: ["goobers", "validate", "--source-tree", "selfhost"]
      next: config-valid

    # Deterministic branch push (#237), reached only after config validation.
    - name: push-branch
      type: deterministic
      goal: Push the run's branch to origin.
      run:
        command: ["goobers", "push-branch"]
      capabilities:
        - repo:push
      policyActions:
        - push-repository-branch
      next: open-pr

    - name: open-pr
      type: deterministic
      goal: Open the PR for the run's proposed config change, with evidence links in the body.
      run:
        command: ["goobers", "open-pr"]
      inputs:
        runIdFooter: "true"
        title: "tutor: config improvement"
        resultFile: "pr-result.json"
        # Action-root write-boundary (#104/T4, activated here per #223;
        # widened to skill-body authoring by TUT-A5/#1217): every file this
        # run's branch changed (relative to base) must resolve into the SAME
        # single declared action root, or the cycle aborts closed before the
        # PR opens. Unlike a plain multi-root OR, this also refuses a diff
        # that spans BOTH roots at once — a skill-authoring action must never
        # also rewrite a workflow, and vice versa (§4.2 of
        # docs/design/tutor-redesign.md) — the structural half of "the Tutor
        # authors exactly one target per run" that draft-change's own
        # goober-instructions scope discipline can't guarantee by itself.
        # Supersedes the earlier confineToConfigRoot/configRoot pair (#223):
        # config authoring is now just one of the two action roots, still
        # hard-siloed to this gaggle's own subtree per TUT-A4 rather than the
        # whole selfhost instance config.
        confineToActionRoots: "true"
        actionRoots: "selfhost/gaggles/goobers,skills"
      capabilities:
        - github:pr:write
      policyActions:
        - open-or-update-pr
      expectedOutputs:
        - pull-request-url
        - prNumber
      # Terminal in this workflow: no `next`. The separate merge-review
      # workflow classifies the opened Tutor PR. Persona/gate-tune changes may
      # follow its normal path; structure/skill/validation changes remain
      # CODEOWNER/manual-only and are independently refused by merge-pr.

  gates:
    # A non-zero validate exit becomes a failure ResultEnvelope. Abort rather
    # than publishing an invalid branch; the runner journals this verdict.
    - name: config-valid
      evaluator: automated
      automated:
        check: status-equals
      branches:
        pass: push-branch
        fail: "@abort"
