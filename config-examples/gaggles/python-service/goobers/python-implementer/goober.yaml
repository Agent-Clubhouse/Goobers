apiVersion: goobers.dev/v1alpha1
kind: Goober
metadata:
  name: python-implementer
spec:
  gaggle: python-service
  role: implementer
  displayName: Implementer
  instructions: instructions.md
  harness: copilot
  model: auto
  harnessOptions: {}
  capabilities:
    - repo:push
    - agent:model
  policyActions:
    - modify-repository
  skills:
    - implement
    - run-tests
  tools:
    - shell
  scaleFactor: 1
  workflows:
    - python-implementation
