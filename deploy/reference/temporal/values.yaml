# Reference values for self-hosted OSS Temporal (k8s-infra-shape.md §2:
# Temporal server, Helm release in goobers-temporal; DEP-011). Pinned chart —
# bump deliberately and re-render:
#
#   helm repo add temporal https://go.temporal.io/helm-charts
#   helm install temporal temporal/temporal \
#     --namespace goobers-temporal --create-namespace \
#     --version 1.6.0 -f values.yaml
#
# Persistence is the customer-managed PostgreSQL (§2/§4: managed cloud PG
# recommended — the one stateful service Goobers requires); every bundled
# datastore is disabled. Visibility is basic/SQL — no Elasticsearch (§2).

# Do not deploy bundled datastores (§2: external PG only). Chart 1.x removed
# those subcharts; persistence below points only at the adopter's PostgreSQL.
server:
  # §7: HA optional at first; scale replicas with the chart defaults later.
  replicaCount: 1
  nodeSelector:
    kubernetes.io/os: linux
  # §7 sizing: Temporal shares the 2-4 vCPU / 8-16GB control-plane band; §4:
  # history is bounded per run and projected out to the run journal, so
  # persistence stays modest.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Explicit even though 1.28+ defaults both on: every ladder step records
  # the Worker Deployment API contract it is validating.
  dynamicConfig:
    frontend.workerVersioningWorkflowAPIs:
      - value: true
    system.enableDeploymentVersions:
      - value: true
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: CHANGE-ME.postgres.example.com:5432 # customer-managed PG (§4)
            connectProtocol: tcp
            user: temporal # CHANGE-ME
            existingSecret: temporal-postgres-credentials # CHANGE-ME
            tls:
              enabled: true
              enableHostVerification: true
            maxConns: 20
            maxIdleConns: 20
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: CHANGE-ME.postgres.example.com:5432 # customer-managed PG (§4)
            connectProtocol: tcp
            user: temporal # CHANGE-ME
            existingSecret: temporal-postgres-credentials # CHANGE-ME
            tls:
              enabled: true
              enableHostVerification: true
            maxConns: 10
            maxIdleConns: 10

# The chart's pre-install/pre-upgrade hook runs temporal-sql-tool before server
# pods change. manageSchema above opts both stores into that ordered migration.
schema:
  useHelmHooks: true

shims:
  dockerize: false
  elasticsearchTool: false

# The chart uses the admin-tools placement for its schema setup/update Jobs.
admintools:
  nodeSelector:
    kubernetes.io/os: linux

# Web UI: reachable only through the customer's authed ingress (§3: human
# access via the OIDC issuer; cluster RBAC and Goobers RBAC not conflated).
web:
  enabled: true
  replicaCount: 1
  nodeSelector:
    kubernetes.io/os: linux
