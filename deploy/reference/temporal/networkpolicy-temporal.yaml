# Temporal isolation (k8s-infra-shape.md §5: "Temporal reachable only from
# workers, operator and the scheduling daemon"). Apply alongside the Helm
# release in goobers-temporal; control-plane egress grants live in
# ../goobers-system/networkpolicies.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-frontend-ingress
  namespace: goobers-temporal
spec:
  # The chart labels the frontend pods app.kubernetes.io/name=temporal; scope
  # further with app.kubernetes.io/component=frontend if your chart version
  # sets it.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Only the named control-plane components, not arbitrary pods in
        # goobers-system. The API deployment hosts the scheduling daemon.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: goobers-system
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - operator
                  - worker
                  - api
      ports:
        - protocol: TCP
          port: 7233
