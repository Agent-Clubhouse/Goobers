# HA values for self-hosted OSS Temporal (docs/design/control-plane-ha.md
# §13.5, HA-P3-22). FRESH INSTALL ONLY: numHistoryShards is fixed forever, so
# this cannot be applied to a running cluster that used another value.
#
# Standalone values for chart 1.6.0 (Temporal server 1.31.4), the end state of
# the HA-P2-01 upgrade ladder. It is self-contained rather than layered over
# values.yaml (same chart layout, but the HA install is a fresh one with its own
# datastore settings), and it pins the same validated server and admin-tools
# images as values.yaml:
#
#   helm install temporal temporal/temporal \
#     --namespace goobers-temporal --create-namespace \
#     --version 1.6.0 -f values-ha.yaml
#
# Offline check (CI runs the same render and asserts the result):
#   helm template temporal temporal-1.6.0.tgz -f values-ha.yaml
#
# Per-service replicas, PDBs and spread are chart keys under server.<service>;
# the chart does not add a pod selector to topology spread, so each constraint
# names its component.

# Shared by every service; each also gets the explicit entries below.
shims:
  dockerize: false
  elasticsearchTool: false

schema:
  useHelmHooks: true

admintools:
  image:
    repository: temporalio/admin-tools
    tag: "1.31.4@sha256:c286fe515148587228d692806bc6f7652be5febc384a73dfd16379aed69f7d87"
  nodeSelector:
    kubernetes.io/os: linux

server:
  image:
    repository: temporalio/server
    tag: "1.31.4@sha256:1986d4554cc0da8cf09ddcaa10bc348f22f192972b4c2ec1f768f7307c5892e6"
  nodeSelector:
    kubernetes.io/os: linux
  dynamicConfig:
    frontend.workerVersioningWorkflowAPIs:
      - value: true
    system.enableDeploymentVersions:
      - value: true
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      # Fixed forever. ~1 history process per 500 shards; 512 fits an
      # instance-dedicated cluster. Use 2048 only for one cluster serving many
      # instances. Validate with omes before cutover.
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            connectProtocol: tcp
            tls:
              enabled: true
              enableHostVerification: true
            databaseName: temporal
            connectAddr: CHANGE-ME.postgres.example.com:5432 # direct 5432, never the app PgBouncer
            user: temporal_app # separate role; no grants on goobers_* databases
            existingSecret: temporal-postgres-credentials
            # Every service pod shares these limits, so the worst case is
            # (3+3+3+2 pods) x (12 + 6) = 198 connections. Keep that under 70%
            # of the server's max_connections.
            maxConns: 12
            maxIdleConns: 12
        # SQL advanced visibility on PG. Non-authoritative for Goobers
        # (unknown means fail live), so visibility lag never decides run state.
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            connectProtocol: tcp
            tls:
              enabled: true
              enableHostVerification: true
            databaseName: temporal_visibility
            connectAddr: CHANGE-ME.postgres.example.com:5432
            user: temporal_app
            existingSecret: temporal-postgres-credentials
            maxConns: 6
            maxIdleConns: 6

  frontend:
    replicaCount: 3
    podDisruptionBudget: {maxUnavailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow}
    topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: temporal, app.kubernetes.io/component: frontend}}}
      - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: temporal, app.kubernetes.io/component: frontend}}}
  history:
    replicaCount: 3
    podDisruptionBudget: {maxUnavailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow}
    topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: temporal, app.kubernetes.io/component: history}}}
      - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: temporal, app.kubernetes.io/component: history}}}
  matching:
    replicaCount: 3
    podDisruptionBudget: {maxUnavailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow}
    topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: temporal, app.kubernetes.io/component: matching}}}
      - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: temporal, app.kubernetes.io/component: matching}}}
  worker:
    replicaCount: 2
    podDisruptionBudget: {maxUnavailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow}
    topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: temporal, app.kubernetes.io/component: worker}}}
      - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: temporal, app.kubernetes.io/component: worker}}}

web:
  replicaCount: 2
  podDisruptionBudget: {maxUnavailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow}
  topologySpreadConstraints:
    - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: temporal, app.kubernetes.io/component: web}}}
    - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: temporal, app.kubernetes.io/component: web}}}
