apiVersion: v1
kind: ServiceAccount
metadata:
  name: goobers-apiserver-drift-check
  labels:
    goobers.dev/role: apiserver-drift-check
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: goobers-apiserver-drift-check
  labels:
    goobers.dev/role: apiserver-drift-check
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: goobers-apiserver-drift-check
  labels:
    goobers.dev/role: apiserver-drift-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: goobers-apiserver-drift-check
subjects:
  - kind: ServiceAccount
    name: goobers-apiserver-drift-check
    namespace: goobers-system
