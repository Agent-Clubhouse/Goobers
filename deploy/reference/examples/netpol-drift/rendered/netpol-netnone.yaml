# Rendered by `goobers netpol-render` — do NOT hand-edit (decision 016:
# the rendered output is the only authoritative copy; downstream repos
# consume it, never a hand-maintained parallel copy).
# runner class netnone = restriction set [network:none]
# runners: locked
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    goobers.dev/runner-class-restrictions: network:none
    goobers.dev/runner-class-runners: locked
  name: stage-egress-netnone
spec:
  egress:
  - ports:
    - port: 8080
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: goobers-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: goobers-api
  podSelector:
    matchLabels:
      goobers.dev/role: stage
      goobers.dev/runner-class: netnone
  policyTypes:
  - Egress
