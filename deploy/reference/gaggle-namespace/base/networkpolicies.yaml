# Deny-first networking for a gaggle namespace (k8s-infra-shape.md §5, the
# tier-3 resolution of SEC-Q5):
#   - default: everything denied, both directions;
#   - stage pods: egress ONLY to the git/backlog provider, the model endpoint,
#     the gaggle's sandbox targets, DNS, and the blob endpoint — granted
#     PER RUNNER CLASS by the rendered `goobers netpol-render` manifests, not
#     by this base (delivery decision 004, goobernetes-restrictions.md §6:
#     NetworkPolicy composition is additive — effective egress is the UNION of
#     every policy selecting the pod, so a generic role-wide grant here would
#     make every narrower per-class policy a no-op; the former generic
#     allow-stage-egress policy is removed for exactly that reason);
#   - no pod-to-pod chatter across gaggles (nothing here selects another
#     namespace);
#   - NO INBOUND TO STAGE PODS. EVER. (No Ingress rule exists for them.)
# This base is exactly the class-independent floor: default-deny-all +
# allow-dns. Compose it with the
# per-runner-class output of `goobers netpol-render` (issue #3568), which
# fills the egress CIDRs from instance.yaml egress.allowlist and refuses
# CHANGE-ME placeholders instead of shipping stubs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  # Every pod in the gaggle namespace: no ingress, no egress, unless a more
  # specific policy below opens it.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  # Name resolution for the allowed egress targets (§5).
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
