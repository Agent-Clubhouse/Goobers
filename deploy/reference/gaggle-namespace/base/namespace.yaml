# Gaggle namespace (k8s-infra-shape.md §3): stage pods, sandbox resources,
# and secrets for ONE gaggle live here; the operator provisions/labels these
# from the Gaggle CR (GAG-012). The overlay's `namespace:` field renames this
# object to the gaggle's namespace.
apiVersion: v1
kind: Namespace
metadata:
  # Lowercase for the #3310 reason: metadata.name is an RFC-1123 label.
  name: change-me-gaggle
  labels:
    goobers.dev/gaggle: CHANGE-ME
    # Marks this namespace as a gaggle namespace for cross-namespace
    # NetworkPolicy ingress grants selecting gaggle namespaces generically —
    # internal/runnercap.LabelGaggleNamespace / GaggleNamespaceMarker
    # (#4828): the goobers-system daemon ingress grant for stage pods
    # (../../goobers-system/networkpolicies.yaml) composes this namespace
    # selector with the stage-pod podSelector in one peer, exactly like the
    # per-runner-class egress renderer's blob-endpoint peer does in reverse.
    # Every gaggle namespace MUST carry this label or its stage pods cannot
    # reach the daemon to materialize, journal, or surrender a stage.
    goobers.dev/gaggle-namespace: "true"
    # Stage pods are non-root, capability-dropped, no-privilege workloads.
    pod-security.kubernetes.io/enforce: restricted
