# Target per-gaggle namespace template (k8s-infra-shape.md §3, GAG-012,
# SEC-001/002). The current worker does not derive dispatch namespace or
# ServiceAccount from a Gaggle declaration, so applying this template does not
# enforce per-gaggle isolation; see README.md and #4897.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - networkpolicies.yaml
  - dispatcher-rbac.yaml
