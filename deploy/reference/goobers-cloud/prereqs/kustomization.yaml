apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: goobers-cloud
labels:
  - pairs:
      app.kubernetes.io/part-of: goobers
resources:
  - namespace.yaml
  - priorityclasses.yaml
  - serviceaccounts.yaml
  - configmaps.yaml
  - networkpolicies.yaml
configMapGenerator:
  - name: goobers-cloud-instance
    files:
      - instance.yaml=config/instance.yaml
      - manifest.yaml=config/manifest.yaml
      - gaggle.yaml=config/gaggle.yaml
generatorOptions:
  disableNameSuffixHash: true
