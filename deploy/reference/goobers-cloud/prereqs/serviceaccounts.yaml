# No token is mounted into any of these pods: database access is a secret or
# Entra federated identity, never the Kubernetes API (design §15). The worker
# ServiceAccount (and its stage-namespace Role) is in components/worker-base.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: goobers-control
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: goobers-migrate
automountServiceAccountToken: false
