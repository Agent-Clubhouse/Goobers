# CloudNativePG reference for goobers-cloud (HA-P3-21, design D-6). Kind and
# nightly CHAOS-4 use it; Azure installs use infra/bicep/modules/postgres.bicep.
# Requires the CNPG operator (>= 1.26 for dataDurability) and the Barman Cloud
# plugin. Role password Secrets are created out of band; see README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: goobers-data
resources:
  - namespace.yaml
  - objectstore.yaml
  - cluster.yaml
  - databases.yaml
  - scheduledbackup.yaml
