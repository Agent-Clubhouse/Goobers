# Base backups and WAL archive for the Barman Cloud plugin. The endpoint and
# credentials are placeholders: kind points at an in-cluster S3-compatible store.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: goobers-pg-backup
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://goobers-pg-backup/
    endpointURL: http://object-store.goobers-data.svc:9000 # CHANGE-ME
    s3Credentials:
      accessKeyId:
        name: goobers-pg-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: goobers-pg-backup-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
