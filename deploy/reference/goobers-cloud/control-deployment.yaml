# `control` role (design §14.1, P3): combined api + controller, one pod,
# single-active through the Postgres lease. Never executes stages, so it has no
# harness, workspace, or PVC. State lives in Postgres and object storage.
#
# Recreate, not RollingUpdate: readiness requires holding the lease, so a
# maxUnavailable:0 rollout would deadlock (the new pod cannot become Ready until
# the old one releases it). Recreate plus voluntary lease release on SIGTERM
# gives the 30-60s deploy pause. The P5 hot standby removes it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goobers-control
  labels:
    app.kubernetes.io/name: goobers-control
    app.kubernetes.io/component: control
    goobers.dev/role: control
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: goobers-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goobers-control
        app.kubernetes.io/component: control
        goobers.dev/role: control
    spec:
      serviceAccountName: goobers-control
      automountServiceAccountToken: false
      priorityClassName: goobers-control-plane
      # preStop sleep 5 + SIGTERM lease release (<=5s) + in-flight drain, with
      # margin. Must exceed the preStop sleep.
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      # Fail over off a lost node after 30s instead of the 300s default.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: goobers-control
      containers:
        - name: control
          image: goobers # rewritten by your overlay's images: transformer
          command: ["/usr/local/bin/goobers-cloud"]
          args:
            - control
            - --database-url-file=/var/run/secrets/goobers/database/url
            - --database-direct-url-file=/var/run/secrets/goobers/database/direct-url
            - --database-auth=password
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          lifecycle:
            preStop:
              exec:
                # Distroless image: no /bin/sleep. Removed once the floor is
                # k8s 1.34 and the native sleep action can be used.
                command: ["/usr/local/bin/goobers-cloud", "sleep", "5"]
          # Ready only while this pod holds the lease and the schema is
          # compatible, so the Service routes to the active pod alone.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 2
          # Liveness never checks dependencies (DB, Temporal): a DB blip must
          # not restart the pod. Probe-level grace so a liveness kill does not
          # inherit the 30s pod grace (KEP-2238).
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            failureThreshold: 4
            terminationGracePeriodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Credentials are mounted files, never argv or inline env values.
            - name: database
              mountPath: /var/run/secrets/goobers/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: database
          secret:
            secretName: goobers-cloud-database
            defaultMode: 0440
            items:
              - key: url
                path: url
              - key: direct-url
                path: direct-url
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
