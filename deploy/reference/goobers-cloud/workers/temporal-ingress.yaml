# The Temporal reference admits goobers-system by default. This additive rule
# admits only cloud control and worker pods to the frontend in that namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-cloud-frontend-ingress
  namespace: goobers-temporal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: goobers-cloud
          podSelector:
            matchExpressions:
              - key: goobers.dev/role
                operator: In
                values: [control, worker]
      ports:
        - {protocol: TCP, port: 7233}
