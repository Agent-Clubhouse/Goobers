# Example ingress (k8s-infra-shape.md §5): ONE HTTPS inbound door for API +
# portal + webhook/signal endpoint; TLS via the customer's cert machinery
# (cert-manager or equivalent). No inbound reaches anything else — stage pods
# accept no inbound, ever.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goobers-api
  namespace: goobers-system
  labels:
    app.kubernetes.io/name: goobers-api
    app.kubernetes.io/component: api
  annotations:
    # SSE tuning (§5): the portal event stream is long-lived, so proxy read
    # timeouts must exceed the SSE heartbeat and buffering must be off.
    # Annotations shown for ingress-nginx — CHANGE-ME for your ingress class.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Optional: an edge auth-basic annotation here works transparently with
    # the portal's own /api/* and SSE fetch calls as long as it protects this
    # whole host, not a subset of paths — see "HTTP Basic Auth at the edge"
    # in docs/guides/oidc-authentication.md. It is a network-level gate, not
    # a substitute for api.auth.oidc.
    #
    # #3806: this ingress's single `path: /` rule also republishes /healthz
    # and /readyz externally — the daemon answers both with no credential by
    # design (a kubelet probe cannot present one), but kubelet itself never
    # reaches the daemon through this ingress; it probes podIP directly.
    # There is no cost to excluding these two paths at the edge if your
    # ingress controller supports it (e.g. an ingress-nginx
    # server-snippet/configuration-snippet returning 404 for exactly
    # /healthz and /readyz ahead of this rule) — consider adding one so an
    # unauthenticated caller on the public host cannot use either as a
    # liveness/readiness oracle for the daemon.
spec:
  ingressClassName: CHANGE-ME
  tls:
    - hosts:
        - goobers.example.com # CHANGE-ME
      secretName: goobers-api-tls # CHANGE-ME
  rules:
    - host: goobers.example.com # CHANGE-ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goobers-api
                port:
                  name: http
