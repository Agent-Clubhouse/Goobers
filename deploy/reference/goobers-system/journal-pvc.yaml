# Instance-root storage (k8s-infra-shape.md §4): the same on-disk layout as
# tiers 1-2, including lock files and SQLite databases. Use a ReadWriteOnce
# block volume mounted by a single node; RWX/network storage cannot guarantee
# the cross-client flock and SQLite WAL semantics this state requires.
# Multi-worker content-addressed artifacts belong on the RWX blobs PVC instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goobers-journal
  namespace: goobers-system
  labels:
    app.kubernetes.io/name: goobers-journal
spec:
  accessModes:
    - ReadWriteOnce
  # Lowercase for the #3310 reason: storageClassName is an RFC-1123 subdomain.
  storageClassName: change-me # a block-backed RWO class for your platform
  resources:
    requests:
      storage: 50Gi
