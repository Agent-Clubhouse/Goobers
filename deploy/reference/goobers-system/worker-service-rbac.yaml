# Resolve the daemon's stable Service address for network:none stage host aliases.
# Operators using another endpoint must grant get on its named Service too.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: goobers-service-addresses
  namespace: goobers-system
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["goobers-api"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: goobers-service-addresses
  namespace: goobers-system
subjects:
  - kind: ServiceAccount
    name: goobers-worker
    namespace: goobers-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: goobers-service-addresses
