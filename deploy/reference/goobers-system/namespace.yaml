# Control-plane namespace (k8s-infra-shape.md §3): operator, workers, API live
# here; per-gaggle resources do NOT — see ../gaggle-namespace/.
apiVersion: v1
kind: Namespace
metadata:
  name: goobers-system
  labels:
    # L-124: PSA restricted evaluates runAsNonRoot against Windows pods and
    # rejects them at admission; baseline permits the mixed-OS worker.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
