# Goobers task-queue worker (k8s-infra-shape.md §2: Deployment(s) per
# task-queue, HPA-scalable; one Deployment per queue — copy this file per
# queue, or per gaggle for the G2 dedicated mode, #656).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goobers-worker
  namespace: goobers-system
  labels:
    app.kubernetes.io/name: goobers-worker
    app.kubernetes.io/component: worker
    goobers.dev/role: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goobers-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goobers-worker
        app.kubernetes.io/component: worker
        goobers.dev/role: worker
    spec:
      serviceAccountName: goobers-worker
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Journal volume group ownership so the nonroot worker can append (§4).
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # PSS restricted evaluates initContainers as well as app containers.
      # Seed the per-worker instance root without requiring elevated privileges.
      initContainers:
        - name: seed-instance-root
          image: goobers # rewritten by the kustomization images: transformer
          command: ["sh", "-c"]
          args:
            - mkdir -p /var/lib/goobers/config /var/lib/goobers/runs
          volumeMounts:
            - name: journal
              mountPath: /var/lib/goobers
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          # The shipped image includes the Copilot CLI default agent harness.
          # Set runner.harnessCommand in instance.yaml when selecting another
          # installed harness.
          image: goobers # rewritten by the kustomization images: transformer
          # `goobers worker` is the v2-cloud-scale A1.6 worker entrypoint
          # (#632): it serves the named task queue(s) until SIGTERM, then
          # drains. One task queue per Deployment — set the queue to the one
          # this gaggle/workflow dispatches to (default "goobers-engine").
          #
          # --instance IS REQUIRED TO EXECUTE ANYTHING. Without it the worker
          # wires no executors: it serves workspaces and automated gates, and
          # every real stage fails closed with "not configured". This manifest
          # predates the flag and silently started nothing.
          #
          # --blob-store is required only when a run's stages are served by
          # MORE THAN ONE worker. Stage artifacts are content-addressed into
          # the node-local staging area; without a shared store the first
          # ContextPointer resolved on a different node finds no file and the
          # stage fails closed on an integrity fault. Point it at a
          # ReadWriteMany volume (see the blobs volume below) or omit it and
          # accept single-worker runs.
          #
          # --config-reload-interval is how often the worker re-reads
          # --instance's config/ tree and rebuilds the gaggle, credential, and
          # agentic-kit seams whose config changed (#3912). It defaults to 10s
          # and is left implicit here. Set it to 0 only to deliberately freeze
          # a worker on its boot-time tree. NOTE the reload only sees content
          # that actually changes underneath the mount: a config/ directory
          # seeded once by an initContainer copy into an emptyDir never
          # changes, for the same reason a subPath ConfigMap mount never does
          # (../README.md, "subPath ConfigMap mounts never receive updates").
          # Here the tree lives on the journal PVC, so whatever writes it is
          # what the worker converges on.
          #
          # --config-history-depth is how many SUPERSEDED config trees the
          # worker keeps after a reload, so an in-flight run pinned to one is
          # still served the goober kit it was admitted against (#3884). It
          # defaults to 3 and is left implicit here. An agentic stage whose
          # run.yaml gooberDigest matches no retained tree is REFUSED by name
          # (gate_pin_missing) rather than silently served the current goober;
          # the refusal is retriable, so rolling this worker's tree forward and
          # letting the reload above apply is the repair. Set it to 0 to refuse
          # every superseded pin immediately, or higher if you roll config
          # forward while multi-hour runs are in flight — each retained tree
          # costs one snapshot of instructions and skill files in memory.
          args:
            - "worker"
            - "--task-queue"
            - "goobers-engine"
            - "--work-root"
            - "/var/lib/goobers-worker"
            - "--instance"
            - "/var/lib/goobers"
            - "--blob-store"
            - "/var/lib/goobers-blobs"
            # #4286: enables the dispatcher-backed pod-per-stage seam (mode
            # 3) — without it, the worker serves workspaces/gates but every
            # real stage fails closed with "not configured". Takes a SINGLE
            # namespace: one worker dispatches into one gaggle namespace, not
            # one per gaggle (../gaggle-namespace/examples/ ships more than
            # one — pick the one this Deployment serves, or copy this
            # Deployment per gaggle for G2 dedicated mode, #656). The
            # matching RBAC grant lives in
            # ../gaggle-namespace/base/dispatcher-rbac.yaml, bound to this
            # same goobers-worker ServiceAccount.
            - "--dispatch-namespace"
            - "gaggle-a" # CHANGE-ME: the gaggle namespace this worker dispatches into
          env:
            # Temporal frontend (§2); reachable from workers and operator only
            # (§5 — see ../temporal/networkpolicy-temporal.yaml). The worker
            # reads GOOBERS_TEMPORAL_HOSTPORT (falls back to 127.0.0.1:7233).
            - name: GOOBERS_TEMPORAL_HOSTPORT
              value: temporal-frontend.goobers-temporal:7233
          volumeMounts:
            # Lock-bearing instance root: same on-disk layout as tiers 1-2
            # (§4), on the RWO block volume mounted by a single node.
            - name: journal
              mountPath: /var/lib/goobers
            # Worktrees are pod-private: their PID ownership records are not
            # meaningful across pod process namespaces.
            - name: workspaces
              mountPath: /var/lib/goobers-worker
            # The fleet artifact store. ReadWriteMany because it is the one
            # volume more than one worker touches at once — that is the whole
            # point of it. A content-addressed store never locks (a digest is
            # written once, by rename, and two writers racing on one digest
            # are writing identical bytes), so unlike the journal it is safe
            # on storage classes without dependable POSIX locking (cf. #2854).
            - name: blobs
              mountPath: /var/lib/goobers-blobs
            # Copilot keeps runtime state under $HOME/.copilot. The container
            # root stays read-only; this state lasts for the life of the pod.
            - name: harness-home
              mountPath: /home/nonroot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # §7: agentic stages are memory/IO-lean but long-running; workers
          # bin-pack on a general pool.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: goobers-journal
        - name: workspaces
          emptyDir: {}
        - name: harness-home
          emptyDir: {}
        # ReadWriteMany, because more than one worker mounts it. Provision it
        # with a filesystem your platform can serve RWX (Azure Files, EFS,
        # Filestore, CephFS, NFS). If you only ever run ONE worker, drop this
        # volume, its mount, and the --blob-store flag together — a single
        # worker resolves every ContextPointer from its own staging area.
        - name: blobs
          persistentVolumeClaim:
            claimName: goobers-blobs
