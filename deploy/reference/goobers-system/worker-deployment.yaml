# Goobers task-queue worker (k8s-infra-shape.md §2: Deployment(s) per
# task-queue, HPA-scalable; one Deployment per queue — copy this file per
# queue, or per gaggle for the G2 dedicated mode, #656).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goobers-worker
  namespace: goobers-system
  labels:
    app.kubernetes.io/name: goobers-worker
    app.kubernetes.io/component: worker
    goobers.dev/role: worker
spec:
  replicas: 2
  # HA-P2-07 replaces this with per-build rainbow Deployments. Until then,
  # Recreate avoids mixing builds while still allowing multiple replicas of
  # one build to poll the same queues.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: goobers-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goobers-worker
        app.kubernetes.io/component: worker
        goobers.dev/role: worker
    spec:
      serviceAccountName: goobers-worker
      # Allow the default 30s Temporal drain, 5m child custody settlement, and exit.
      # Increase this when overriding --drain-timeout.
      terminationGracePeriodSeconds: 360
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Pod-private emptyDir ownership for config, workspaces and temp files.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # The shipped image includes the Copilot CLI default agent harness.
          # Set runner.harnessCommand in instance.yaml when selecting another
          # installed harness.
          image: goobers # rewritten by your overlay's images: transformer (#3287)
          # `goobers worker` is the v2-cloud-scale A1.6 worker entrypoint
          # (#632): it serves the named task queue(s) until SIGTERM, then
          # drains. One task queue per Deployment — set the queue to the one
          # this gaggle/workflow dispatches to (default "goobers-engine").
          #
          # --config-endpoint fetches a complete sanitized instance snapshot by
          # content digest before polling. The same signing key configured by
          # the daemon's api.podTokenKeyFile authenticates the worker identity;
          # config repository and provider credentials never enter this pod.
          #
          # --blob-endpoint carries content-addressed artifacts over the
          # authenticated API plane. The API owns the blobs PVC; workers never
          # mount shared storage.
          #
          # --config-reload-interval is how often the worker asks for the
          # current digest and fetches a changed snapshot. It defaults to 10s.
          # A rejected or unavailable snapshot leaves the last-known-good tree
          # in force.
          #
          # --config-history-depth is how many SUPERSEDED config trees the
          # worker keeps after a reload, so an in-flight run pinned to one is
          # still served the goober kit it was admitted against (#3884). It
          # defaults to 3 and is left implicit here. An agentic stage whose
          # run.yaml gooberDigest matches no retained tree is REFUSED by name
          # (gate_pin_missing) rather than silently served the current goober;
          # the refusal is retriable, so rolling this worker's tree forward and
          # letting the reload above apply is the repair. Set it to 0 to refuse
          # every superseded pin immediately, or higher if you roll config
          # forward while multi-hour runs are in flight — each retained tree
          # costs one snapshot of instructions and skill files in memory.
          # Initial config fetches wait through an API restart. The startup
          # probe below suppresses liveness/readiness until the worker opens
          # its health listener.
          args:
            - "worker"
            - "--task-queue"
            - "goobers-engine"
            - "--work-root"
            - "/var/lib/goobers-worker"
            - "--health-addr"
            - ":8081"
            # Long-running dispatch activities hold a slot for the whole stage.
            # Keep the 1 CPU / 2Gi pod bounded instead of inheriting the SDK's
            # 1000-activity process default.
            - "--max-concurrent-activities"
            - "4"
            - "--config-endpoint"
            - "https://goobers-api.goobers-system.svc:8080"
            - "--config-key-file"
            - "/var/run/secrets/goobers/key"
            - "--blob-endpoint"
            - "https://goobers-api.goobers-system.svc:8080"
            - "--daemon-api"
            - "https://goobers-api.goobers-system.svc:8080"
            # #4286: enables the dispatcher-backed pod-per-stage seam (mode
            # 3) — without it, the worker serves workspaces/gates but every
            # real stage fails closed with "not configured". As of #4897,
            # each stage pod is routed to ITS OWN gaggle's
            # spec.isolation.namespace, resolved per attempt — this flag's
            # value no longer selects the pod namespace and is kept only as
            # the non-empty signal that enables mode-3 dispatch. This worker
            # polls EVERY gaggle queue loaded from its config, so it needs
            # the matching RBAC grant
            # (../gaggle-namespace/base/dispatcher-rbac.yaml, bound to this
            # same goobers-worker ServiceAccount) applied in EVERY gaggle
            # namespace it may dispatch into — one gaggle-namespace overlay
            # per declared namespace (see
            # ../gaggle-namespace/examples/gaggle-a and .../gaggle-b). The
            # worker's own boot-time preflight refuses to start if any
            # declared namespace is missing or under-provisioned, naming it.
            - "--dispatch-namespace"
            - "enabled" # CHANGE-ME: any non-empty value; see the flag's own --help for why it no longer names a namespace
          env:
            # Temporal frontend (§2); reachable from workers and operator only
            # (§5 — see ../temporal/networkpolicy-temporal.yaml). The worker
            # reads GOOBERS_TEMPORAL_HOSTPORT (falls back to 127.0.0.1:7233).
            - name: GOOBERS_TEMPORAL_HOSTPORT
              value: temporal-frontend.goobers-temporal:7233
          ports:
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            # Config generations, worktrees and scratch state are pod-private.
            - name: workspaces
              mountPath: /var/lib/goobers-worker
            # CHANGE-ME: provision the same signing key configured by the
            # daemon's api.podTokenKeyFile.
            - name: config-key
              mountPath: /var/run/secrets/goobers
              readOnly: true
            # Copilot keeps runtime state under $HOME/.copilot. The container
            # root stays read-only; this state lasts for the life of the pod.
            - name: harness-home
              mountPath: /home/nonroot
            # Config snapshots, git helpers, and executor staging need temp
            # files even though the container root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # §7: agentic stages are memory/IO-lean but long-running; workers
          # bin-pack on a general pool.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: workspaces
          emptyDir: {}
        - name: config-key
          secret:
            secretName: goobers-pod-token-key
        - name: harness-home
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
