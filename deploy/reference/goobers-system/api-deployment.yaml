# Daemon API + portal (k8s-infra-shape.md §2: /api/v1 read + authed mutation
# surface, portal assets embedded in the goobers binary; SSE through ingress).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goobers-api
  namespace: goobers-system
  labels:
    app.kubernetes.io/name: goobers-api
    app.kubernetes.io/component: api
spec:
  # Disabled until an adopter configures TLS, pod authentication, and exclusive
  # instance ownership. See ../README.md: Mode-3 authority and storage prerequisites.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: goobers-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goobers-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: goobers-api
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: goobers # rewritten by the kustomization images: transformer
          # CHANGE-ME: configure the listener/authentication and separate the worker
          # instance root before enabling this sole journal-owning daemon.
          args: ["up", "/var/lib/goobers"]
          ports:
            - name: http
              containerPort: 8080 # CHANGE-ME to the configured listener port
          # #3806: /healthz and /readyz are bare, unauthenticated routes the
          # daemon registers outside its versioned, credentialed API — a
          # kubelet probe cannot present the pod token or human credential
          # the rest of the API requires (SEC-043/#640), so these two paths
          # are the deliberate, narrowly-scoped exception.
          #
          # CHANGE-ME: scheme MUST track api.tls, same as containerPort above
          # must track api.listen. internal/httpapi/server.go refuses to
          # serve a non-loopback bind without TLS (SEC-043/#640) — so any
          # daemon a kubelet can reach at podIP:8080 is necessarily HTTPS,
          # as required when enabling this base (replicas: 0,
          # CHANGE-ME above): raising replicas without also setting
          # api.listen/api.tls (and this scheme) reproduces the exact
          # CrashLoopBackOff #3806's httpGet probes exist to prevent, just
          # from the probes themselves. kubelet skips certificate
          # verification for HTTPS probes, so the cluster/self-signed cert
          # api.tls points at is sufficient FOR PROBES. Workers and stage pods
          # must separately trust its CA for authenticated API/blob requests.
          #
          # startupProbe alone gates when liveness/readiness probing begins.
          # /readyz's HTTP status (#4252) now reflects "plane-ready" — the
          # listener plus the credential/blob/journal/surrender planes are
          # open — NOT the fuller "crash-resume finished" gate: crash-resume
          # of interrupted runs at daemon start
          # (cmd/goobers/up.go's resumeInterruptedRunsWithRunners) is
          # UNBOUNDED and scales with how many runs were in flight when the
          # prior process stopped, but a pod mid legitimate resume can still
          # answer plane-readiness (and so this startupProbe) almost
          # immediately after api-bind — it does not need to wait out resume
          # first. The failureThreshold below is left generous regardless
          # (a starting point giving up to 10 minutes before kubelet gives up
          # on startup ever completing): a daemon that is merely slow to open
          # its listener — as opposed to one that opened it in seconds, as is
          # now typical — should still get this much grace. CHANGE-ME: raise
          # it if your instance's startup profile makes 10 minutes tight; only
          # once startupProbe succeeds do livenessProbe/readinessProbe start
          # being evaluated at all.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          # readinessProbe reuses /readyz's SAME signal, which is deliberately
          # NOT the same thing /api/v1/health.Ready tells an authenticated
          # caller (#4252): the Service is allowed to route traffic to this
          # pod once it is plane-ready, so an already-running stage's pod can
          # keep reaching the credential/blob/journal/surrender planes for
          # the rest of a long crash-resume, instead of being held out of the
          # Service's endpoint set for that entire (unbounded) window. New
          # dispatch admission (the trigger plane) independently refuses
          # until the daemon is fully scheduler-ready — see
          # httpapi.ReadinessStatus's SchedulerReady field and
          # cmd/goobers/writeplanes.go's daemonTriggerService — so routing
          # here earlier does not let new work start before crash-resume
          # finishes.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # livenessProbe is deliberately decoupled from startup/resume
          # completion (/healthz reports healthy before the scheduler's
          # first tick, regardless of how long that takes) — it exists only
          # to catch a genuinely wedged main loop AFTER the daemon reaches
          # steady state, never a still-legitimately-busy one. The check
          # itself is in-memory only (no disk read on the RWO instance
          # volume), so an explicit timeoutSeconds here is headroom for
          # network/TLS overhead, not for the handler itself.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Same instance-root layout as the worker. This lock-bearing RWO
            # volume must remain single-node mounted.
            - name: journal
              mountPath: /var/lib/goobers
            # #3839: the daemon's SpanSource reads worker-executed agentic
            # stage spans from internal/instance/instance.go's BlobStoreDir()
            # — <instance-root>/blobstore, i.e. /var/lib/goobers/blobstore —
            # which is NOT part of the journal PVC above. Mounting the SAME
            # blobs PVC the worker's --blob-store already writes to
            # (worker-deployment.yaml) here, nested inside the instance root,
            # makes both sides resolve to the same underlying bytes without
            # changing the journal PVC's RWO access mode: this mountPath and
            # the worker's /var/lib/goobers-blobs mountPath are two different
            # paths onto the SAME PVC root. Without this mount a
            # worker-executed stage's span is written correctly but the
            # daemon can never read it, and reports span_unavailable forever.
            - name: blobs
              mountPath: /var/lib/goobers/blobstore
            # Copilot keeps runtime state under $HOME/.copilot. The container
            # root stays read-only; this state lasts for the life of the pod.
            - name: harness-home
              mountPath: /home/nonroot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: goobers-journal
        # Same PVC the worker mounts as /var/lib/goobers-blobs (#3839) — see
        # the blobs volumeMount comment above for why this must be the same
        # claim, not a second one.
        - name: blobs
          persistentVolumeClaim:
            claimName: goobers-blobs
        - name: harness-home
          emptyDir: {}
