# Daemon API + portal (k8s-infra-shape.md §2: /api/v1 read + authed mutation
# surface, portal assets embedded in the goobers binary; SSE through ingress).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goobers-api
  namespace: goobers-system
  labels:
    app.kubernetes.io/name: goobers-api
    app.kubernetes.io/component: api
spec:
  # Disabled in the reference base: the daemon is loopback-only until #652,
  # and running this stub would contend with the worker for the RWO instance.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: goobers-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goobers-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: goobers-api
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: goobers # rewritten by the kustomization images: transformer
          # CHANGE-ME: enable replicas only after #652 provides the in-cluster
          # listener and the deployment no longer runs the lock-owning daemon.
          args: ["up", "/var/lib/goobers"]
          ports:
            - name: http
              containerPort: 8080 # CHANGE-ME to the configured listener port
          # #3806: /healthz and /readyz are bare, unauthenticated routes the
          # daemon registers outside its versioned, credentialed API — a
          # kubelet probe cannot present the pod token or human credential
          # the rest of the API requires (SEC-043/#640), so these two paths
          # are the deliberate, narrowly-scoped exception.
          #
          # startupProbe alone gates when liveness/readiness probing begins:
          # crash-resume of interrupted runs at daemon start
          # (cmd/goobers/up.go's resumeInterruptedRunsWithRunners) is
          # UNBOUNDED and scales with how many runs were in flight when the
          # prior process stopped — a short initialDelaySeconds on
          # livenessProbe would kill the pod mid legitimate resume. The
          # generous failureThreshold below gives resume up to 10 minutes
          # before kubelet gives up on startup ever completing; only then do
          # livenessProbe/readinessProbe start being evaluated at all.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 60
          # readinessProbe reuses /readyz's SAME signal so kubectl rollout
          # status (and the Service's endpoint set) reflect exactly what
          # /api/v1/health.Ready already tells an authenticated caller — the
          # daemon is fully started: config loaded, run state reconciled,
          # crash-resume finished, sweeps running.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # livenessProbe is deliberately decoupled from startup/resume
          # completion (/healthz reports healthy before the scheduler's
          # first tick, regardless of how long that takes) — it exists only
          # to catch a genuinely wedged main loop AFTER the daemon reaches
          # steady state, never a still-legitimately-busy one.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            # Same instance-root layout as the worker. This lock-bearing RWO
            # volume must remain single-node mounted.
            - name: journal
              mountPath: /var/lib/goobers
            # Copilot keeps runtime state under $HOME/.copilot. The container
            # root stays read-only; this state lasts for the life of the pod.
            - name: harness-home
              mountPath: /home/nonroot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: goobers-journal
        - name: harness-home
          emptyDir: {}
