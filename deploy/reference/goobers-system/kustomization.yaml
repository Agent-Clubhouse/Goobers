# goobers-system control plane base (k8s-infra-shape.md §2/§3): operator,
# task-queue worker, daemon API + portal, least-privilege RBAC, and journal
# storage. Reference — the customer applies/adapts (see ../README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: goobers-system

labels:
  - pairs:
      app.kubernetes.io/part-of: goobers

resources:
  - namespace.yaml
  - operator-rbac.yaml
  - operator-deployment.yaml
  - worker-rbac.yaml
  - worker-deployment.yaml
  - worker-windows-deployment.yaml
  - networkpolicies.yaml
  - api-rbac.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-ingress-example.yaml
  - journal-pvc.yaml
  # Drop this (and the worker's --blob-store flag, mount, and volume) if you
  # run a single worker. It exists so a run's stages can be served by more
  # than one.
  - blobs-pvc.yaml

# Image parameterization (§1: a registry the cluster can pull from). Containers
# reference the bare name `goobers`, and this base leaves it bare — no real
# registry is hardcoded anywhere in this tree. A base's job is to be
# transformable: a consumer's own `images:` overlay retargets this name.
#
# #3287: this base used to carry its own `registry.example.com/CHANGE-ME`
# placeholder `images:` transformer here. A remote-base consumer (pinned,
# unforked, so upstream fixes flow) cannot edit the base, and by the time its
# own overlay's `images:` transformer ran, the base's transformer had already
# rewritten every container off the bare name — so the consumer's own
# `- name: goobers` overlay silently matched nothing and did not retarget the
# containers, while the rest of its resources retargeted correctly. See
# ../examples/goobers-system-registry/ for the placeholder pattern, now moved
# out of the base and into an example overlay you copy and edit.
