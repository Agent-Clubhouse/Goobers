# Temporal Worker Controller v1.13.0 Helm values. Install the CRD chart and
# controller chart at v1.13.0; the README pins the commands.
rbac:
  restrictWatchNamespaces:
    - goobers-system
  createEndUserRoles: false

replicas: 2

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Two deprecated versions plus the current version is the three-live-version
# ceiling. A blocked target remains blocked unless the worker pods carry the
# explicit AUTO_UPGRADE compatibility attestation documented in the README.
extraEnv:
  - name: CONTROLLER_MAX_DEPLOYMENT_VERSIONS_INELIGIBLE_FOR_DELETION
    value: "2"

workerResourceTemplate:
  allowedResources:
    - kinds: ["HorizontalPodAutoscaler"]
      apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
    - kinds: ["PodDisruptionBudget"]
      apiGroups: ["policy"]
      resources: ["poddisruptionbudgets"]
