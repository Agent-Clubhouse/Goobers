apiVersion: temporal.io/v1alpha1
kind: WorkerResourceTemplate
metadata:
  name: goobers-worker-pdb
  namespace: goobers-system
spec:
  workerDeploymentRef:
    name: goobers
  template:
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    spec:
      maxUnavailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
      # Temporal Worker Controller injects temporal.io/deployment-name and the
      # exact temporal.io/build-id, yielding one PDB per rainbow version.
      selector:
        matchLabels: {}
