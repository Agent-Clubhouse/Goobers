apiVersion: temporal.io/v1alpha1
kind: WorkerResourceTemplate
metadata:
  name: goobers-worker-pdb
  namespace: goobers-system
  annotations:
    goobers.dev/requires-temporal-worker-controller: v1.13.0
spec:
  workerDeploymentRef:
    name: goobers
  template:
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    spec:
      maxUnavailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
      # Temporal Worker Controller injects temporal.io/deployment-name and the
      # exact temporal.io/build-id, yielding one PDB per rainbow version.
      selector:
        matchLabels: {}
        matchExpressions:
          - key: temporal.io/build-id
            operator: Exists
          - key: temporal.io/deployment-name
            operator: In
            values:
              - goobers
