# The WorkerDeployment below owns one apps/v1 Deployment per build ID.
$patch: delete
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goobers-worker
  namespace: goobers-system
---
# The broad compatibility PDB would overlap every per-build PDB generated by
# WorkerResourceTemplate and can make voluntary disruption impossible.
$patch: delete
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: goobers-worker
  namespace: goobers-system
