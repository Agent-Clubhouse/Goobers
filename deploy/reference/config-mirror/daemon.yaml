apiVersion: apps/v1
kind: Deployment
metadata:
  name: goobers-api
  namespace: goobers-system
spec:
  template:
    spec:
      containers:
        - name: api
          volumeMounts:
            - name: config-mirror
              mountPath: /var/lib/goobers-config-mirror
      volumes:
        - name: config-mirror
          persistentVolumeClaim:
            claimName: goobers-config-mirror
