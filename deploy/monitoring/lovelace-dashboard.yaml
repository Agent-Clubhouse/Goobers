# ======================================================================================
# Goobers gaggle-fleet — Lovelace view  (READ-ONLY telemetry)
# ======================================================================================
# A single sections view for the Goobers agent workforce — a "gaggle fleet" of autonomous
# agents that fly out, run work, and ship it. Requires the sensors + binary_sensor from
# homeassistant.yaml. Strictly display-only — no service calls, buttons, or inputs that
# touch the workforce.
#
# HOW TO USE
#   Settings > Dashboards > + Add dashboard > (open) > pencil > three dots >
#   "Raw configuration editor" > paste the `views:` block. (Or add as a YAML-mode dashboard.)
#
# DESIGN
#   Leans into the gaggle identity — a hero verdict ("the gaggle is flying"), the flock
#   (workflow lanes framed as crew: aloft / perched / building / exploring), and the
#   lifetime "shipped" count as the headline. Theme-native (light + dark): no hardcoded
#   backgrounds or gradients; native gauge / tile / history-graph / markdown plus
#   mushroom-template tiles using only named colors. The scheduler pulse (dead-man) and the
#   needs_human count are the two things meant to read instantly.
#   Dead-man thresholds (0-600 s, green <90, amber 90-300, red 300+) match the exporter,
#   the Grafana dashboard, and the stall alert — keep them in sync.
# ======================================================================================
title: Goobers Fleet
views:
  - title: Fleet
    path: goobers
    type: sections
    icon: mdi:bird
    max_columns: 2
    sections:
      # Hero verdict + the scheduler pulse (the at-a-glance "is the flock alive")
      - type: grid
        cards:
          - type: conditional
            conditions:
              - entity: binary_sensor.goobers_scheduler_stalled
                state: "on"
            card:
              type: markdown
              content: "⚠️ **Scheduler stalled** — no tick in over 5 minutes. The flock has stopped flying."
            grid_options: {columns: full}
          - type: markdown
            grid_options: {columns: full}
            content: >-
              {% set tick = states('sensor.goobers_scheduler_tick_age') %}
              {% if is_state('sensor.goobers_fleet_health','online') %}
              # 🪿 The gaggle is flying
              ### **{{ states('sensor.goobers_runs_completed') }}** shipped · **{{ states('sensor.goobers_active_runs') }}** aloft · pulse **{{ tick }}s** · **{{ states('sensor.goobers_needs_human') }}** waiting on you
              {% elif is_state('sensor.goobers_fleet_health','degraded') %}
              # 🔴 The gaggle is grounded
              ### The daemon is reporting unhealthy — the flock isn't flying.
              {% else %}
              # ⚪ No signal from the gaggle
              ### Monitor offline — exporter or Prometheus unreachable.
              {% endif %}
          - type: gauge
            entity: sensor.goobers_scheduler_tick_age
            name: Scheduler pulse (dead-man)
            unit: s
            min: 0
            max: 600
            severity: {green: 0, yellow: 90, red: 300}
            grid_options: {columns: full}

      # The flock — total aloft + one tile per workflow lane (the crew)
      - type: grid
        cards:
          - type: heading
            heading: The flock
            icon: mdi:bird
          - type: custom:mushroom-template-card
            entity: sensor.goobers_active_runs
            primary: "{% set n = states('sensor.goobers_active_runs')|int(0) %}{{ n ~ (' run aloft' if n==1 else ' runs aloft') }}"
            secondary: "{% set n = states('sensor.goobers_active_runs')|int(0) %}{{ 'the flock is working' if n>0 else 'perched — waiting for work' }}"
            icon: "{{ 'mdi:airplane-takeoff' if states('sensor.goobers_active_runs')|int(0) > 0 else 'mdi:home-roof' }}"
            icon_color: "{{ 'blue' if states('sensor.goobers_active_runs')|int(0) > 0 else 'grey' }}"
            layout: horizontal
            fill_container: true
            tap_action: {action: more-info}
            grid_options: {columns: 12}
          - type: custom:mushroom-template-card
            entity: sensor.goobers_lane_implementation_opus
            primary: Opus
            secondary: "{% set n = states('sensor.goobers_lane_implementation_opus')|int(0) %}{{ ('building · ' ~ n) if n>0 else 'idle' }}"
            icon: mdi:robot
            icon_color: "{{ 'green' if states('sensor.goobers_lane_implementation_opus')|int(0) > 0 else 'grey' }}"
            layout: vertical
            fill_container: true
            tap_action: {action: more-info}
            grid_options: {columns: 4}
          - type: custom:mushroom-template-card
            entity: sensor.goobers_lane_implementation_sol
            primary: Sol
            secondary: "{% set n = states('sensor.goobers_lane_implementation_sol')|int(0) %}{{ ('building · ' ~ n) if n>0 else 'idle' }}"
            icon: mdi:robot
            icon_color: "{{ 'green' if states('sensor.goobers_lane_implementation_sol')|int(0) > 0 else 'grey' }}"
            layout: vertical
            fill_container: true
            tap_action: {action: more-info}
            grid_options: {columns: 4}
          - type: custom:mushroom-template-card
            entity: sensor.goobers_lane_fdm_research
            primary: FDM research
            secondary: "{% set n = states('sensor.goobers_lane_fdm_research')|int(0) %}{{ ('exploring · ' ~ n) if n>0 else 'idle' }}"
            icon: mdi:printer-3d-nozzle
            icon_color: "{{ 'green' if states('sensor.goobers_lane_fdm_research')|int(0) > 0 else 'grey' }}"
            layout: vertical
            fill_container: true
            tap_action: {action: more-info}
            grid_options: {columns: 4}

      # Work in flight — backlog funnel: approved -> claimed -> in_review -> needs_human (red > 0)
      - type: grid
        cards:
          - type: heading
            heading: Work in flight
            icon: mdi:filter-variant
          - type: custom:mushroom-template-card
            entity: sensor.goobers_backlog_approved
            primary: "{{ states('sensor.goobers_backlog_approved') }}"
            secondary: Approved
            icon: mdi:clipboard-check-outline
            icon_color: green
            layout: vertical
            fill_container: true
            tap_action: {action: more-info}
            grid_options: {columns: 3}
          - type: custom:mushroom-template-card
            entity: sensor.goobers_backlog_claimed
            primary: "{{ states('sensor.goobers_backlog_claimed') }}"
            secondary: Claimed
            icon: mdi:hand-back-right-outline
            icon_color: amber
            layout: vertical
            fill_container: true
            tap_action: {action: more-info}
            grid_options: {columns: 3}
          - type: custom:mushroom-template-card
            entity: sensor.goobers_prs_in_review
            primary: "{{ states('sensor.goobers_prs_in_review') }}"
            secondary: In review
            icon: mdi:eye-check
            icon_color: blue
            layout: vertical
            fill_container: true
            tap_action: {action: more-info}
            grid_options: {columns: 3}
          - type: custom:mushroom-template-card
            entity: sensor.goobers_needs_human
            primary: "{{ states('sensor.goobers_needs_human') }}"
            secondary: Needs human
            icon: mdi:account-alert
            icon_color: "{{ 'red' if states('sensor.goobers_needs_human')|int(0) > 0 else 'grey' }}"
            layout: vertical
            fill_container: true
            tap_action: {action: more-info}
            grid_options: {columns: 3}

      # Shipped vs dropped — completed / failed / escalated over 24h
      - type: grid
        cards:
          - type: heading
            heading: Shipped vs dropped (24h)
            icon: mdi:chart-timeline-variant
          - type: history-graph
            hours_to_show: 24
            grid_options: {columns: full}
            entities:
              - entity: sensor.goobers_runs_completed
                name: Shipped
                color: green
              - entity: sensor.goobers_runs_failed
                name: Failed
                color: red
              - entity: sensor.goobers_runs_escalated
                name: Escalated
                color: amber

      # Pull requests
      - type: grid
        cards:
          - type: heading
            heading: Pull requests
            icon: mdi:source-pull
          - type: tile
            entity: sensor.goobers_open_prs
            name: Open PRs
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.goobers_prs_in_review
            name: In review
            grid_options: {columns: 6}
