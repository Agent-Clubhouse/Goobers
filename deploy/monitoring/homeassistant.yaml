# ======================================================================================
# Goobers gaggle-fleet — Home Assistant sensor + alert layer  (READ-ONLY telemetry)
# ======================================================================================
# All data comes from your Prometheus (http://PROMETHEUS_HOST:9090) via
# its JSON query API. NOTHING here can change the workforce — there are no service calls,
# buttons, or inputs that touch Goobers. It is display + notify only.
#
# HOW TO USE
#   Drop this file into a Home Assistant package (recommended):
#     homeassistant:
#       packages: !include_dir_named packages     # then save this as packages/goobers.yaml
#   or paste the rest:/template:/automation: blocks into configuration.yaml.
#   Reload without a restart:  Developer Tools > YAML > "ALL YAML CONFIGURATION"
#   (or call homeassistant.reload_all). The rest: platform hot-reloads; legacy
#   `sensor: platform: rest` would need a full restart, which is why this uses rest:.
#
# ADD A METRIC: copy a rest: block and swap the params.query metric. Multi-series metrics
#   (backlog by status, runs by phase, lanes by workflow) are fetched once and split by
#   label with `selectattr('metric.<label>','eq','<value>')`.
#
# NOTE the entity_id comes from the sensor NAME slug, not unique_id:
#   name "Goobers Needs Human" -> sensor.goobers_needs_human.
#
# ALERTS (bottom of file): the three the exporter recommends — scheduler stalled,
#   needs-human, fleet degraded. Change `notify.YOUR_NOTIFY_TARGET` to your own
#   notify target (or split the automation: section into its own file) for other setups.
# ======================================================================================

rest:
  # ---- daemon health -----------------------------------------------------------------
  - resource: http://PROMETHEUS_HOST:9090/api/v1/query
    scan_interval: 30
    params: {query: "goobers_healthy"}
    sensor:
      - name: "Goobers Fleet Health"
        unique_id: goobers_fleet_health
        value_template: >-
          {{ ('online' if (value_json.data.result[0].value[1] | int(0)) == 1 else 'degraded')
             if value_json.data.result else 'unknown' }}
        icon: mdi:heart-pulse

  - resource: http://PROMETHEUS_HOST:9090/api/v1/query
    scan_interval: 30
    params: {query: "goobers_runs_active"}
    sensor:
      - name: "Goobers Active Runs"
        unique_id: goobers_active_runs
        value_template: "{{ (value_json.data.result[0].value[1] | int(0)) if value_json.data.result else 0 }}"
        unit_of_measurement: runs
        state_class: measurement
        icon: mdi:cog-play

  - resource: http://PROMETHEUS_HOST:9090/api/v1/query
    scan_interval: 30
    params: {query: "goobers_scheduler_last_tick_age_seconds"}
    sensor:
      - name: "Goobers Scheduler Tick Age"
        unique_id: goobers_scheduler_tick_age
        # Missing metric -> 99999 so a dead exporter trips the dead-man, not reads 0 (healthy).
        value_template: "{{ (value_json.data.result[0].value[1] | float(0) | round(0)) if value_json.data.result else 99999 }}"
        unit_of_measurement: s
        state_class: measurement
        icon: mdi:timer-sync-outline

  - resource: http://PROMETHEUS_HOST:9090/api/v1/query
    scan_interval: 30
    params: {query: "goobers_journal_age_seconds"}
    sensor:
      - name: "Goobers Journal Age"
        unique_id: goobers_journal_age
        value_template: "{{ (value_json.data.result[0].value[1] | float(0) | round(0)) if value_json.data.result else 99999 }}"
        unit_of_measurement: s
        state_class: measurement
        icon: mdi:notebook-outline

  - resource: http://PROMETHEUS_HOST:9090/api/v1/query
    scan_interval: 30
    params: {query: "goobers_open_prs"}
    sensor:
      - name: "Goobers Open PRs"
        unique_id: goobers_open_prs
        value_template: "{{ (value_json.data.result[0].value[1] | int(0)) if value_json.data.result else 0 }}"
        unit_of_measurement: PRs
        state_class: measurement
        icon: mdi:source-pull

  # ---- backlog funnel: one query, split by status ------------------------------------
  - resource: http://PROMETHEUS_HOST:9090/api/v1/query
    scan_interval: 60
    params: {query: "goobers_backlog_issues"}
    sensor:
      - name: "Goobers Backlog Approved"
        unique_id: goobers_backlog_approved
        value_template: "{% set m = value_json.data.result | selectattr('metric.status','eq','approved') | list %}{{ (m[0].value[1] | int(0)) if m else 0 }}"
        unit_of_measurement: issues
        state_class: measurement
        icon: mdi:clipboard-check-outline
      - name: "Goobers Backlog Claimed"
        unique_id: goobers_backlog_claimed
        value_template: "{% set m = value_json.data.result | selectattr('metric.status','eq','claimed') | list %}{{ (m[0].value[1] | int(0)) if m else 0 }}"
        unit_of_measurement: issues
        state_class: measurement
        icon: mdi:hand-back-right-outline
      - name: "Goobers PRs In Review"
        unique_id: goobers_prs_in_review
        value_template: "{% set m = value_json.data.result | selectattr('metric.status','eq','in_review') | list %}{{ (m[0].value[1] | int(0)) if m else 0 }}"
        unit_of_measurement: issues
        state_class: measurement
        icon: mdi:eye-check
      - name: "Goobers Needs Human"
        unique_id: goobers_needs_human
        value_template: "{% set m = value_json.data.result | selectattr('metric.status','eq','needs_human') | list %}{{ (m[0].value[1] | int(0)) if m else 0 }}"
        unit_of_measurement: issues
        state_class: measurement
        icon: mdi:account-alert

  # ---- runs by phase: one query, split by phase --------------------------------------
  - resource: http://PROMETHEUS_HOST:9090/api/v1/query
    scan_interval: 30
    params: {query: "goobers_runs_phase"}
    sensor:
      - name: "Goobers Runs Completed"
        unique_id: goobers_runs_completed
        value_template: "{% set m = value_json.data.result | selectattr('metric.phase','eq','completed') | list %}{{ (m[0].value[1] | int(0)) if m else 0 }}"
        unit_of_measurement: runs
        state_class: total
        icon: mdi:check-circle-outline
      - name: "Goobers Runs Failed"
        unique_id: goobers_runs_failed
        value_template: "{% set m = value_json.data.result | selectattr('metric.phase','eq','failed') | list %}{{ (m[0].value[1] | int(0)) if m else 0 }}"
        unit_of_measurement: runs
        state_class: total
        icon: mdi:close-circle-outline
      - name: "Goobers Runs Escalated"
        unique_id: goobers_runs_escalated
        value_template: "{% set m = value_json.data.result | selectattr('metric.phase','eq','escalated') | list %}{{ (m[0].value[1] | int(0)) if m else 0 }}"
        unit_of_measurement: runs
        state_class: total
        icon: mdi:arrow-up-circle-outline

  # ---- active runs per lane: one query, split by workflow ----------------------------
  - resource: http://PROMETHEUS_HOST:9090/api/v1/query
    scan_interval: 30
    params: {query: "goobers_workflow_active_runs"}
    sensor:
      - name: "Goobers Lane Implementation Opus"
        unique_id: goobers_lane_impl_opus
        value_template: "{% set m = value_json.data.result | selectattr('metric.workflow','eq','your-implementation-lane') | list %}{{ (m[0].value[1] | int(0)) if m else 0 }}"
        unit_of_measurement: runs
        state_class: measurement
        icon: mdi:robot-outline
      - name: "Goobers Lane Implementation Sol"
        unique_id: goobers_lane_impl_sol
        value_template: "{% set m = value_json.data.result | selectattr('metric.workflow','eq','your-second-lane') | list %}{{ (m[0].value[1] | int(0)) if m else 0 }}"
        unit_of_measurement: runs
        state_class: measurement
        icon: mdi:robot-outline
      - name: "Goobers Lane FDM Research"
        unique_id: goobers_lane_fdm_research
        value_template: "{% set m = value_json.data.result | selectattr('metric.workflow','eq','your-nightly-workflow') | list %}{{ (m[0].value[1] | int(0)) if m else 0 }}"
        unit_of_measurement: runs
        state_class: measurement
        icon: mdi:printer-3d-nozzle-outline

template:
  - binary_sensor:
      # Dead-man: scheduler hasn't ticked in >5 min, OR the exporter/Prometheus is
      # unreachable (sensor unknown/unavailable) — either way it can't be confirmed alive.
      - name: "Goobers Scheduler Stalled"
        unique_id: goobers_scheduler_stalled
        device_class: problem
        state: >-
          {{ states('sensor.goobers_scheduler_tick_age') in ['unknown', 'unavailable']
             or (states('sensor.goobers_scheduler_tick_age') | float(0) > 300) }}

# ======================================================================================
# Alerts — the three the exporter recommends. Read-only: they only notify.
# Change notify.YOUR_NOTIFY_TARGET to your notify target for other setups.
# ======================================================================================
automation:
  - id: goobers_scheduler_stalled_notify
    alias: "Goobers — scheduler stalled"
    description: "The workforce is wedged: no scheduler tick in >5 min (or exporter down)."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.goobers_scheduler_stalled
        to: "on"
        for: "00:02:00"
    actions:
      - action: notify.YOUR_NOTIFY_TARGET
        data:
          title: "🔴 Goobers scheduler stalled"
          message: "No scheduler tick in {{ states('sensor.goobers_scheduler_tick_age') }} s — the workforce is wedged."
          data:
            push: {interruption-level: time-sensitive}
            tag: goobers_stalled

  - id: goobers_needs_human_notify
    alias: "Goobers — needs human"
    description: "A run is parked for a human (review rejection, or an env/infra issue)."
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.goobers_needs_human
        above: 0
        for: "00:02:00"
    actions:
      - action: notify.YOUR_NOTIFY_TARGET
        data:
          title: "🟠 Goobers needs a human"
          message: "{{ states('sensor.goobers_needs_human') }} run(s) parked for you — check the needs_human queue."
          data:
            tag: goobers_needs_human

  - id: goobers_fleet_degraded_notify
    alias: "Goobers — fleet degraded"
    description: "The daemon reports unhealthy (goobers_healthy == 0)."
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.goobers_fleet_health
        to: "degraded"
        for: "00:02:00"
    actions:
      - action: notify.YOUR_NOTIFY_TARGET
        data:
          title: "🔴 Goobers fleet degraded"
          message: "The Goobers daemon is reporting unhealthy."
          data:
            push: {interruption-level: time-sensitive}
            tag: goobers_degraded
