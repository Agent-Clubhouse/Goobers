# PostgreSQL for Temporal persistence, via CloudNativePG. SPIKE ARTIFACT (#2840).
#
# This is Temporal's history store, NOT the Goobers journal. The journal stays as
# files on the instance PVC — #2051 territory, deliberately out of the ladder.
---
apiVersion: v1
kind: Namespace
metadata:
  name: temporal
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: temporal-pg
  namespace: temporal
spec:
  instances: 1
  # PIN THE OS, and pin it here rather than trusting the default scheduler.
  # CNPG takes node placement under spec.affinity, not the pod template. An
  # unpinned Postgres in a mixed-OS cluster is one reschedule away from Windows
  # initializing its Azure Disk and writing an MBR over the ext4 superblock —
  # observed on this cluster, on the goobers instance volume, 2026-08-12.
  # Temporal's entire history lives here.
  affinity:
    nodeSelector:
      kubernetes.io/os: linux
  # PIN THE MAJOR VERSION. CNPG installs the newest PostgreSQL major when
  # imageName is unset — PG 18 on current CNPG — which is outside Temporal's
  # documented tested set. Silent at install time, interesting later.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  storage:
    size: 10Gi
    storageClass: managed-csi
  bootstrap:
    initdb:
      database: temporal
      owner: temporal
      # Temporal needs TWO databases. CNPG's initdb creates one, and its
      # application user is deliberately NOT a superuser
      # (enableSuperuserAccess defaults false), so Temporal's own
      # createDatabase path cannot make the second one for itself. Create it
      # here during bootstrap, where postInitSQL runs with the privileges to
      # do it.
      postInitSQL:
        - CREATE DATABASE temporal_visibility OWNER temporal;
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
