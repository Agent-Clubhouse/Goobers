# OpenTelemetry Collector — the bridge between Goobers' OTLP push and a
# KQL-queryable sink. SPIKE ARTIFACT.
#
# THIS FILE IS NOW ONLY THE CONFIGMAP. The collector runs as a SIDECAR in the
# goobers pod (see goobers.yaml), because `goobers validate` refuses plaintext
# OTLP to anything but loopback. A collector Deployment behind a Service would
# need TLS; a sidecar shares the pod network namespace and is genuinely
# loopback, so the control is satisfied rather than bypassed.
#
# Goobers already speaks OTLP/gRPC (`telemetry.otlp` in instance.yaml) and
# writes real OTLP JSON per run, so NOTHING in the product changes to make this
# work — this is pure infrastructure. Point telemetry.otlp.endpoint at the
# Service below and spans start flowing.
#
# SINK CHOICE. The exporter is the only part that is sink-specific, and swapping
# it is a few lines:
#   - azuremonitor        -> Application Insights / Log Analytics. KQL, workbooks,
#                            and ~$0 at this volume (inside the 5 GB/mo free tier).
#                            This is what is enabled below.
#   - azuredataexplorer   -> ADX. The reference substrate named in
#                            docs/design/k8s-infra-shape.md §4, with native
#                            OTELTraces/OTELLogs/OTELMetrics tables. Better at
#                            scale, but the cheapest Dev cluster is ~$0.26/hr,
#                            so run it for demo windows and `az kusto cluster stop`
#                            when idle. Commented block at the bottom.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: goobers
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
      # Deployment context the PRODUCT cannot know and therefore never emits:
      # which node, which pod, which namespace, which image. Sourced from the
      # downward API (see the Deployment's env block) rather than from the
      # k8sattributes processor, which would work but needs a ServiceAccount and
      # a ClusterRole over pods/nodes/namespaces — real RBAC for information the
      # kubelet will hand us for free.
      #
      # Names follow OTel resource semantic conventions so they mean the same
      # thing to any backend, not just Application Insights.
      resource:
        attributes:
          - {key: goobers.cluster,     value: aks-goobernetes,   action: upsert}
          - {key: goobers.instance,    value: goobernetes-spike, action: upsert}
          - {key: k8s.node.name,       value: "${env:K8S_NODE_NAME}",  action: upsert}
          - {key: k8s.pod.name,        value: "${env:K8S_POD_NAME}",   action: upsert}
          - {key: k8s.namespace.name,  value: "${env:K8S_NAMESPACE}",  action: upsert}
          - {key: k8s.container.name,  value: daemon,                  action: upsert}
          - {key: container.image.name, value: "${env:GOOBERS_IMAGE}", action: upsert}
          # service.version from the product is the VERSION build-arg ("spike"),
          # which is constant across every build and therefore useless for telling
          # two binaries apart. Carry the commit explicitly until the product emits
          # it — this is exactly the blind spot that hid a phantom rebuild.
          - {key: service.version,     value: "${env:GOOBERS_COMMIT}", action: upsert}
          - {key: goobers.build.commit, value: "${env:GOOBERS_COMMIT}", action: upsert}

      # Host and OS facts, detected rather than declared. `env` honours
      # OTEL_RESOURCE_ATTRIBUTES; `system` supplies host.name/os.type; `aks`
      # supplies cloud.* for the managed cluster.
      resourcedetection:
        detectors: [env, system, aks]
        timeout: 5s
        override: false
        system:
          hostname_sources: [os]

    exporters:
      azuremonitor:
        connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
        # Spans carry goobers.run.id / goobers.gaggle / goobers.workflow as
        # attributes; those land in customDimensions and are queryable in KQL.
        spaneventsenabled: true
      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resourcedetection, resource, batch]
          exporters: [azuremonitor, debug]
        logs:
          receivers: [otlp]
          processors: [resourcedetection, resource, batch]
          exporters: [azuremonitor, debug]
      telemetry:
        logs:
          level: info
