sequences:
- schema: control
  sequence: terminal_report_generation
  provisioned: true
  rationale: Terminal-report admission and supersession draw a never-reused generation with explicit nextval under the controller-lease
    fence.
  usage:
  - goobers_controller
functions:
- schema: control
  function: blob_column_referenced
  arguments: table_name text, column_name text, candidate_digest text
  rationale: SECURITY INVOKER reference probe used by blob_is_referenced; it runs SELECT on the probed column as the caller, so
    the controller holds SELECT on each probed column that exists (config_generation.blob_digest,
    recovery_record.patch_digest and archive_digest, and every child custody digest/reference column from 0012). It returns true for a table that does not exist yet.
  security_definer: false
  execute:
  - goobers_controller
- schema: control
  function: blob_is_referenced
  arguments: candidate_digest text
  rationale: SECURITY INVOKER fail-closed reference check called by the controller's blob GC (config prune, observe, intent,
    forget and complete paths in objstore/metadata.go).
  security_definer: false
  execute:
  - goobers_controller
