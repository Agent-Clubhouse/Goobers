apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "2.0"
metadata:
  name: self-update
  annotations:
    goobers.dev/purpose: "Stages and validates a new Goobers binary and requests a supervised restart so the running instance stays current."
spec:
  gaggle: goobers
  triggers:
    - type: schedule
      schedule: "13 * * * *"
  readiness:
    maxConcurrentRuns: 1
    maxRunsPerHour: 1
  start: stage-update
  tasks:
    - name: stage-update
      type: deterministic
      goal: Stage and validate a Goobers binary, then request supervised activation.
      run:
        command: ["goobers", "self-update", "--include-prerelease"]
      inputs:
        policy: "on-release"
        owner: "Agent-Clubhouse"
        repository: "Goobers"
        branch: "main"
        resultFile: "self-update-result.json"
      capabilities:
        - contents:read
        - github:issues:write
      policyActions:
        - create-issue
      expectedOutputs:
        - updateRequested
        - policy
        - target
