apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "3.0" # Only this pin changes during migration.
metadata:
  name: default-implement
  annotations:
    goobers.dev/allow-preview-features: "true"
spec:
  gaggle: example
  triggers:
    - type: manual
  start: produce
  tasks:
    - name: produce
      type: deterministic
      goal: Produce evidence.
      run: {command: ["true"], workspace: scratch}
      # Advisory names do not identify positions in the artifact array.
      expectedOutputs: [report, trace]
      next: consume
    - name: consume
      type: deterministic
      goal: Read positional evidence.
      run: {command: ["true"], workspace: scratch}
      contextFrom: [produce]
      inputs:
        evidence: "produce.artifact[0]"
        trace: 'produce.artifact[1]'
