apiVersion: goobers.dev/v1alpha1
kind: Workflow
metadata:
  name: work-nomination
spec:
  gaggle: acme-web
  displayName: Work nomination
  # Producer workflow: on a schedule, gather telemetry/signals, then a nominator
  # files new backlog items (which the scheduler can route to other workflows).
  triggers:
    - type: schedule
      schedule: "0 6 * * *"
  readiness:
    maxConcurrentRuns: 1
    maxRunsPerHour: 1
  start: gather-signals
  tasks:
    - name: gather-signals
      type: deterministic
      goal: Materialize threshold-crossing telemetry findings with journal evidence.
      run:
        command: ["goobers", "telemetry-query", "--window", "24h", "--workflow", "work-nomination", "--aggregate", "stage-failure-rate", "--aggregate", "error-signature", "--aggregate", "gate-noise", "--aggregate", "credit-assignment", "--format", "candidate-findings"]
      inputs:
        resultFile: "candidate-findings.json"
      capabilities:
        - telemetry:read
      expectedOutputs:
        - candidate-findings
      next: nominate
    - name: nominate
      type: agentic
      goober: nominator
      goal: >-
        Propose backlog items from the gathered signals and file them. For
        credit findings, require a matching node in the machine-filtered
        promotionCandidates boundary; never nominate from promotionSignals or
        a correlational fallback. Then require the machine-readable upstream-
        cause check, dedupe by the exact nomination key, and apply the
        governing-target treatment.
      capabilities:
        - repo:read
        - telemetry:read
        - github:issues:write
        - agent:model
      policyActions:
        - comment-on-issue
        - create-issue
        - label-issue
      inputs:
        maxNominationsPerRun: "5"
        dedupeWindowDays: "14"
        creditAssignmentMinRuns: "5"
        creditAssignmentMinFailureShare: "0.3"
      # Terminal: no `next`.
