apiVersion: goobers.dev/v1alpha1
kind: Workflow
metadata:
  name: implementation
spec:
  gaggle: acme-web
  displayName: Implementation (with reviewer gate + CI repass loop)
  # Consumer workflow: a routed backlog item drives an implement → test → review
  # → CI-poll pipeline, routing red CI through an integrity-compatible remediation task.
  triggers:
    - type: backlog-item
      trustLabel: goobers:approved
      selector:
        goobers:approved: "true"
        goobers:ready: "true"
  readiness:
    maxConcurrentRuns: 2
    maxRunsPerHour: 20
  start: implement
  tasks:
    - name: implement
      type: agentic
      goober: coder
      minimumIntegrity: maintainer
      contextFrom:
        - implement
        - remediate-ci
        - run-tests
        - review
      goal: Implement the backlog item and open a PR.
      capabilities:
        - repo:push
        - provider:pr:write
        - agent:model
      policyActions:
        - modify-repository
        - open-or-update-pr
      retry:
        maxAttempts: 2
        backoffSeconds: 30
      expectedOutputs:
        - pull-request
      next: run-tests
    - name: remediate-ci
      type: agentic
      goober: coder
      minimumIntegrity: unapproved
      contextFrom:
        - implement
        - remediate-ci
        - run-tests
        - review
        - await-ci
      goal: Remediate failed CI checks from the attached provider evidence.
      capabilities:
        - repo:push
        - provider:pr:write
        - agent:model
      policyActions:
        - modify-repository
        - open-or-update-pr
      retry:
        maxAttempts: 2
        backoffSeconds: 30
      expectedOutputs:
        - pull-request
      next: run-tests
    - name: run-tests
      type: deterministic
      goal: Run the project test suite in the stage worktree.
      run:
        command: ["make", "test"]
      retry:
        maxAttempts: 3
      next: review
    - name: await-ci
      type: deterministic
      goal: Poll the PR's CI checks until they conclude.
      capabilities:
        - provider:pr:write
      run:
        # `command` is a schema-required placeholder: kind=ci-poll dispatches
        # to CIPollExecutor and never shells out (the C+D2 wave's
        # unknown-subcommand admission would rightly reject a real shell-out
        # to "ci-poll", which is not a CLI command).
        command: ["goobers", "ci-poll", "--wait"]
      inputs:
        kind: "ci-poll"
      next: ci-gate
  gates:
    - name: review
      evaluator: agentic
      agentic:
        goober: reviewer
      branches:
        pass: await-ci
        needs-changes: implement
        fail: "@abort"
    - name: ci-gate
      evaluator: automated
      automated:
        check: ci-status
      branches:
        pass: ""
        fail: remediate-ci
        timeout: "@escalate"
