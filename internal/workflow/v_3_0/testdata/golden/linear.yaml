apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "3.0"
metadata:
  name: golden-linear
spec:
  gaggle: golden
  triggers:
    - type: backlog-item
  start: implement
  tasks:
    - name: implement
      type: agentic
      goober: coder
      goal: Implement the item.
      runsOn:
        os: linux
        cpu: 2000m
        memory: 4Gi
        capabilities: [go@1.26, make]
