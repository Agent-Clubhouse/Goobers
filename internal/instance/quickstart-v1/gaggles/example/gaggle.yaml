apiVersion: goobers.dev/v1alpha1
kind: Gaggle
metadata:
  name: example
spec:
  displayName: Quickstart
  ciCommand: ["npm", "run", "ci"]
  project:
    provider: github
    owner: your-org
    name: your-repo
    branch: main
  backlog:
    provider: github
    project: your-org/your-repo
    labels:
      - goobers:approved
      - goobers:ready
  isolation:
    namespace: gaggle-quickstart
