# golangci-lint configuration for the Goobers control plane (schema v2).
# Install: brew install golangci-lint   (or see https://golangci-lint.run/welcome/install)
# Run:     make lint   (or: golangci-lint run)

version: "2"

run:
  # Keep at least 3x the median of the reviewed cross-platform CI samples in
  # test/ci/lint-timing-samples.json; TestLintTimeoutHasMeasuredMargin guards it.
  timeout: 15m
  # Lint the integration-tagged test files too: they are real code CI compiles
  # and runs elsewhere, but untagged lint skipped them and let findings
  # accumulate. The live* tags stay on the preflight vet (test/ci uncoveredBuildTags).
  build-tags:
    - integration
    - cloudintegration
    - cloudpg
    - rollbackcompat

linters:
  enable:
    - errcheck      # unchecked errors
    - govet         # suspicious constructs
    - ineffassign   # ineffective assignments
    - staticcheck   # static analysis suite (incl. simple + stylecheck)
    - unused        # unused code
    - misspell      # common misspellings
    - revive        # golint successor (style)
    - unconvert     # redundant conversions
    - errorlint     # error-wrapping correctness
  settings:
    staticcheck:
      checks:
        - all
    revive:
      rules:
        - name: exported
  exclusions:
    rules:
      # Test files may relax some style rules.
      - path: _test\.go
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/goobers/goobers
