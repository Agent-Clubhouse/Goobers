---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: goobers.goobers.dev
spec:
  group: goobers.dev
  names:
    kind: Goober
    listKind: GooberList
    plural: goobers
    shortNames:
    - gbo
    singular: goober
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Goober is a role-specialized AI worker defined as code.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GooberSpec is the definition of a role-specialized AI worker. It declares
              everything needed to materialize the goober as ephemeral pods when a workflow
              invokes it (GBO-001, GBO-002).
            properties:
              capabilities:
                description: |-
                  Capabilities are the capability grants this goober holds (e.g.
                  "github:issues:write", "repo:push", "telemetry:read"). A stage invoking
                  this goober may only use capabilities in this set; undeclared use fails
                  closed at compile time, and locally the credentials for an ungranted
                  capability are simply never materialized (ARCHITECTURE.md §5, SEC-042).
                items:
                  type: string
                type: array
              conditionalPolicyActions:
                description: |-
                  ConditionalPolicyActions lists persona actions that are prescribed only
                  when an invoking task explicitly declares the action and grants its
                  capability. This supports opt-in authority such as issue self-approval
                  without making it part of every invocation.
                items:
                  type: string
                type: array
              displayName:
                description: DisplayName is the human-facing name shown on the portal
                  dashboard.
                type: string
              gaggle:
                description: Gaggle is the name of the Gaggle this goober belongs
                  to.
                type: string
              harness:
                default: copilot
                description: Harness is the agent harness this goober runs on.
                enum:
                - copilot
                - claude-code
                type: string
              harnessOptions:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  HarnessOptions are harness-specific settings. The platform preserves the
                  map as opaque JSON values and the selected harness adapter validates it.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              instructions:
                description: |-
                  Instructions points at the markdown file defining this goober's
                  behavior/persona/scope, relative to the goober definition directory. The
                  file is markdown with optional YAML frontmatter (see config-as-code docs).
                type: string
              mcpServers:
                description: |-
                  MCPServers are external stdio or remote MCP servers materialized only for
                  this goober's harness invocation.
                items:
                  description: |-
                    MCPServer declares one external MCP server available to this goober. Exactly
                    one of Command (local stdio) or URL (remote HTTP) must be configured.
                  properties:
                    args:
                      description: Args are passed directly to Command without shell
                        interpretation.
                      items:
                        type: string
                      type: array
                    command:
                      description: Command starts a local stdio MCP server.
                      minLength: 1
                      type: string
                    credentialRefs:
                      description: CredentialRefs bind first-party or named BYO credentials
                        to this server.
                      items:
                        description: |-
                          MCPCredentialRef binds either one first-party capability credential or one
                          named BYO credential to an MCP server environment variable or HTTP header.
                          Secret values remain in instance credential configuration and are resolved
                          only for the current invocation.
                        properties:
                          capability:
                            description: Capability is the goober capability whose
                              scoped credential is resolved.
                            minLength: 1
                            type: string
                          env:
                            description: Env names the environment variable exposed
                              to a local stdio server.
                            minLength: 1
                            type: string
                          header:
                            description: Header names the HTTP header sent to a remote
                              server.
                            minLength: 1
                            type: string
                          kind:
                            description: Kind selects a non-capability credential
                              source.
                            enum:
                            - byo
                            type: string
                          ref:
                            description: Ref names the operator-provided BYO credential.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          scheme:
                            description: |-
                              Scheme optionally prefixes a remote header credential with "Bearer " or
                              "Basic ".
                            enum:
                            - bearer
                            - basic
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: set either capability, or kind byo with ref
                          rule: (has(self.capability) && !has(self.kind) && !has(self.ref))
                            || (!has(self.capability) && has(self.kind) && self.kind
                            == 'byo' && has(self.ref))
                        - message: exactly one of env or header must be set, and scheme
                            is only valid with header
                          rule: (has(self.env) && !has(self.header) && !has(self.scheme))
                            || (!has(self.env) && has(self.header))
                      maxItems: 32
                      type: array
                    name:
                      description: Name is the invocation-local MCP server name.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    url:
                      description: URL is an HTTP(S) remote MCP endpoint.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of command or url must be set
                    rule: (has(self.command) && !has(self.url)) || (!has(self.command)
                      && has(self.url))
                  - message: args are only valid with command
                    rule: has(self.command) || !has(self.args)
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              model:
                description: |-
                  Model selects the harness model. Values are scoped to Harness and
                  validated by its adapter before a run starts.
                type: string
              policyActions:
                description: |-
                  PolicyActions is the closed vocabulary of externally mutating actions
                  this goober's persona unconditionally prescribes. Every agentic task that
                  invokes the goober must redeclare these actions and their capabilities.
                items:
                  type: string
                type: array
              role:
                description: Role is the goober's role, e.g. "coder", "perf-hunter",
                  "reviewer".
                type: string
              scaleFactor:
                default: 1
                description: |-
                  ScaleFactor is the desired replica count for concurrent work. Increasing it
                  and redeploying yields more concurrent replicas, which claim work so no two
                  process the same item (GBO-030/GBO-031).
                format: int32
                minimum: 1
                type: integer
              skills:
                description: Skills are the named skills available to this goober.
                items:
                  type: string
                type: array
              timeoutSeconds:
                description: |-
                  TimeoutSeconds is the default per-attempt wall-clock bound for this
                  goober's agentic stages, overriding the harness's built-in 30m default
                  (internal/harness.DefaultTimeout). A stage's own Task.TimeoutSeconds, when
                  set, takes precedence over this — precedence is task > goober > built-in
                  default. Unset preserves the built-in default. Raise it for a goober that
                  does large work (a bigger implementation task legitimately exceeding 30m)
                  without annotating every stage that invokes it; leave it unset for
                  goobers whose work fits the default.
                format: int32
                minimum: 1
                type: integer
              tools:
                description: |-
                  Tools is the per-goober tool allowlist (default-deny). Only listed MCP
                  servers/tools are reachable from a run (GBO-Q2/SEC-Q4).
                items:
                  type: string
                type: array
              workflows:
                description: |-
                  Workflows are the names of the workflow(s) that invoke this goober. A
                  goober may be referenced by multiple workflows (GBO-Q4); the per-task
                  invocation envelope differentiates behavior.
                items:
                  type: string
                type: array
            required:
            - gaggle
            - instructions
            - role
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
