---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: gaggles.goobers.dev
spec:
  group: goobers.dev
  names:
    kind: Gaggle
    listKind: GaggleList
    plural: gaggles
    shortNames:
    - gag
    singular: gaggle
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.gooberCount
      name: Goobers
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Gaggle is a siloed workforce of goobers within an instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GaggleSpec defines a siloed workforce within an instance. A gaggle targets one
              project codebase and exactly one backlog (singleton), and contains its own
              goobers and workflows (which reference it by name). Isolation is realized as a
              namespace + identity per gaggle (GAG-001..006, SEC-001/002).
            properties:
              additionalRepos:
                description: |-
                  AdditionalRepos are optional extra repos a less-standard gaggle may target;
                  the backlog and infra/config repos always remain singletons (GAG-007).
                items:
                  description: |-
                    RepoRef points at a git repository through a provider connection. Auth is a
                    SecretRef — never an inline token.
                  properties:
                    baseUrl:
                      description: |-
                        BaseURL is the forge root URL (e.g. https://gitea.example.com). It is
                        required when provider=gitea (self-hosted Gitea has no fixed host) and
                        omitted for github/ado.
                      type: string
                    branch:
                      default: main
                      description: Branch is the default branch goober runs check
                        out and target.
                      type: string
                    checkout:
                      description: |-
                        Checkout narrows how much of the repository run workspaces materialize
                        (B2, #649): the local runner provisions a cone-mode sparse checkout
                        (git sparse-checkout set --cone) instead of the full tree. Nil (the
                        default) is a full checkout.
                      properties:
                        sparse:
                          description: |-
                            Sparse lists repo-relative path cones a sparse checkout materializes;
                            paths outside every cone are absent from run workspaces, except
                            root-level files (cone-mode semantics). Required non-empty when
                            Checkout is declared at all.
                          items:
                            type: string
                          type: array
                      type: object
                    connectionRef:
                      description: |-
                        ConnectionRef names the connection (and thus credentials) used to reach
                        this repo. It resolves to a Connection declared in the Manifest.
                      type: string
                    name:
                      description: Name of the repository.
                      type: string
                    owner:
                      description: Owner/organization (GitHub org/user or Azure DevOps
                        organization).
                      type: string
                    project:
                      description: Project is the Azure DevOps project. It is omitted
                        for GitHub.
                      type: string
                    provider:
                      description: |-
                        Provider identifies a backing system vendor. v1 abstracts repo + backlog over
                        both GitHub and Azure DevOps (ADO) from the start (see VISION §8 "v1 providers").
                      enum:
                      - github
                      - ado
                      - gitea
                      type: string
                  required:
                  - name
                  - owner
                  - provider
                  type: object
                type: array
              backlog:
                description: Backlog is the singleton source of work-item truth for
                  this gaggle.
                properties:
                  baseUrl:
                    description: |-
                      BaseURL is the forge root URL (e.g. https://gitea.example.com). It is
                      required when provider=gitea (self-hosted Gitea has no fixed host) and
                      omitted for github/ado.
                    type: string
                  connectionRef:
                    description: ConnectionRef names the connection (credentials)
                      used to reach the backlog.
                    type: string
                  fieldPredicate:
                    description: |-
                      FieldPredicate is a CEL expression over the provider's typed native-field
                      projection. It is ANDed with Labels and fails when a referenced field is
                      unavailable.
                    minLength: 1
                    type: string
                  labelPredicate:
                    description: |-
                      LabelPredicate is a CEL expression over the item's label set. The only
                      supported operations are string membership in `labels` and boolean
                      composition with &&, ||, and !. It is ANDed with Labels.
                    minLength: 1
                    type: string
                  labels:
                    description: |-
                      Query/labels narrow which items this gaggle considers work. Routing of an
                      item to a specific workflow is handled by workflow selectors (SCH-010).
                    items:
                      type: string
                    type: array
                  project:
                    description: Project scopes the backlog (GitHub repo "owner/name"
                      or ADO project).
                    type: string
                  provider:
                    description: |-
                      Provider identifies a backing system vendor. v1 abstracts repo + backlog over
                      both GitHub and Azure DevOps (ADO) from the start (see VISION §8 "v1 providers").
                    enum:
                    - github
                    - ado
                    - gitea
                    type: string
                required:
                - project
                - provider
                type: object
              branchNamespace:
                description: |-
                  BranchNamespace is the refs/heads/ root this gaggle's run branches live
                  under — providers.BranchName produces "<branchNamespace><workflow>/<run>".
                  Empty defaults to providers.DefaultBranchNamespace ("goobers/"). It is the
                  single value three consumers derive from so they cannot drift (#965/#1010):
                  the run branch the worktree pushes, the mirror-fetch exclusion that
                  preserves that branch across a run's stages, and the PR-selector headPrefix
                  defaults. Retuning it lets one instance host gaggles that keep their run
                  branches in distinct namespaces; a value with no trailing "/" is treated as
                  if it had one. Most gaggles omit it and share the default.
                type: string
              ciCommand:
                description: |-
                  CICommand is the local CI-equivalent command (build + lint + tests) this
                  gaggle's deterministic `local-ci` stage runs in place of the command that
                  stage declares (the Go default `["make","ci"]`), so a foreign, non-Go
                  gaggle can gate its PRs on its own stack's suite (e.g.
                  `["npm","run","ci"]`, `["dotnet","test"]`) without rewriting the shared
                  workflow template (MGV-1/#1009, docs/design/v1/multi-gaggle-validation.md
                  §G2). Empty leaves the `local-ci` stage's declared command untouched, so a
                  single Go gaggle behaves exactly as before. A non-zero exit fails the gate
                  exactly as `make ci` does today, and a bad command only ever fails this
                  gaggle's own PRs — never another gaggle's.
                items:
                  type: string
                type: array
              displayName:
                description: DisplayName is the human-facing name shown on the portal
                  dashboard.
                type: string
              isolation:
                description: Isolation declares the per-gaggle boundary (namespace
                  + workload identity).
                properties:
                  identityRef:
                    description: |-
                      IdentityRef names the per-gaggle Azure workload identity (managed-identity
                      federation) used to reach Key Vault, providers, and telemetry.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the k8s namespace this gaggle's pods/secrets live in. Must be
                      unique per gaggle so credentials/work/telemetry do not leak across gaggles.
                    type: string
                required:
                - namespace
                type: object
              outboxMirrorPath:
                description: |-
                  OutboxMirrorPath is the default local filesystem root where workflows in
                  this gaggle mirror their durable journal outbox. A workflow or task may
                  override it. The local runner appends the run id and journal outbox layout
                  beneath this root; the journal remains the source of truth.
                minLength: 1
                type: string
              project:
                description: Project is the codebase this gaggle works on.
                properties:
                  baseUrl:
                    description: |-
                      BaseURL is the forge root URL (e.g. https://gitea.example.com). It is
                      required when provider=gitea (self-hosted Gitea has no fixed host) and
                      omitted for github/ado.
                    type: string
                  branch:
                    default: main
                    description: Branch is the default branch goober runs check out
                      and target.
                    type: string
                  checkout:
                    description: |-
                      Checkout narrows how much of the repository run workspaces materialize
                      (B2, #649): the local runner provisions a cone-mode sparse checkout
                      (git sparse-checkout set --cone) instead of the full tree. Nil (the
                      default) is a full checkout.
                    properties:
                      sparse:
                        description: |-
                          Sparse lists repo-relative path cones a sparse checkout materializes;
                          paths outside every cone are absent from run workspaces, except
                          root-level files (cone-mode semantics). Required non-empty when
                          Checkout is declared at all.
                        items:
                          type: string
                        type: array
                    type: object
                  connectionRef:
                    description: |-
                      ConnectionRef names the connection (and thus credentials) used to reach
                      this repo. It resolves to a Connection declared in the Manifest.
                    type: string
                  name:
                    description: Name of the repository.
                    type: string
                  owner:
                    description: Owner/organization (GitHub org/user or Azure DevOps
                      organization).
                    type: string
                  project:
                    description: Project is the Azure DevOps project. It is omitted
                      for GitHub.
                    type: string
                  provider:
                    description: |-
                      Provider identifies a backing system vendor. v1 abstracts repo + backlog over
                      both GitHub and Azure DevOps (ADO) from the start (see VISION §8 "v1 providers").
                    enum:
                    - github
                    - ado
                    - gitea
                    type: string
                required:
                - name
                - owner
                - provider
                type: object
              requireLabels:
                description: |-
                  RequireLabels is the default `requireLabels` value every workflow's
                  `backlog-query` task in this gaggle inherits, mirroring
                  BranchNamespace's gaggle-default/per-task-override shape (MIRC-2,
                  #1901, docs/design/v1/multi-instance-repo-coordination.md). A task that
                  declares its own `requireLabels` input fully replaces this default for
                  that task, exactly as a task's `headPrefix` replaces the gaggle's
                  BranchNamespace — never merged. Empty leaves every task's own
                  `requireLabels` (or its absence) untouched, so a gaggle that omits this
                  behaves exactly as before.
                items:
                  type: string
                type: array
              requiredCapabilities:
                description: |-
                  RequiredCapabilities are the runner (toolchain/platform) capabilities every
                  run of this gaggle needs on the runner it executes on — e.g. `dotnet@8`,
                  `xcode`, `os=windows` (RRQ-1/#1101,
                  docs/design/v1/polyglot-stacks.md §5). These are NOT the credential grants
                  a Task declares (`internal/capability`, `repo:push` &c.): they are
                  free-form, version-parameterized claims a runner advertises statically
                  (instance.yaml `runner.capabilities`). The scheduler fails a run to
                  schedule — with a diagnostic naming the missing capability — when the
                  runner does not claim every entry here; a runner that falsely claims one it
                  lacks degrades to a runtime error, which the scheduler does not prevent.
                  Empty imposes no requirement, so an instance that declares none schedules
                  exactly as today.
                items:
                  type: string
                type: array
              runControls:
                description: |-
                  RunControls overrides instance run-control defaults for every workflow in
                  this gaggle. A workflow may override either value again.
                properties:
                  maxRepasses:
                    description: |-
                      MaxRepasses bounds how many times gates may route a run back to the same
                      already-completed stage before escalation, regardless of gate or outcome.
                    format: int32
                    minimum: 1
                    type: integer
                  maxRunDuration:
                    description: |-
                      MaxRunDuration is the maximum total wall-clock age of a run. Empty
                      disables the total-duration limit. It uses Go duration syntax.
                    minLength: 1
                    type: string
                  stalledRunTimeout:
                    description: |-
                      StalledRunTimeout is the maximum period a running journal may remain
                      silent before the watchdog escalates it. It uses Go duration syntax.
                    minLength: 1
                    type: string
                type: object
              sandbox:
                description: |-
                  Sandbox overrides the instance-wide isolation posture for this gaggle's
                  agentic stages (#1305). Effective posture is gaggle override, else the
                  instance.yaml sandbox block, else disabled — sandboxing is strictly
                  opt-in, so a gaggle that omits this behaves exactly as before.
                properties:
                  agentic:
                    description: |-
                      Agentic is the posture for agentic stages: "disabled" or "enforced".
                      Empty inherits the instance-wide posture.
                    enum:
                    - disabled
                    - enforced
                    type: string
                type: object
              selfIdentity:
                description: |-
                  SelfIdentity is this gaggle's provider login for assignment-aware backlog
                  operations. Empty inherits the instance-wide selfIdentity default.
                minLength: 1
                type: string
              siblings:
                description: |-
                  Siblings declares other gaggles/instances this gaggle knows are
                  independently working the same target repo (MIRC-2, #1901). Each
                  sibling is identified by the repo it targets — never by gaggle/instance
                  name, which is purely local bookkeeping and carries zero cross-instance
                  meaning (docs/design/v1/multi-instance-repo-coordination.md, amended by
                  #1908). `goobers validate`/`goobers lint` warns (non-fatal) when a
                  declared sibling targets the same repo as this gaggle's own Project and
                  its declared RequireLabels are not disjoint from this gaggle's own
                  effective requireLabels (gaggle default, or a workflow's own override)
                  — the likely-dominant misconfiguration case for independently-
                  configured teams sharing one repo. A sibling targeting a different repo
                  never triggers a warning, regardless of label similarity. Declaring no
                  siblings is a no-op — purely additive, opt-in config.
                items:
                  description: |-
                    GaggleSibling declares another gaggle/instance this gaggle knows is
                    independently working the same target repo, for MIRC-2's sibling-overlap
                    validation warning. This instance cannot read the sibling's live config, so
                    RequireLabels is this gaggle's own trusted declaration of what the sibling
                    currently uses — not something validated against the sibling itself.
                  properties:
                    label:
                      description: |-
                        Label is a human-readable name for the sibling, used only in warning
                        messages (e.g. "Billing team") — never a match key.
                      type: string
                    project:
                      description: |-
                        Project is the repo the sibling gaggle targets — the sole match key
                        (provider/owner/name; Project is ADO-only, same as RepoRef). Gaggle
                        name is deliberately not part of this type: two instances naming a
                        gaggle the same string is coincidence with zero shared meaning.
                      properties:
                        baseUrl:
                          description: |-
                            BaseURL is the forge root URL (e.g. https://gitea.example.com). It is
                            required when provider=gitea (self-hosted Gitea has no fixed host) and
                            omitted for github/ado.
                          type: string
                        branch:
                          default: main
                          description: Branch is the default branch goober runs check
                            out and target.
                          type: string
                        checkout:
                          description: |-
                            Checkout narrows how much of the repository run workspaces materialize
                            (B2, #649): the local runner provisions a cone-mode sparse checkout
                            (git sparse-checkout set --cone) instead of the full tree. Nil (the
                            default) is a full checkout.
                          properties:
                            sparse:
                              description: |-
                                Sparse lists repo-relative path cones a sparse checkout materializes;
                                paths outside every cone are absent from run workspaces, except
                                root-level files (cone-mode semantics). Required non-empty when
                                Checkout is declared at all.
                              items:
                                type: string
                              type: array
                          type: object
                        connectionRef:
                          description: |-
                            ConnectionRef names the connection (and thus credentials) used to reach
                            this repo. It resolves to a Connection declared in the Manifest.
                          type: string
                        name:
                          description: Name of the repository.
                          type: string
                        owner:
                          description: Owner/organization (GitHub org/user or Azure
                            DevOps organization).
                          type: string
                        project:
                          description: Project is the Azure DevOps project. It is
                            omitted for GitHub.
                          type: string
                        provider:
                          description: |-
                            Provider identifies a backing system vendor. v1 abstracts repo + backlog over
                            both GitHub and Azure DevOps (ADO) from the start (see VISION §8 "v1 providers").
                          enum:
                          - github
                          - ado
                          - gitea
                          type: string
                      required:
                      - name
                      - owner
                      - provider
                      type: object
                    requireLabels:
                      description: |-
                        RequireLabels is this gaggle's own declaration of the sibling's
                        effective required-label scope, compared against this gaggle's own
                        effective requireLabels for overlap when Project matches.
                      items:
                        type: string
                      type: array
                  required:
                  - project
                  type: object
                type: array
              workcopies:
                description: |-
                  Workcopies overrides the instance-level managed working-copy placement for
                  this gaggle. Root is an absolute base path; the gaggle name is appended.
                properties:
                  root:
                    description: Root is an absolute base path for this gaggle's managed
                      working copies.
                    minLength: 1
                    type: string
                required:
                - root
                type: object
            required:
            - backlog
            - isolation
            - project
            type: object
          status:
            description: |-
              GaggleStatus reports the observed state of a Gaggle. The operator (M9) writes
              it via the status subresource.
            properties:
              conditions:
                description: Conditions follow standard k8s conventions; "Ready" summarizes
                  reconcile.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gooberCount:
                description: GooberCount is the number of Goobers currently bound
                  to this gaggle.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: 'Phase is a coarse lifecycle summary: Pending, Ready,
                  or Degraded.'
                type: string
              readyWorkers:
                description: ReadyWorkers is the number of worker Deployments fully
                  available.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
