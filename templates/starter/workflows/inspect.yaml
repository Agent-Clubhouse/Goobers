apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "2.0"
metadata:
  name: inspect
spec:
  gaggle: starter
  triggers:
    - type: manual
  start: inspect
  tasks:
    - name: inspect
      type: deterministic
      goal: Inspect the configured project working copy.
      run:
        command: ["git", "status", "--short"]
