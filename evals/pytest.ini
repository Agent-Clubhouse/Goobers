[pytest]
# Collect across the whole evals/ tree, not just tests/ — sibling child
# issues under the EvalSuite epic (#2662) land their own test directories
# (e.g. adapters/tests/) as they're implemented, and a narrower testpaths
# would silently skip them rather than erroring (#2663/#2674 coordination).
testpaths = .
python_files = validate_schema.py test_*.py *_test.py
norecursedirs = .venv .pytest_cache samples
