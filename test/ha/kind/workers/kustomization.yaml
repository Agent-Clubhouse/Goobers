apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - connection.yaml
  - worker-deployment.yaml
images:
  - name: goobers
    newName: goobers
    newTag: ha-nightly
patches:
  - target:
      kind: WorkerDeployment
      name: goobers
    patch: |-
      - op: replace
        path: /spec/workerOptions/unsafeCustomBuildID
        value: ha-nightly
