cassandra:
  enabled: false
mysql:
  enabled: false
postgresql:
  enabled: false
elasticsearch:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false

server:
  replicaCount: 1
  # Chart 0.74 defaults to the removed dockerize path even for its 1.30 image.
  # Earlier charts ignore these keys; 0.74 uses the built-in sprig renderer.
  configMapsToMount: sprig
  setConfigFilePath: true
  dynamicConfig:
    frontend.workerVersioningWorkflowAPIs:
      - value: true
    system.enableDeploymentVersions:
      - value: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      additionalStores: {}
      default:
        driver: sql
        sql:
          driver: postgres12
          host: temporal-postgres-rw.goobers-temporal.svc
          port: 5432
          database: temporal
          user: temporal
          existingSecret: temporal-postgres-app
          tls:
            enabled: false
            enableHostVerification: false
      visibility:
        driver: sql
        sql:
          driver: postgres12
          host: temporal-postgres-rw.goobers-temporal.svc
          port: 5432
          database: temporal_visibility
          user: temporal
          existingSecret: temporal-postgres-app
          tls:
            enabled: false
            enableHostVerification: false

schema:
  createDatabase:
    enabled: false
  setup:
    enabled: true
  update:
    enabled: true

web:
  enabled: false
