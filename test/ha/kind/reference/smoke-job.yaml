apiVersion: batch/v1
kind: Job
metadata:
  name: goobers-reference-smoke
  namespace: goobers-system
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: goobers
          image: goobers
          imagePullPolicy: Never
          args: ["--help"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
