# Test fixture has no provider/model egress: its model is a local script.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: child-qualification-egress}
spec:
  podSelector: {matchLabels: {goobers.dev/role: stage}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: goobers-cloud}}
          podSelector: {matchLabels: {goobers.dev/role: control}}
      ports: [{protocol: TCP, port: 8080}]
