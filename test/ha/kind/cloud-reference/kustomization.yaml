# Nightly overlay for deploy/reference/goobers-cloud (HA-P3-20). Adds what a
# consumer supplies: the migration backup reference, password auth against the
# kind CNPG cluster (no Entra in kind), and the locally loaded image.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../deploy/reference/goobers-cloud
images:
  - name: goobers
    newName: goobers
    newTag: ha-nightly
configMapGenerator:
  - name: goobers-cloud-migration
    namespace: goobers-cloud
    literals:
      - backup-ref=kind-nightly
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target: {kind: Job, name: goobers-cloud-migrate}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: password
