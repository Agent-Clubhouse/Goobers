# Nightly overlay for deploy/reference/goobers-cloud (HA-P3-20). kind has no
# Entra, so it sets database-auth to password in the shared ConfigMap (both
# migrate and control read it from there); the Entra egress path is covered by
# the rendered NetworkPolicy tests, not by this cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../deploy/reference/goobers-cloud
  - azurite.yaml
images:
  - name: goobers
    newName: goobers
    newTag: ha-nightly
patches:
  - target: {kind: ConfigMap, name: goobers-cloud}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: goobers-cloud
      data:
        instance-id: nightly
        database-auth: password
        object-store-url: http://azurite.goobers-cloud.svc:10000/devstoreaccount1
        object-store-container: goobers
  - target: {kind: Deployment, name: goobers-control}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --object-store-account-name=devstoreaccount1
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --object-store-account-key-file=/var/run/secrets/goobers/object-store/account-key
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: object-store
          mountPath: /var/run/secrets/goobers/object-store
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: object-store
          secret:
            secretName: goobers-cloud-object-store
            defaultMode: 288
            items:
              - key: account-key
                path: account-key
  - target: {kind: ConfigMap, name: goobers-cloud-migration}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: goobers-cloud-migration
      data:
        backup-ref: kind-nightly
