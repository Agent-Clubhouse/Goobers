apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "2.0"
metadata:
  name: default-implement
spec:
  gaggle: example
  triggers:
    - type: schedule
      schedule: "17 * * * *"
  readiness:
    maxConcurrentRuns: 3
    maxRunsPerHour: 5
    maxRunsPerDay: 20
    maxOpenPRs: 4
  start: poll
  tasks:
    - name: poll
      type: deterministic
      goal: Poll CI.
      run:
        command: ["goobers", "ci-poll"]
      inputs:
        kind: "ci-poll"
        prNumber: "1"
      capabilities:
        - provider:pr:write
      next: ci
  gates:
    - name: ci
      evaluator: automated
      automated:
        check: ci-status
        pollIntervalSeconds: 10
      branches:
        pass: ""
        fail: "@abort"
        timeout: "@escalate"
