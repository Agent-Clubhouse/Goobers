apiVersion: goobers.dev/v1alpha1
kind: Workflow
dslVersion: "2.0"
metadata:
  name: implementation
spec:
  gaggle: example
  triggers:
    - type: schedule
      schedule: "11 * * * *"
  start: query
  tasks:
    - name: query
      type: deterministic
      goal: Query work.
      run:
        command: ["query"]
      next: implement
    - name: implement
      type: deterministic
      goal: Implement work.
      run:
        command: ["implement"]
      next: review
  gates:
    - name: review
      evaluator: agentic
      agentic:
        goober: coder
      branches:
        pass: ""
        needs-changes: implement
        fail: "@abort"
